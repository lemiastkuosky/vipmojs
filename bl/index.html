<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18181b">
    <title>VIP BOLOES PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-body: #18181b;       
            --bg-card: #27272a;       
            --bg-input: #3f3f46;      
            --border-color: #3f3f46;
            --text-primary: #f4f4f5;  
            --text-secondary: #a1a1aa;
            
            --primary: #3b82f6;       
            --success: #10b981;       
            --danger: #ef4444;
            
            --radius-md: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);

            /* Cores das Bancas */
            --color-rj: #2563eb;
            --color-nc: #ea580c;
            --color-lk: #7c3aed;
            --color-fd: #059669;
            --color-multi: #eab308;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 15px;
            padding-bottom: 120px; /* Aumentado para o FAB */
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* HEADER & CARDS */
        .header-card {
            background: linear-gradient(145deg, #27272a 0%, #18181b 100%);
            padding: 25px; border-radius: var(--radius-md);
            box-shadow: var(--shadow); margin-bottom: 25px;
            text-align: center; border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }
        .header-card h1 { margin: 0; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.5px; }
        .header-card p { margin: 5px 0 0; color: var(--text-secondary); font-size: 0.85rem; }
        
        .card {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 25px; box-shadow: var(--shadow); margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .card-title {
            font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;
            color: var(--text-primary); border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .card-title i { color: var(--primary); }

        /* INPUTS */
        .grid-bancas {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px;
        }
        .banca-box {
            background: rgba(0,0,0,0.2); padding: 15px;
            border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.05);
        }
        .banca-label {
            display: block; text-align: center; font-weight: 800;
            margin-bottom: 12px; font-size: 0.9rem; padding: 5px;
            border-radius: 6px; color: white; text-transform: uppercase;
        }
        /* Labels de Input com as cores oficiais */
        .lbl-rj { background: var(--color-rj); } 
        .lbl-nc { background: var(--color-nc); }
        .lbl-lk { background: var(--color-lk); } 
        .lbl-fd { background: var(--color-fd); }

        .inputs-row { display: flex; justify-content: space-between; gap: 8px; }
        .input-bola {
            width: 100%; height: 42px; text-align: center; font-size: 18px; font-weight: 700;
            border: 2px solid var(--border-color); border-radius: 10px;
            background: var(--bg-input); color: white; outline: none; -moz-appearance: textfield;
        }
        .input-bola:focus { border-color: var(--primary); background: #1e3a8a; }

        .form-control {
            width: 100%; padding: 14px; background: var(--bg-input);
            border: 1px solid var(--border-color); color: white;
            border-radius: 8px; font-size: 16px; outline: none; margin-bottom: 10px;
        }
        
        /* BOTÕES */
        .action-group { display: flex; gap: 10px; margin-top: 25px; }
        
        .btn-clear {
            width: 100%; background: transparent; color: var(--danger); 
            border: 1px solid var(--danger); padding: 16px; font-size: 16px; font-weight: 700; 
            border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.1); }
        
        .btn-simular {
            font-size: 0.7rem; background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary);
            padding: 4px 8px; border-radius: 4px; cursor: pointer;
        }

        /* ESTATÍSTICAS */
        .stats-container {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .stat-badge {
            background: #333;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ddd;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .stat-badge strong { color: #fbbf24; }

        /* TABELA HÍBRIDA */
        table { width: 100%; border-collapse: collapse; }
        
        /* DESKTOP */
        @media (min-width: 769px) {
            th { 
                background: #18181b; color: var(--text-secondary); 
                padding: 15px; font-size: 0.85rem; text-transform: uppercase; text-align: left; 
            }
            td { padding: 15px; border-bottom: 1px solid var(--border-color); vertical-align: top; }
            .tr-ganhador { background-color: rgba(16, 185, 129, 0.08); }
            .grade-dezenas { display: flex; flex-wrap: wrap; gap: 6px; max-width: 450px; }
            .lista-resultados { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        }

        /* MOBILE */
        @media (max-width: 768px) {
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tr {
                background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
                border-radius: 12px; margin-bottom: 15px; padding: 15px; position: relative;
            }
            .tr-ganhador { 
                background: rgba(16, 185, 129, 0.08) !important;
                border: 1px solid rgba(16, 185, 129, 0.3) !important;
            }
            td { padding: 5px 0; border: none; text-align: left; }
            td:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; padding-bottom: 8px; }
            .grade-dezenas { display: flex; flex-wrap: wrap; gap: 5px; }
            .lista-resultados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        }

        .nome-player { font-weight: 800; color: #60a5fa; font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .contador-jogos { color: #fff; font-size: 11px; font-weight: bold; margin-right: 5px; background: #475569; padding: 2px 6px; border-radius: 4px; }
        .tag-multi { background: #ca8a04; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 700; }

        /* BOLAS DE JOGO - ESTILIZAÇÃO PADRÃO */
        .bola-jogo { 
            width: 28px; height: 28px; line-height: 28px; text-align: center; 
            border-radius: 6px; font-size: 12px; background: #3f3f46; 
            color: var(--text-secondary); font-weight: 700;
        }

        /* --- CORES ESPECÍFICAS DE ACERTO --- */
        .hit-rj { background-color: var(--color-rj); color: white; box-shadow: 0 0 8px rgba(37, 99, 235, 0.5); }
        .hit-nc { background-color: var(--color-nc); color: white; box-shadow: 0 0 8px rgba(234, 88, 12, 0.5); }
        .hit-lk { background-color: var(--color-lk); color: white; box-shadow: 0 0 8px rgba(124, 58, 237, 0.5); }
        .hit-fd { background-color: var(--color-fd); color: white; box-shadow: 0 0 8px rgba(5, 150, 105, 0.5); }
        
        /* Acertou em 2 ou mais bancas = Dourado */
        .hit-multi { 
            background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); 
            color: #422006; 
            font-weight: 800;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.6); 
            border: 1px solid #fef08a;
        }

        .res-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem;
        }
        .res-banca { font-weight: 700; color: var(--text-secondary); margin-right: 5px; }
        .res-qtd { font-weight: 700; }
        .res-qtd.hit { color: var(--success); }
        .res-qtd.zero { color: #52525b; }
        .premio-tag { color: var(--success); font-weight: 800; font-size: 0.7rem; margin-left: auto; }

        .total-box {
            background: #09090b; border: 1px solid var(--border-color); padding: 20px;
            border-radius: var(--radius-md); margin-top: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .total-valor { font-size: 1.6rem; color: var(--success); font-weight: 800; }

        .fab-container { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 100; }
        .fab {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 24px; border-radius: 50px; color: white; 
            font-weight: 700; font-size: 14px; border: none; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .fab-whatsapp { background: #25d366; }
        .fab-copy { background: var(--primary); }
        .fab-print { background: #e11d48; }

        .app-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-secondary);
            font-size: 0.85rem; opacity: 0.8;
        }
        .app-footer strong { color: var(--primary); font-weight: 700; }
        .app-footer i { margin: 0 5px; color: #ef4444; }
        .footer-ver { display: block; font-size: 0.7rem; margin-top: 5px; opacity: 0.5; letter-spacing: 1px; text-transform: uppercase; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">

    <div id="error-box" class="hidden" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #ef4444;">
        <h3 id="error-title">⚠️ Link Inválido</h3>
        <p id="error-msg"></p>
        <br><a href="?" style="color: white; font-weight: bold;">Voltar</a>
    </div>

    <div class="header-card" id="header-card">
        <h1 id="page-title">VIP BOLOES PRO</h1>
        <div id="timer-display" class="hidden" style="margin-top:10px; font-size:0.8rem; opacity:0.7;"></div>
        <p id="page-desc">Validação, gestão e estatísticas.</p>
    </div>

    <div id="admin-panel">
        <div class="card">
            <div class="card-title">
                <span><i class="fas fa-dice"></i> Resultados (Tempo Real)</span>
                <button type="button" class="btn-simular" onclick="simularResultados()">Simular</button>
            </div>
            <div class="grid-bancas">
                <div class="banca-box">
                    <span class="banca-label lbl-rj">RJ</span>
                    <div class="inputs-row" id="inputs-rj"></div>
                </div>
                <div class="banca-box">
                    <span class="banca-label lbl-nc">NC</span>
                    <div class="inputs-row" id="inputs-nc"></div>
                </div>
                <div class="banca-box">
                    <span class="banca-label lbl-lk">LK</span>
                    <div class="inputs-row" id="inputs-lk"></div>
                </div>
                <div class="banca-box">
                    <span class="banca-label lbl-fd">FD</span>
                    <div class="inputs-row" id="inputs-fd"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-sliders-h"></i> Configuração</div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:15px;">
                <div>
                    <label style="font-size:12px; color:#a1a1aa; font-weight:bold; display:block; margin-bottom:5px;">TERNO</label>
                    <input type="number" step="0.01" class="form-control" id="v_terno" value="25.00">
                </div>
                <div>
                    <label style="font-size:12px; color:#a1a1aa; font-weight:bold; display:block; margin-bottom:5px;">QUADRA</label>
                    <input type="number" step="0.01" class="form-control" id="v_quadra" value="250.00">
                </div>
                <div>
                    <label style="font-size:12px; color:#a1a1aa; font-weight:bold; display:block; margin-bottom:5px;">QUINA</label>
                    <input type="number" step="0.01" class="form-control" id="v_quina" value="2500.00">
                </div>
            </div>
            
            <textarea id="lista-jogos" class="form-control" placeholder="Cole a lista aqui..." style="min-height: 150px;"></textarea>
            
            <div class="action-group">
                <button type="button" onclick="limparTudo()" class="btn-clear">
                    <i class="fas fa-trash-alt"></i> LIMPAR MEMÓRIA E CAMPOS
                </button>
            </div>
        </div>
    </div>

    <div id="print-area">
        <div id="results-panel" class="hidden">
            
            <div id="placar-publico" style="margin-bottom: 20px;"></div>
            
            <div class="card" style="padding:0; border:none; background:transparent; box-shadow:none;">
                <h3 style="margin:0 0 10px 0; font-size:1.1rem; color:var(--text-primary);"><i class="fas fa-list-check"></i> Conferência</h3>
                
                <div id="stats-area" class="stats-container hidden"></div>

                <div class="table-container">
                    <table id="tabela-resultados">
                        <thead>
                            <tr><th width="30%">Participante</th><th width="40%">Dezenas</th><th width="30%">Conferência</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="total-box" id="total-box"></div>
        </div>
    </div>

    <footer class="app-footer">
        <div>Criado by <strong>Le Miastkuosky</strong> <i class="fas fa-code"></i></div>
        <span class="footer-ver">Versão 3.0 (Pro)</span>
    </footer>

    <div class="fab-container hidden" id="fab-container">
        <button onclick="copiarTexto()" class="fab fab-copy" id="btn-copy"><i class="fas fa-copy"></i> Copiar</button>
        <button onclick="compartilharZap()" class="fab fab-whatsapp" id="btn-zap"><i class="fab fa-whatsapp"></i> Enviar</button>
    </div>

</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAP5P08sBQ7A79wP37b-PLhCBO591YJPpY",
      authDomain: "vipmojs-836f9.firebaseapp.com",
      databaseURL: "https://vipmojs-836f9-default-rtdb.firebaseio.com",
      projectId: "vipmojs-836f9",
      storageBucket: "vipmojs-836f9.firebasestorage.app",
      messagingSenderId: "187496268275",
      appId: "1:187496268275:web:53e57c82ef90fc603f1286"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentReceiptId = null; 
    let textoZapFinal = "";
    const bancasArr = ['rj', 'nc', 'lk', 'fd'];
    window.jaCelebrou = false; // Controle dos confetes

    window.onload = function() {
        carregarMemoriaLocal(); // Carrega o que foi salvo
        gerarInputsBancas();
        
        // Se já tiver resultados salvos na memória, preenche
        bancasArr.forEach(sigla => {
            for(let i=0; i<5; i++) {
                const salvo = localStorage.getItem(`res_${sigla}_${i}`);
                if(salvo) document.querySelector(`input[data-banca="${sigla}"][data-index="${i}"]`).value = salvo;
            }
        });

        setupRealTimeListeners();
        
        // Se já tiver dados carregados, atualiza a tela
        if(document.getElementById('lista-jogos').value.trim() !== "") {
            atualizarConferenciaEmTempoReal();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const verId = urlParams.get('ver');
        if (verId) {
            carregarRecibo(verId);
        }
    };

    function carregarMemoriaLocal() {
        if(localStorage.getItem('v_terno')) document.getElementById('v_terno').value = localStorage.getItem('v_terno');
        if(localStorage.getItem('v_quadra')) document.getElementById('v_quadra').value = localStorage.getItem('v_quadra');
        if(localStorage.getItem('v_quina')) document.getElementById('v_quina').value = localStorage.getItem('v_quina');
        if(localStorage.getItem('lista_jogos')) document.getElementById('lista-jogos').value = localStorage.getItem('lista_jogos');
    }

    function salvarMemoriaLocal() {
        localStorage.setItem('v_terno', document.getElementById('v_terno').value);
        localStorage.setItem('v_quadra', document.getElementById('v_quadra').value);
        localStorage.setItem('v_quina', document.getElementById('v_quina').value);
        localStorage.setItem('lista_jogos', document.getElementById('lista-jogos').value);
    }

    function gerarInputsBancas() {
        bancasArr.forEach(sigla => {
            const container = document.getElementById(`inputs-${sigla}`);
            for(let i=0; i<5; i++) {
                const input = document.createElement('input');
                input.type = 'tel';
                input.className = 'input-bola';
                input.maxLength = 2;
                input.dataset.banca = sigla;
                input.dataset.index = i;
                
                input.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    // Salva no LocalStorage
                    localStorage.setItem(`res_${sigla}_${i}`, this.value);
                    
                    if(this.value.length === 2) {
                        const next = document.querySelector(`input[data-banca="${sigla}"][data-index="${i+1}"]`);
                        if(next) next.focus();
                    }
                    atualizarConferenciaEmTempoReal();
                });

                input.onblur = function() {
                    if(this.value.length === 1) {
                        this.value = "0" + this.value;
                        localStorage.setItem(`res_${sigla}_${i}`, this.value);
                    }
                    atualizarConferenciaEmTempoReal();
                };
                input.onfocus = function() { if(!this.readOnly) this.value = ''; };
                container.appendChild(input);
            }
        });
    }

    function simularResultados() {
        bancasArr.forEach(sigla => {
            for(let i=0; i<5; i++) {
                // Gera aleatorio de 00 a 99
                let rand = Math.floor(Math.random() * 100).toString().padStart(2, '0');
                const inp = document.querySelector(`input[data-banca="${sigla}"][data-index="${i}"]`);
                inp.value = rand;
                localStorage.setItem(`res_${sigla}_${i}`, rand);
            }
        });
        atualizarConferenciaEmTempoReal();
    }

    function setupRealTimeListeners() {
        const triggers = ['lista-jogos', 'v_terno', 'v_quadra', 'v_quina'];
        triggers.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                salvarMemoriaLocal();
                atualizarConferenciaEmTempoReal();
            });
        });
    }

    function gerarDadosObjeto() {
        let rawLista = document.getElementById('lista-jogos').value;
        rawLista = rawLista.replace(/\n(?=\d{2}\/)/g, ' ');

        const dados = {
            lista: rawLista,
            premios: {
                terno: document.getElementById('v_terno').value,
                quadra: document.getElementById('v_quadra').value,
                quina: document.getElementById('v_quina').value
            },
            resultados: {},
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        bancasArr.forEach(sigla => {
            const inputs = document.querySelectorAll(`input[data-banca="${sigla}"]`);
            const numeros = Array.from(inputs).map(i => i.value).filter(v => v.length === 2);
            if(numeros.length === 5) dados.resultados[sigla.toUpperCase()] = numeros;
        });

        return dados;
    }

    function atualizarConferenciaEmTempoReal() {
        const dados = gerarDadosObjeto();
        if (!dados.lista.trim()) {
            document.getElementById('results-panel').classList.add('hidden');
            document.getElementById('fab-container').classList.add('hidden');
            return;
        }
        renderizarConferencia(dados);
        document.getElementById('results-panel').classList.remove('hidden');
    }

    async function salvarReciboNoFirebase() {
        const dados = gerarDadosObjeto();
        try {
            const novoRef = db.ref('recibos_temp').push();
            await novoRef.set(dados);
            currentReceiptId = novoRef.key;
            renderizarConferencia(dados); 
            return true;
        } catch (e) {
            console.error(e);
            alert("Erro ao gerar link: " + e.message);
            return false;
        }
    }

    async function carregarRecibo(id) {
        document.getElementById('page-title').innerText = '📊 RELATÓRIO VIP BOLOES 📊';
        document.getElementById('page-desc').innerText = 'Visualização segura.';
        document.getElementById('admin-panel').classList.add('hidden'); 
        document.getElementById('results-panel').classList.remove('hidden');
        document.getElementById('fab-container').classList.add('hidden');

        currentReceiptId = id;
        try {
            const snapshot = await db.ref('recibos_temp/' + id).once('value');
            if (!snapshot.exists()) {
                mostrarErro("Recibo não encontrado ou já expirado.");
                return;
            }
            const data = snapshot.val();
            const created = data.timestamp;
            const now = Date.now();
            const diffMinutes = (now - created) / 1000 / 60;
            if (diffMinutes > 20) {
                mostrarErro("🚫 Link Expirado (Válido por 20 min).");
                return;
            }
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.classList.remove('hidden');
            const expiraEm = new Date(created + 20*60000);
            const horaExp = expiraEm.getHours().toString().padStart(2,'0');
            const minExp = expiraEm.getMinutes().toString().padStart(2,'0');
            timerDisplay.innerHTML = `<i class="far fa-clock"></i> Expira às: ${horaExp}:${minExp}`;
            
            montarPlacarPublico(data.resultados);
            renderizarConferencia(data);
        } catch (e) {
            console.error(e);
            mostrarErro("Erro ao carregar: " + e.message);
        }
    }

    function renderizarConferencia(data) {
        const tbody = document.querySelector('#tabela-resultados tbody');
        tbody.innerHTML = '';
        
        const linhas = data.lista.split('\n');
        let totalPago = 0;
        let contador = 0;
        let temGanhador = false;
        
        let zapGanhadores = "";
        let zapGeral = "";
        let zapResultados = "";

        // --- LÓGICA DE ESTATÍSTICAS (NOVO) ---
        const contagemNumeros = {};

        linhas.forEach(linha => {
            const nums = linha.match(/\b\d{2}\b/g) || [];
            nums.forEach(n => {
                contagemNumeros[n] = (contagemNumeros[n] || 0) + 1;
            });
        });
        
        // Ordena e pega Top 5
        const top5 = Object.entries(contagemNumeros)
            .sort((a,b) => b[1] - a[1])
            .slice(0, 8); // Top 8 pra caber na tela
        
        const statsArea = document.getElementById('stats-area');
        if(top5.length > 0) {
            statsArea.innerHTML = top5.map(([num, qtd]) => `
                <div class="stat-badge">
                    <strong>${num}</strong> 
                    <span style="font-size:0.7em">(${qtd}x)</span>
                </div>
            `).join('');
            statsArea.classList.remove('hidden');
        } else {
            statsArea.classList.add('hidden');
        }
        // -------------------------------------

        const bancasComResultado = data.resultados ? Object.keys(data.resultados) : [];

        if (data.resultados) {
            Object.keys(data.resultados).forEach(b => {
                let ico = b==='RJ'?'🔵':(b==='NC'?'🟠':(b==='LK'?'🟣':'🟢'));
                zapResultados += `${ico} *${b}:* ${data.resultados[b].join(' ')}\n`;
            });
        }

        linhas.forEach(linha => {
            const nums = linha.match(/\b\d{2}\b/g) || [];
            if(nums.length < 10) return;

            let bancasJogadas = [];
            const lineUp = linha.toUpperCase();
            if(lineUp.includes('RJ') || lineUp.includes('RIO') || lineUp.includes('PT')) bancasJogadas.push('RJ');
            if(lineUp.includes('NC')) bancasJogadas.push('NC');
            if(lineUp.includes('LK') || lineUp.includes('LOOK')) bancasJogadas.push('LK');
            if(lineUp.includes('FD') || lineUp.includes('FED') || lineUp.includes('FEDERAL')) bancasJogadas.push('FD');
            
            if(bancasJogadas.length === 0) bancasJogadas.push('ND');

            let multi = 1;
            const matchMulti = linha.match(/(\d+)[xX]/);
            if(matchMulti) multi = parseInt(matchMulti[1]);

            let nome = linha
                .replace(/[\d\/\.\-\s]{10,}/, '')    
                .replace(/\d+[xX]/, '')              
                .replace(/RJ|NC|LK|FD|RIO|FED|LOOK|FEDERAL/gi, '') 
                .replace(/[✅➡\/]/g,'')              
                .replace(/[\u0030-\u0039]\uFE0F?\u20E3/g, '') 
                .replace(/🔟/g, '')
                .replace(/[📌▫▪•]/g, '')
                .replace(/-/g, '')  
                .replace(/^[\d\s\.\-\)]+/, '')       
                .trim();
            
            if(nome.length === 0) nome = "Desconhecido";

            let htmlDetalhes = "<div class='lista-resultados'>";
            let textoResumoLinha = [];
            let ganhouLinha = false;

            bancasJogadas.forEach(banca => {
                const resultadoBanca = data.resultados ? data.resultados[banca] : null;
                let qtd = 0;
                
                if(resultadoBanca) {
                    const acertos = nums.filter(n => resultadoBanca.includes(n));
                    qtd = acertos.length;
                }

                let premio = 0;
                let nomePremio = "";
                
                if (resultadoBanca) {
                    if(qtd==3) { premio = data.premios.terno * multi; nomePremio="TERNO 🥉"; }
                    if(qtd==4) { premio = data.premios.quadra * multi; nomePremio="QUADRA 🥈"; }
                    if(qtd>=5) { premio = data.premios.quina * multi; nomePremio="QUINA 🥇"; }
                }

                if(premio > 0) {
                    totalPago += premio;
                    ganhouLinha = true;
                    temGanhador = true;
                    const valFmt = premio.toFixed(2).replace('.',',');
                    zapGanhadores += `👤 *${nome}*\n   ${qtd}x Acertos (${banca}) ⏩ ${nomePremio} - R$ ${valFmt}\n\n`;
                }

                const classHit = qtd > 0 ? 'hit' : 'zero';
                const classPending = !resultadoBanca ? 'opacity:0.5' : '';
                const tagPremio = premio > 0 ? `<span class="premio-tag">${nomePremio}</span>` : '';
                
                htmlDetalhes += `<div class="res-item" style="${classPending}">
                    <span><span class="res-banca">${banca}</span> <span class="res-qtd ${classHit}">${qtd}x</span></span>
                    ${tagPremio}
                </div>`;
                
                if(resultadoBanca) {
                    let txtRes = `${banca}: ${qtd}x`;
                    if(premio > 0) txtRes += " 🏆";
                    textoResumoLinha.push(txtRes);
                }
            });
            htmlDetalhes += "</div>";

            contador++;
            const tr = document.createElement('tr');
            if(ganhouLinha) tr.className = 'tr-ganhador';

            const td1 = document.createElement('td');
            td1.innerHTML = `<div class="nome-player">${nome}</div>
                                <div style="margin-top:2px;">
                                <span class="contador-jogos">#${String(contador).padStart(2,'0')}</span>
                                <span class="tag-multi">${multi}x</span>
                                </div>`;

            const td2 = document.createElement('td');
            let htmlBolas = '<div class="grade-dezenas">';
            
            nums.forEach(n => {
                let hitBancas = [];
                bancasJogadas.forEach(b => {
                    if(data.resultados && data.resultados[b] && data.resultados[b].includes(n)) {
                        hitBancas.push(b);
                    }
                });

                let className = 'bola-jogo';
                if(hitBancas.length > 1) {
                    className += ' hit-multi'; 
                } else if (hitBancas.length === 1) {
                    className += ' hit-' + hitBancas[0].toLowerCase();
                }

                htmlBolas += `<div class="${className}">${n}</div>`;
            });
            
            htmlBolas += '</div>';
            td2.innerHTML = htmlBolas;

            const td3 = document.createElement('td');
            td3.innerHTML = htmlDetalhes;

            tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
            tbody.appendChild(tr);
            
            if(textoResumoLinha.length > 0) {
                let linhaZap = `${nome} (${multi}x) ➡ ${textoResumoLinha.join(' | ')}`;
                if(ganhouLinha) linhaZap += " (Cota Ganhadora)";
                zapGeral += linhaZap + "\n";
            }
        });

        // --- LÓGICA DE CONFETE (NOVO) ---
        if(totalPago > 0 && !window.jaCelebrou) {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#10b981', '#3b82f6', '#facc15']
            });
            window.jaCelebrou = true;
        } else if (totalPago === 0) {
            window.jaCelebrou = false;
        }
        // -------------------------------

        document.getElementById('total-box').innerHTML = `
            <div><span style='color:var(--text-secondary)'>Jogos na Tela</span><br><strong>${contador}</strong></div>
            <div style='text-align:right'><span style='color:var(--text-secondary)'>Pagar</span><br><span class='total-valor'>R$ ${totalPago.toFixed(2).replace('.',',')}</span></div>
        `;

        const hoje = new Date().toLocaleDateString('pt-BR');
        const hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        
        const baseUrl = window.location.origin + window.location.pathname;
        const linkRecibo = currentReceiptId ? `${baseUrl}?ver=${currentReceiptId}` : baseUrl;

        textoZapFinal = `📊 *RELATÓRIO VIP BOLOES* 📊\n\n`;
        textoZapFinal += `━━━━━━━━━━━━━━━━━━\n🏆 *LISTA DE GANHADORES* 🏆\n\n`;
        textoZapFinal += temGanhador ? zapGanhadores : "🐢 *Sem ganhadores nesta rodada*\n\n";
        textoZapFinal += `━━━━━━━━━━━━━━━━━━\n🔢 *RESULTADOS DO DIA*\n\n${zapResultados}`;
        
        if(contador > 0 && bancasComResultado.length > 0) {
            textoZapFinal += `\n━━━━━━━━━━━━━━━━━━\n📋 *CONFERÊNCIA (${bancasComResultado.join('+')})*\n\nJogos:\n${zapGeral}`;
        } else if (contador > 0 && bancasComResultado.length === 0) {
            textoZapFinal += `\n━━━━━━━━━━━━━━━━━━\n📋 *LISTA DE PARTICIPANTES*\n(Aguardando resultados)\n`;
        }

        textoZapFinal += `\n━━━━━━━━━━━━━━━━━━\n🍀 *Boa sorte na próxima!*\n\n`;
        textoZapFinal += `🔗 *Link do Recibo (Válido 20min):*\n${linkRecibo}\n\n`;
        textoZapFinal += `_Gerado em: ${hoje} às ${hora}_`;
        
        document.getElementById('fab-container').classList.remove('hidden');
    }

    function mostrarErro(msg) {
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('results-panel').classList.add('hidden');
        const box = document.getElementById('error-box');
        box.classList.remove('hidden');
        document.getElementById('error-msg').innerHTML = msg;
    }

    function limparTudo() {
        if(confirm("Limpar lista e memória?")) {
            document.getElementById('lista-jogos').value = '';
            document.querySelectorAll('.input-bola').forEach(i => i.value = '');
            currentReceiptId = null; 
            window.jaCelebrou = false;
            
            // Limpa Storage
            localStorage.removeItem('lista_jogos');
            bancasArr.forEach(sigla => {
                for(let i=0; i<5; i++) localStorage.removeItem(`res_${sigla}_${i}`);
            });

            window.history.replaceState({}, document.title, window.location.pathname);
            atualizarConferenciaEmTempoReal(); 
        }
    }

    function montarPlacarPublico(resultados) {
        const divPlacar = document.getElementById('placar-publico');
        
        if (!resultados || Object.keys(resultados).length === 0) {
            divPlacar.innerHTML = '';
            return;
        }

        let html = '<div class="card"><div class="card-title"><i class="fas fa-star"></i> Números Sorteados</div><div class="grid-bancas">';

        const cores = { 'RJ': 'lbl-rj', 'NC': 'lbl-nc', 'LK': 'lbl-lk', 'FD': 'lbl-fd' };

        Object.keys(resultados).forEach(sigla => {
            const numeros = resultados[sigla];
            const classeCor = cores[sigla] || 'lbl-rj';
            
            html += `
                <div class="banca-box" style="background: rgba(255,255,255,0.05);">
                    <span class="banca-label ${classeCor}">${sigla}</span>
                    <div style="display:flex; justify-content:center; gap:5px; margin-top:10px;">
                        ${numeros.map(n => `<div class="bola-jogo hit" style="width:35px; height:35px; line-height:35px; font-size:16px;">${n}</div>`).join('')}
                    </div>
                </div>
            `;
        });

        html += '</div></div>';
        divPlacar.innerHTML = html;
    }

    // --- NOVA FUNÇÃO DE GERAR IMAGEM ---
    function gerarImagem() {
        const btn = document.getElementById('btn-print');
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="loader"></span>';

        const elemento = document.getElementById('print-area');
        
        html2canvas(elemento, { 
            backgroundColor: "#18181b",
            scale: 2 // Melhora qualidade
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `VipBoloes_Relatorio.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.innerHTML = original;
        }).catch(err => {
            alert("Erro ao criar imagem");
            btn.innerHTML = original;
        });
    }

    async function copiarTexto() {
        const btn = document.getElementById('btn-copy');
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="loader"></span> Gerando...';
        await salvarReciboNoFirebase();
        navigator.clipboard.writeText(textoZapFinal).then(() => {
            btn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => btn.innerHTML = original, 2000);
        });
    }
    
    async function compartilharZap() {
        const btn = document.getElementById('btn-zap');
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="loader"></span> Gerando...';
        await salvarReciboNoFirebase();
        btn.innerHTML = original;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoZapFinal)}`, '_blank');
    }
</script>
