<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4BASE - Relatórios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        /* --- TEMA PADRÃO --- */
        :root {
            --bg-body: #f4f6f9; --bg-card: #ffffff; --text-primary: #212529;
            --border-color: #dee2e6; --table-bg: #ffffff; --table-text: #212529;
        }
        body.dark-mode {
            --bg-body: #121212; --bg-card: #1e1e1e; --text-primary: #e0e0e0;
            --border-color: #444; --table-bg: #1e1e1e; --table-text: #e0e0e0;
        }
        body { background-color: var(--bg-body); color: var(--text-primary); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }
        
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; }
        .card-header { background-color: rgba(0,0,0,0.03); border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
        .list-group-item { background-color: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); }

        /* Indicadores Coloridos */
        .bg-gradient-success { background: linear-gradient(45deg, #198754, #20c997); color: white; border: none; }
        .bg-gradient-primary { background: linear-gradient(45deg, #0d6efd, #0dcaf0); color: white; border: none; }
        
        /* Tabela Dark Mode */
        .table { color: var(--table-text); }
        .table-hover tbody tr:hover { color: var(--table-text); background-color: rgba(0,0,0,0.05); }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--bg-card);
            border-top: 1px solid var(--border-color); z-index: 1050; display: flex; justify-content: space-around; padding: 10px 0;
        }
        .nav-item-mobile { text-align: center; color: #6c757d; text-decoration: none; font-size: 0.75rem; }
        .nav-item-mobile i { font-size: 1.5rem; display: block; }
        .nav-item-mobile.active { color: #0d6efd; font-weight: 600; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h4 class="mb-3 fw-bold opacity-75">Financeiro</h4>
    
    <div class="row g-3 mb-4">
        <div class="col-6">
            <div class="card p-3 bg-gradient-success h-100">
                <small class="opacity-75">Lucro Líquido</small>
                <h3 class="mb-0 fw-bold" id="totalLucro">R$ 0,00</h3>
            </div>
        </div>
        <div class="col-6">
            <div class="card p-3 bg-gradient-primary h-100">
                <small class="opacity-75">Faturamento</small>
                <h3 class="mb-0 fw-bold" id="totalFaturamento">R$ 0,00</h3>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Histórico de Vendas</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="opacity-50 small">
                    <tr><th>Data</th><th>Item</th><th>Lucro</th></tr>
                </thead>
                <tbody id="tabelaVendas" class="border-top-0">
                    <tr><td colspan="3" class="text-center p-3 text-muted">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm mb-4 border-danger">
        <div class="card-header bg-danger text-white fw-bold"><i class="bi bi-exclamation-triangle"></i> Repor Estoque</div>
        <ul class="list-group list-group-flush" id="listaEstoqueBaixo">
            <li class="list-group-item text-center text-muted">Verificando...</li>
        </ul>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item-mobile"><i class="bi bi-house"></i> Home</a>
    <a href="cadastro_produto.html" class="nav-item-mobile"><i class="bi bi-box-seam"></i> Estoque</a>
    <a href="registrar_venda.html" class="nav-item-mobile"><i class="bi bi-cart-plus"></i> Vender</a>
    <a href="catalogo.html" class="nav-item-mobile"><i class="bi bi-images"></i> Catálogo</a>
    <a href="relatorios.html" class="nav-item-mobile active"><i class="bi bi-graph-up fs-1 text-primary mt-n2"></i></a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

  const firebaseConfig = { apiKey: "SUA_API_KEY", projectId: "SEU_PROJECT_ID" }; // SUBSTITUA AQUI
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

  async function carregarRelatorios() {
      // Carregar Vendas
      const vendasSnap = await getDocs(collection(db, "vendas"));
      let fat = 0, luc = 0, listaVendas = [];
      
      vendasSnap.forEach(d => {
          const v = d.data();
          fat += v.valor_venda_total || 0;
          luc += v.lucro_final || 0;
          listaVendas.push(v);
      });

      document.getElementById('totalFaturamento').innerText = fat.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
      document.getElementById('totalLucro').innerText = luc.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

      // Ordenar e Renderizar Tabela
      listaVendas.sort((a,b) => b.data_venda.seconds - a.data_venda.seconds);
      const tbody = document.getElementById('tabelaVendas');
      tbody.innerHTML = '';
      
      listaVendas.slice(0, 10).forEach(v => {
          const dt = new Date(v.data_venda.seconds * 1000).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
          const corLucro = v.lucro_final > 0 ? 'text-success' : 'text-danger';
          tbody.innerHTML += `<tr>
              <td class="small text-muted">${dt}</td>
              <td><div class="fw-bold text-truncate" style="max-width:140px">${v.produto_nome}</div><small class="text-muted">${v.plataforma}</small></td>
              <td class="${corLucro} fw-bold">R$ ${v.lucro_final.toFixed(2)}</td>
          </tr>`;
      });

      // Carregar Estoque Baixo
      const prodSnap = await getDocs(collection(db, "produtos"));
      const listaEst = document.getElementById('listaEstoqueBaixo');
      listaEst.innerHTML = '';
      let ok = true;

      prodSnap.forEach(d => {
          const p = d.data();
          if(p.estoque_qtd <= 3) {
              ok = false;
              listaEst.innerHTML += `<li class="list-group-item d-flex justify-content-between">
                  ${p.nome} <span class="badge bg-danger rounded-pill">${p.estoque_qtd} un</span>
              </li>`;
          }
      });
      if(ok) listaEst.innerHTML = '<li class="list-group-item text-center text-success"><i class="bi bi-check-circle"></i> Estoque Saudável</li>';
  }

  carregarRelatorios();
</script>
</body>
</html>
