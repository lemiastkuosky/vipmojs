<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4BASE - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root { --bg: #f4f6f9; --card: #fff; --text: #212529; --text-muted: #6c757d; --input: #fff; --border: #dee2e6; }
        body.dark-mode { --bg: #000; --card: #1c1c1e; --text: #fff; --text-muted: #b0b3b8; --input: #2c2c2e; --border: #3a3a3c; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }
        
        .form-control { background-color: var(--input); border-color: var(--border); color: var(--text); border-radius: 20px; }
        .form-control:focus { background-color: var(--input); color: var(--text); box-shadow: none; border-color: #0d6efd; }

        .card-produto { 
            background-color: var(--card); border: 1px solid var(--border);
            transition: transform 0.2s; border-radius: 12px; overflow: hidden; position: relative;
        }
        .card-produto:hover { transform: translateY(-3px); }
        .card-body { color: var(--text); }

        .img-container {
            height: 180px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.03); position: relative;
        }
        .img-produto { width: 100%; height: 100%; object-fit: cover; }
        
        /* ESTILO ESGOTADO */
        .esgotado { opacity: 0.6; filter: grayscale(1); }
        .badge-esgotado {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg);
            background: #dc3545; color: white; padding: 5px 15px; font-weight: bold; 
            border: 2px solid white; z-index: 10; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); z-index: 1050; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-item-mobile { text-align: center; color: #6c757d; font-size: 0.75rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .nav-item-mobile i { font-size: 1.4rem; margin-bottom: 2px; }
        .nav-item-mobile.active { color: #0d6efd; font-weight: 600; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0 opacity-75">Catálogo</h4>
        <a href="cadastro_produto.html" class="btn btn-primary btn-sm rounded-pill px-3">+ Novo</a>
    </div>

    <input type="text" id="busca" class="form-control mb-4 py-2 px-3" placeholder="🔍 Buscar item...">

    <div class="row g-3" id="gridProdutos">
        <div class="col-12 text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Carregando...</p>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item-mobile"><i class="bi bi-house-door"></i> Home</a>
    <a href="cadastro_produto.html" class="nav-item-mobile"><i class="bi bi-box-seam"></i> Estoque</a>
    <a href="registrar_venda.html" class="nav-item-mobile"><i class="bi bi-cart-plus"></i> Vender</a>
    <a href="catalogo.html" class="nav-item-mobile active"><i class="bi bi-images"></i> Catálogo</a>
    <a href="relatorios.html" class="nav-item-mobile"><i class="bi bi-graph-up"></i> Finan.</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

  const firebaseConfig = { apiKey: "SUA_API_KEY", projectId: "SEU_PROJECT_ID" }; 
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

  let todosProdutos = [];

  function renderizarProdutos(lista) {
      const grid = document.getElementById('gridProdutos');
      grid.innerHTML = '';
      if(lista.length === 0) return grid.innerHTML = '<div class="col-12 text-center text-muted">Nada encontrado.</div>';

      lista.forEach(prod => {
          let btns = `<a href="${prod.foto_url}" target="_blank" download class="btn btn-sm btn-dark w-100 mb-1"><i class="bi bi-download"></i> Foto</a>`;
          if(prod.link_fonte) btns += `<a href="${prod.link_fonte}" target="_blank" class="btn btn-sm btn-outline-secondary w-100 mb-1">STL</a>`;
          if(prod.link_concorrente) btns += `<a href="${prod.link_concorrente}" target="_blank" class="btn btn-sm btn-outline-danger w-100">Concorrente</a>`;

          // LÓGICA DE ESGOTADO
          const isEsgotado = prod.estoque_qtd <= 0;
          const classEsgotado = isEsgotado ? 'esgotado' : '';
          const badgeEsgotado = isEsgotado ? '<div class="badge-esgotado">ESGOTADO</div>' : '';
          const badgePreco = isEsgotado ? '' : `<span class="badge bg-success position-absolute top-0 end-0 m-2">R$ ${prod.preco_venda?.toFixed(0)}</span>`;

          const html = `
            <div class="col-6 col-md-4 col-lg-3">
                <div class="card card-produto h-100 ${classEsgotado}">
                    <div class="img-container">
                        ${badgeEsgotado}
                        <img src="${prod.foto_url}" class="img-produto" loading="lazy">
                        ${badgePreco}
                    </div>
                    <div class="card-body p-2 d-flex flex-column">
                        <h6 class="card-title text-truncate mb-1 fw-bold">${prod.nome}</h6>
                        <small class="text-muted mb-2">Estoque: ${prod.estoque_qtd}</small>
                        <div class="mt-auto">${btns}</div>
                    </div>
                </div>
            </div>`;
          grid.innerHTML += html;
      });
  }

  async function carregarCatalogo() {
      try {
          const qs = await getDocs(collection(db, "produtos"));
          todosProdutos = [];
          qs.forEach((d) => todosProdutos.push({ id: d.id, ...d.data() }));
          renderizarProdutos(todosProdutos);
      } catch (error) { console.error(error); }
  }

  document.getElementById('busca').addEventListener('keyup', (e) => {
      const termo = e.target.value.toLowerCase();
      renderizarProdutos(todosProdutos.filter(p => p.nome.toLowerCase().includes(termo)));
  });

  carregarCatalogo();
</script>
</body>
</html>
