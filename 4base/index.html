<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4BASE - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        /* TEMA */
        :root { --bg: #f4f6f9; --card: #fff; --text: #212529; --input: #fff; --border: #dee2e6; }
        body.dark-mode { --bg: #000; --card: #1c1c1e; --text: #fff; --input: #2c2c2e; --border: #3a3a3c; }

        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; transition: background 0.3s; }
        
        /* CARD PADRÃO */
        .card { 
            background-color: var(--card); 
            border: 1px solid var(--border); 
            color: var(--text); 
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
        }

        .form-control { background-color: var(--input); border-color: var(--border); color: var(--text); border-radius: 10px; padding: 12px; }
        .form-control:focus { background-color: var(--input); color: var(--text); border-color: #0d6efd; box-shadow: none; }
        
        /* BOTÕES DO MENU (GRID) */
        .action-btn { 
            width: 100%;
            height: 130px; /* Altura fixa para ficarem quadrados/cheios */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            color: var(--text); 
            background-color: var(--card);
            border: 1px solid var(--border); 
            border-radius: 20px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }
        .action-btn:hover { 
            border-color: #0d6efd; 
            background-color: rgba(13, 110, 253, 0.05); 
            transform: scale(0.98); 
        }
        .action-btn i {
            font-size: 2.2rem; /* Ícone Grande */
            margin-bottom: 10px;
        }
        .action-btn span {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        /* HEADER & BOTÕES TOPO */
        .navbar-top { background-color: var(--bg); padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-icon-top {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 1.3rem; transition: 0.2s; border: 1px solid var(--border);
            background-color: var(--card); color: var(--text);
        }
        .btn-icon-top:hover { transform: scale(1.1); background-color: var(--input); }

        /* HEADER AZUL */
        .header-card {
            background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%);
            color: white; border: none; padding: 25px; margin-bottom: 20px;
        }

        /* Alertas e Resumo */
        .alert-item { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .alert-item:last-child { border-bottom: none; }
        .badge-estoque { font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; }

        /* Menu Inferior */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); z-index: 1050; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-item-mobile { text-align: center; color: #6c757d; font-size: 0.75rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .nav-item-mobile i { font-size: 1.4rem; margin-bottom: 2px; }
        .nav-item-mobile.active { color: #0d6efd; font-weight: 600; }
        
        body.dark-mode .modal-content { background-color: #1c1c1e; color: #fff; border: 1px solid #333; }
        body.dark-mode .btn-close { filter: invert(1); }
        .btn-custom { background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%); border: none; color: white; padding: 14px 20px; font-weight: 600; border-radius: 12px; width: 100%; }
    </style>
</head>
<body>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0 rounded-3 shadow-lg" role="alert"><div class="d-flex"><div class="toast-body fw-bold"><i class="bi bi-check-circle-fill me-2"></i> Salvo!</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>
    </div>

    <div class="navbar-top">
        <div><h3 class="m-0 fw-bold">4BASE</h3></div>
        <div class="d-flex gap-2">
            <button class="btn-icon-top" onclick="toggleTheme()" id="themeBtn"><i class="bi bi-moon-stars-fill"></i></button>
            <button class="btn-icon-top" data-bs-toggle="modal" data-bs-target="#configModal"><i class="bi bi-gear-fill"></i></button>
        </div>
    </div>

    <div class="container mt-2">
        <div class="card header-card">
            <div class="d-flex align-items-center">
                <div class="me-3 fs-1"><i class="bi bi-person-circle"></i></div>
                <div><h4 class="mb-0 fw-bold">Olá, Le!</h4><small class="opacity-75">Painel de Controle</small></div>
            </div>
        </div>

        <div class="card mb-3 border-danger" id="cardAlertas" style="display: none;">
            <div class="card-header bg-danger text-white fw-bold d-flex justify-content-between">
                <span><i class="bi bi-exclamation-triangle-fill me-2"></i> Atenção ao Estoque</span>
                <span class="badge bg-white text-danger" id="qtdAlertas">0</span>
            </div>
            <div class="card-body p-0" id="listaAlertas"></div>
        </div>

        <div class="card p-3 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div><small class="text-muted fw-bold text-uppercase" style="letter-spacing: 1px;">Patrimônio</small><h2 class="fw-bold text-success m-0" id="valorEstoque">R$ 0,00</h2></div>
                <div class="text-end"><small class="text-muted d-block">Peças</small><span class="fs-4 fw-bold" id="qtdTotalItens">0</span> <span class="small text-muted">un</span></div>
            </div>
        </div>

        <div class="row g-2"> 
            
            <div class="col-6">
                <a href="registrar_venda.html" class="action-btn">
                    <i class="bi bi-cart-plus-fill text-primary"></i>
                    <span>Vender</span>
                </a>
            </div>
            
            <div class="col-6">
                <a href="cadastro_produto.html" class="action-btn">
                    <i class="bi bi-box-seam-fill text-success"></i>
                    <span>Produto</span>
                </a>
            </div>
            
            <div class="col-6">
                <a href="catalogo.html" class="action-btn">
                    <i class="bi bi-images text-warning"></i>
                    <span>Catálogo</span>
                </a>
            </div>
            
            <div class="col-6">
                <a href="relatorios.html" class="action-btn">
                    <i class="bi bi-graph-up-arrow text-info"></i>
                    <span>Relatório</span>
                </a>
            </div>
            
        </div>
        
    </div>

    <div class="modal fade" id="configModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold">Custos Padrão</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body pt-4">
                    <form id="formConfig">
                        <div class="mb-3"><label class="small fw-bold opacity-75">Energia (kWh)</label><input type="text" inputmode="numeric" class="form-control" id="conf_energia" oninput="mascaraMoeda(this)" placeholder="0,00"></div>
                        <div class="row g-3">
                            <div class="col-6"><label class="small fw-bold opacity-75">Kg PLA</label><input type="text" inputmode="numeric" class="form-control" id="conf_pla" oninput="mascaraMoeda(this)"></div>
                            <div class="col-6"><label class="small fw-bold opacity-75">Kg PETG</label><input type="text" inputmode="numeric" class="form-control" id="conf_petg" oninput="mascaraMoeda(this)"></div>
                            <div class="col-6"><label class="small fw-bold opacity-75">Kg ABS</label><input type="text" inputmode="numeric" class="form-control" id="conf_abs" oninput="mascaraMoeda(this)"></div>
                            <div class="col-6"><label class="small fw-bold opacity-75">L Resina</label><input type="text" inputmode="numeric" class="form-control" id="conf_resina" oninput="mascaraMoeda(this)"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0 pb-4 px-3"><button type="button" class="btn-custom" id="btnSalvarConfig" onclick="salvarConfiguracoes()">Salvar Padrões</button></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item-mobile active"><i class="bi bi-house-door"></i> Home</a>
        <a href="cadastro_produto.html" class="nav-item-mobile"><i class="bi bi-box-seam"></i> Estoque</a>
        <a href="registrar_venda.html" class="nav-item-mobile"><i class="bi bi-cart-plus"></i> Vender</a>
        <a href="catalogo.html" class="nav-item-mobile"><i class="bi bi-images"></i> Catálogo</a>
        <a href="relatorios.html" class="nav-item-mobile"><i class="bi bi-graph-up"></i> Finan.</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // SUAS CHAVES DO FIREBASE ATUALIZADAS
        const firebaseConfig = {
          apiKey: "AIzaSyBGiUQoKirSiKMoZPOhHqDJocOyOgYMO7Y",
          authDomain: "slot-414f9.firebaseapp.com",
          projectId: "slot-414f9",
          storageBucket: "slot-414f9.firebasestorage.app",
          messagingSenderId: "327441332699",
          appId: "1:327441332699:web:6c967611e7aa5706bd4ffe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- DASHBOARD LOGIC ---
        async function carregarDashboard() {
            try {
                const snap = await getDocs(collection(db, "produtos"));
                const listaAlertas = document.getElementById('listaAlertas');
                const cardAlertas = document.getElementById('cardAlertas');
                let totalItens = 0, valorEstoque = 0, countAlertas = 0;
                
                listaAlertas.innerHTML = '';
                snap.forEach(doc => {
                    const p = doc.data();
                    const qtd = p.estoque_qtd || 0;
                    totalItens += qtd;
                    valorEstoque += (qtd * (p.preco_venda || 0));

                    if(qtd <= 2) {
                        countAlertas++;
                        const corBadge = qtd === 0 ? 'bg-danger' : 'bg-warning text-dark';
                        const txt = qtd === 0 ? 'ESGOTADO' : 'Baixo';
                        listaAlertas.innerHTML += `<div class="alert-item"><div><strong>${p.nome}</strong></div><span class="badge ${corBadge} badge-estoque">${qtd} un (${txt})</span></div>`;
                    }
                });

                document.getElementById('valorEstoque').innerText = valorEstoque.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
                document.getElementById('qtdTotalItens').innerText = totalItens;
                if(countAlertas > 0) { cardAlertas.style.display = 'block'; document.getElementById('qtdAlertas').innerText = countAlertas; }
                else { cardAlertas.style.display = 'none'; }
            } catch (error) {
                console.error("Erro ao carregar dashboard:", error);
            }
        }
        window.onload = () => { carregarDashboard(); };

        // UTILS
        window.mascaraMoeda = (i) => { let v = i.value.replace(/\D/g,''); v = (v/100).toFixed(2)+''; v = v.replace(".", ",").replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,").replace(/(\d)(\d{3}),/g, "$1.$2,"); i.value = v; };
        window.lerMoeda = (val) => val ? parseFloat(val.replace(/\./g, '').replace(',', '.')) : 0;

        // TEMA
        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode'); localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.getElementById('themeBtn').innerHTML = document.body.classList.contains('dark-mode') ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-stars-fill"></i>';
        }
        if(localStorage.getItem('theme')==='dark') toggleTheme();

        // SALVAR CONFIG
        window.salvarConfiguracoes = async () => {
            const btn = document.getElementById('btnSalvarConfig');
            const txt = btn.innerHTML; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Salvando...'; btn.disabled = true;
            try {
                await setDoc(doc(db, "configuracoes", "geral"), {
                    kwh_custo: lerMoeda(document.getElementById('conf_energia').value),
                    preco_pla: lerMoeda(document.getElementById('conf_pla').value),
                    preco_petg: lerMoeda(document.getElementById('conf_petg').value),
                    preco_abs: lerMoeda(document.getElementById('conf_abs').value),
                    preco_resina: lerMoeda(document.getElementById('conf_resina').value)
                });
                bootstrap.Modal.getInstance(document.getElementById('configModal')).hide();
                new bootstrap.Toast(document.getElementById('liveToast')).show();
            } catch (e) { alert("Erro: " + e.message); } finally { btn.innerHTML = txt; btn.disabled = false; }
        };

        // CARREGAR CONFIG NO MODAL
        const modalEl = document.getElementById('configModal');
        modalEl.addEventListener('show.bs.modal', async () => {
            const snap = await getDoc(doc(db, "configuracoes", "geral"));
            if (snap.exists()) { const d = snap.data(); const f = (v) => (v||0).toFixed(2).replace('.',','); document.getElementById('conf_energia').value = f(d.kwh_custo); document.getElementById('conf_pla').value = f(d.preco_pla); document.getElementById('conf_petg').value = f(d.preco_petg); document.getElementById('conf_abs').value = f(d.preco_abs); document.getElementById('conf_resina').value = f(d.preco_resina); }
        });
    </script>
</body>
</html>
