<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Scanner de Jogos</title>
</head>
<body>
    <h1>Jogos Filtrados</h1>
    <button id="btnBuscar">Buscar Oportunidades</button>
    <div id="resultados">
        </div>

    <script>
        document.getElementById('btnBuscar').addEventListener('click', function() {
            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.innerHTML = '<p>Buscando...</p>';

            // 1. Chama o script PHP que está na MESMA pasta
            fetch('buscar-jogos.php') 
                .then(response => {
                    // Verifica se a resposta da rede foi OK
                    if (!response.ok) {
                        // response.statusText dá o erro (ex: "Forbidden", "Not Found")
                        throw new Error('Erro de rede: ' + response.statusText);
                    }
                    // Tenta ler a resposta como JSON
                    return response.json(); 
                })
                .then(jogosFiltrados => {
                    // 5. Exibe os resultados
                    let html = '';
                    if (jogosFiltrados.length === 0) {
                        html = '<p>Nenhum jogo encontrado nos critérios (70-80 min, 2+ gols).</p>';
                    } else {
                        jogosFiltrados.forEach(jogo => {
                            html += `<p><b>🚨 ALERTA:</b> ${jogo.casa} vs ${jogo.fora} (<b>${jogo.placar}</b>) - ${jogo.minuto}'</p>`;
                        });
                    }
                    resultadosDiv.innerHTML = html;
                })
                .catch(error => {
                    // Captura erros (seja de rede ou de JSON)
                    console.error('Erro ao buscar jogos:', error);
                    // O 'error.message' vai mostrar o "Unexpected token '<'..." se o PHP falhar
                    resultadosDiv.innerHTML = `<p style="color:red;"><b>Erro:</b> ${error.message}. <br>Verifique se o PHP está rodando (teste do info.php).</p>`;
                });
        });
    </script>
</body>
</html>
