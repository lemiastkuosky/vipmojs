<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Busca HTML (v28)</title>
    <style>
        :root {
            --bg-color: #1e1e1e; --panel-bg-color: #282a36; --input-bg-color: #44475a;
            --text-color: #f8f8f2; --border-color: #44475a;
            --highlight-bg: #e7c547;
            --highlight-text: #282a36;
            --current-highlight-bg: #F92672;
            --current-highlight-outline: #f8f8f2;
            --button-bg: #007bff; --button-hover-bg: #0056b3; --font-mono: 'Courier New', Courier, monospace;
            --header-button-bg: #44475a; --header-button-hover-bg: #6272a4;
            --secondary-button-bg: #6c757d; --secondary-button-hover-bg: #5a6268;
            --footer-text-color: #6272a4;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
        h1 { text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-grow: 1; }
        .panel { flex: 1; background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        .panel-header h2 { margin: 0; padding: 0; border: none; }
        .button-group { display: flex; gap: 10px; }
        .header-button { background-color: var(--header-button-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; transition: background-color 0.2s, color 0.2s; min-width: 60px; text-align: center; }
        .header-button:hover { background-color: var(--header-button-hover-bg); }
        .full-area { width: 100%; font-family: var(--font-mono); font-size: 14px; line-height: 1.5; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; box-sizing: border-box; background-color: var(--input-bg-color); color: var(--text-color); flex-grow: 1; }
        textarea.full-area { resize: none; }
        #highlightedDisplay { white-space: pre-wrap; word-break: break-all; overflow-y: auto; }
        .regular-textarea-container { margin-top: 15px; display: flex; flex-direction: column; }
        .regular-textarea { width: 100%; font-size: 14px; line-height: 1.5; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; box-sizing: border-box; resize: vertical; background-color: var(--input-bg-color); color: var(--text-color); font-family: var(--font-mono); }
        .highlight { background-color: var(--highlight-bg); color: var(--highlight-text); border-radius: 3px; padding: 1px 0; transition: all 0.2s ease-in-out; }
        .current-highlight { background-color: var(--current-highlight-bg); color: var(--text-color); outline: 2px solid var(--current-highlight-outline); outline-offset: 2px; }
        .action-button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: var(--text-color); border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; transition: background-color 0.2s; }
        #replaceAllButton { background-color: var(--button-bg); }
        #replaceAllButton:hover { background-color: var(--button-hover-bg); }
        #findNextButton { padding: 8px; font-size: 14px; background-color: var(--secondary-button-bg); margin-top: 10px; }
        #findNextButton:hover { background-color: var(--secondary-button-hover-bg); }
        footer { text-align: center; padding: 20px 0 0 0; margin-top: 20px; border-top: 1px solid var(--border-color); color: var(--footer-text-color); font-size: 14px; }
    </style>
</head>
<body>

    <h1>Ferramenta de Busca HTML</h1>

    <div class="container">
        <div id="input-panel" class="panel">
            <div class="panel-header"> <h2>Texto Original</h2> <div class="button-group"> <button id="pasteButton" class="header-button">Colar</button> <button id="clearButton" class="header-button">Limpar</button> </div> </div>
            <textarea id="sourceTextarea" class="full-area" placeholder="Cole aqui o texto completo..."></textarea>
            <div class="regular-textarea-container">
                <div class="panel-header" style="margin-bottom: 0; border: none;"> <h2>Localizar por</h2></div>
                <textarea id="searchInput" class="regular-textarea" placeholder="Texto a ser encontrado..." rows="3"></textarea>
                <button id="findNextButton" class="action-button">Procurar Próximo</button>
            </div>
            <div class="regular-textarea-container"> <h2>Substituir por</h2> <textarea id="replaceInput" class="regular-textarea" placeholder="Novo texto para substituir..." rows="3"></textarea> </div>
            <button id="replaceAllButton" class="action-button">Substituir Todos</button>
        </div>
        <div id="display-panel" class="panel">
            <div class="panel-header"> <h2>Visualização com Destaques</h2> <div class="button-group"> <button id="selectAllButtonDisplay" class="header-button">Selecionar</button> <button id="copyButton" class="header-button">Copiar</button> </div> </div>
            <div id="highlightedDisplay" class="full-area">Aguardando texto...</div>
        </div>
    </div>

    <footer>
        <p>Criado por Le Miastkuosky &copy; <span id="year"></span> | Versão 28.0</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sourceTextarea = document.getElementById('sourceTextarea');
            const searchInput = document.getElementById('searchInput');
            const highlightedDisplay = document.getElementById('highlightedDisplay');
            const replaceInput = document.getElementById('replaceInput');
            const replaceAllButton = document.getElementById('replaceAllButton');
            const pasteButton = document.getElementById('pasteButton');
            const clearButton = document.getElementById('clearButton');
            const selectAllButtonDisplay = document.getElementById('selectAllButtonDisplay');
            const copyButton = document.getElementById('copyButton');
            const findNextButton = document.getElementById('findNextButton');
            const yearSpan = document.getElementById('year');

            let allMatches = [];
            let currentMatchIndex = -1;

            const escapeHTML = (str) => { const p = document.createElement('p'); p.textContent = str; return p.innerHTML; };
            const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            function updateHighlight() {
                allMatches = [];
                currentMatchIndex = -1;
                const sourceText = sourceTextarea.value;
                const query = searchInput.value;
                if (!sourceText) {
                    highlightedDisplay.textContent = 'Aguardando texto...';
                    return;
                }
                const matches = [];
                if (query) {
                    const lowerSource = sourceText.toLowerCase();
                    const lowerQuery = query.toLowerCase();
                    let startIndex = -1;
                    while ((startIndex = lowerSource.indexOf(lowerQuery, startIndex + 1)) !== -1) {
                        matches.push({ start: startIndex, end: startIndex + query.length });
                    }
                }
                let finalHTML = '';
                let currentIndex = 0;
                matches.forEach(match => {
                    finalHTML += escapeHTML(sourceText.substring(currentIndex, match.start));
                    finalHTML += `<span class="highlight">${escapeHTML(sourceText.substring(match.start, match.end))}</span>`;
                    currentIndex = match.end;
                });
                finalHTML += escapeHTML(sourceText.substring(currentIndex));
                highlightedDisplay.innerHTML = finalHTML;
                allMatches = highlightedDisplay.querySelectorAll('.highlight');
                if (allMatches.length > 0) {
                    currentMatchIndex = 0;
                    allMatches[0].classList.add('current-highlight');
                }
            }

            function findNext() {
                if (allMatches.length === 0) return;
                if (currentMatchIndex > -1 && allMatches[currentMatchIndex]) {
                    allMatches[currentMatchIndex].classList.remove('current-highlight');
                }
                currentMatchIndex++;
                if (currentMatchIndex >= allMatches.length) {
                    currentMatchIndex = 0;
                }
                const nextMatchElement = allMatches[currentMatchIndex];
                nextMatchElement.classList.add('current-highlight');
                nextMatchElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            function handleReplaceAll() {
                if (!searchInput.value) { alert('Digite um texto no campo "Localizar por".'); return; }
                try {
                    const pattern = escapeRegExp(searchInput.value);
                    const regex = new RegExp(pattern, 'gi');
                    sourceTextarea.value = sourceTextarea.value.replace(regex, replaceInput.value);
                    updateHighlight();
                } catch(e) { alert("Ocorreu um erro ao substituir."); }
            };

            sourceTextarea.addEventListener('input', updateHighlight);
            searchInput.addEventListener('input', updateHighlight);
            replaceAllButton.addEventListener('click', handleReplaceAll);
            clearButton.addEventListener('click', () => { sourceTextarea.value = ''; updateHighlight(); });
            pasteButton.addEventListener('click', async () => { try { const text = await navigator.clipboard.readText(); sourceTextarea.value = text; updateHighlight(); sourceTextarea.focus(); } catch (err) { alert('Não foi possível ler da área de transferência.'); } });
            selectAllButtonDisplay.addEventListener('click', () => { const range = document.createRange(); range.selectNodeContents(highlightedDisplay); const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range); });
            copyButton.addEventListener('click', async () => { const textToCopy = highlightedDisplay.innerText; if(textToCopy && textToCopy !== 'Aguardando texto...') { try { await navigator.clipboard.writeText(textToCopy); const originalText = copyButton.textContent; copyButton.textContent = 'Copiado!'; setTimeout(() => { copyButton.textContent = originalText; }, 2000); } catch (err) { alert('Não foi possível copiar o texto.'); } } });
            findNextButton.addEventListener('click', findNext);

            if(yearSpan) {
                yearSpan.textContent = new Date().getFullYear();
            }

            updateHighlight();
        });
    </script>
</body>
</html>
