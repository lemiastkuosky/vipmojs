<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Premiação v3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input[type="number"] { width: 95%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1.1em; }
        
        #botoes_container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .botao-premio {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .botao-premio:hover { background: #0056b3; }

        .botao-wpp { display: block; text-align: center; background: #25D366; color: white; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-size: 16px; margin-top: 20px; }
        .resultado { margin-top: 20px; padding: 15px; background: #e9f7ef; border: 1px solid #b6dccb; border-radius: 4px; display: none; }
        
        .divisao-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .form-group input[type="radio"] { margin-right: 5px; }
        .form-group .radio-label { font-weight: normal; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Premiação</h2>
        
        <div class="form-group">
            <label for="valor_base">Valor de Referência (Prêmio para "15")</label>
            <input type="number" step="0.01" id="valor_base" placeholder="Ex: 600" required>
        </div>

        <hr>

        <div class="divisao-box">
            <h4>Regras da Divisão</h4>
            
            <div class="form-group">
                <label for="num_participantes">Nº de Participantes</label>
                <input type="number" id="num_participantes" placeholder="Ex: 10">
            </div>

            <div class="form-group">
                <label>Modo de Divisão:</label>
                <input type="radio" id="modo_pct" name="modo_divisao" value="porcentagem" checked>
                <label for="modo_pct" class="radio-label">Porcentagem (%)</label><br>
                
                <input type="radio" id="modo_fixo" name="modo_divisao" value="fixo">
                <label for="modo_fixo" class="radio-label">Valor Fixo (R$)</label>
            </div>
            
            <div class="form-group">
                <label for="valor_regra_divisao">Valor da Regra (R$ ou %)</label>
                <input type="number" step="0.01" id="valor_regra_divisao" placeholder="Ex: 40 (para %) ou 500 (para R$)">
            </div>
        </div>

        <hr>

        <label style="font-weight: bold;">Clique no botão para calcular TUDO:</label>
        <div id="botoes_container">
            <button class="botao-premio" data-valor="15">15</button>
            <button class="botao-premio" data-valor="30">30</button>
            <button class="botao-premio" data-valor="45">45</button>
            <button class="botao-premio" data-valor="60">60</button>
            <button class="botao-premio" data-valor="75">75</button>
            <button class="botao-premio" data-valor="90">90</button>
            <button class="botao-premio" data-valor="105">105</button>
            <button class="botao-premio" data-valor="120">120</button>
            <button class="botao-premio" data-valor="135">135</button>
            <button class="botao-premio" data-valor="150">150</button>
            <button class="botao-premio" data-valor="165">165</button>
            <button class="botao-premio" data-valor="180">180</button>
            <button class="botao-premio" data-valor="195">195</button>
        </div>

        <div id="resultadoArea" class="resultado">
            </div>
    </div>

    <script>
        
        // --- 1. FUNÇÃO DE FORMATAR MOEDA ---
        function formatar_brl(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // --- 2. LÓGICA PRINCIPAL DA CALCULADORA ---

        const inputValorBase = document.getElementById('valor_base');
        const containerBotoes = document.getElementById('botoes_container');
        const areaResultado = document.getElementById('resultadoArea');
        
        // Inputs da "Parte 2"
        const inputParticipantes = document.getElementById('num_participantes');
        const inputValorRegra = document.getElementById('valor_regra_divisao');

        containerBotoes.addEventListener('click', function(e) {
            
            // Verifica se o que foi clicado foi um 'botao-premio'
            if (e.target.classList.contains('botao-premio')) {
                
                // --- 1. COLETAR VALORES DO FORMULÁRIO ---
                const valor_base = parseFloat(inputValorBase.value) || 0;
                const valor_botao = parseInt(e.target.dataset.valor); 
                
                const num_participantes = parseInt(inputParticipantes.value) || 0;
                const modo_divisao = document.querySelector('input[name="modo_divisao"]:checked').value;
                const valor_regra_divisao = parseFloat(inputValorRegra.value) || 0;

                // --- VALIDAÇÃO ---
                if (valor_base <= 0) {
                    alert('Por favor, insira um Valor de Referência válido.');
                    inputValorBase.focus();
                    return;
                }
                if (num_participantes <= 0) {
                    alert('Por favor, insira um Número de Participantes válido.');
                    inputParticipantes.focus();
                    return;
                }

                // --- 2. CÁLCULO 1 (PRÊMIO TOTAL) ---
                const taxa = valor_base / 15;
                const premio_total = taxa * valor_botao;

                // --- 3. CÁLCULO 2 (VALOR DA DIVISÃO) ---
                let valor_a_dividir = 0;
                let texto_modo = "";

                if (modo_divisao === 'porcentagem') {
                    valor_a_dividir = premio_total * (valor_regra_divisao / 100);
                    texto_modo = `(${valor_regra_divisao}% do total)`;
                } else { // modo 'fixo'
                    valor_a_dividir = valor_regra_divisao;
                    texto_modo = `(Valor Fixo)`;
                }

                let valor_por_participante = 0;
                if (num_participantes > 0) {
                    valor_por_participante = valor_a_dividir / num_participantes;
                }
                
                // --- 4. PREPARAR O TEXTO ---
                const texto_calculo = 
                    `Prêmio Total (Ref. ${valor_botao}): ${formatar_brl(premio_total)}\n` +
                    `--------------------\n` +
                    `VALOR DA DIVISÃO\n` +
                    `Valor a Dividir: ${formatar_brl(valor_a_dividir)} ${texto_modo}\n` +
                    `Nº de Participantes: ${num_participantes}\n\n` +
                    `🏆 Valor p/ Cada: ${formatar_brl(valor_por_participante)}`;

                // --- 5. GERAR LINK E EXIBIR ---
                const texto_whatsapp = `🎉 *PREMIAÇÃO CALCULADA* 🎉\n\n` + texto_calculo;
                const texto_html = texto_whatsapp.replace(/\n/g, '<br>');
                const link_whatsapp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto_whatsapp);

                areaResultado.innerHTML = `
                    <h3>Resumo do Cálculo:</h3>
                    <p>${texto_html}</p>
                    <a href="${link_whatsapp}" target="_blank" class="botao-wpp">
                        🚀 Enviar para o Grupo do WhatsApp
                    </a>
                `;
                
                areaResultado.style.display = 'block'; // Mostra o resultado
            }
        });

    </script>

</body>
</html>
