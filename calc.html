<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bolão v6</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        .form-group { margin-bottom: 15px; }
        .form-group input[type="number"] { width: 95%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1.1em; }

        .botoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .botao-selecao, .botao-premio {
            border: 1px solid #007bff;
            background: #fff;
            color: #007bff;
            padding: 12px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            transition: background 0.2s, color 0.2s;
        }
        .botao-selecao:hover { background: #e6f2ff; }
        .botao-selecao.active { background: #007bff; color: white; }
        .botao-premio { border-color: #28a745; color: #28a745; }
        .botao-premio:hover { background: #e9f7ef; }

        .botao-wpp { display: block; text-align: center; background: #25D366; color: white; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-size: 16px; margin-top: 20px; }
        .resultado { margin-top: 20px; padding: 15px; background: #e9f7ef; border: 1px solid #b6dccb; border-radius: 4px; display: none; }
        
        .divisao-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Bolão (Divisão por Pessoas)</h2>
        
        <label>1. Escolha a Taxa de Administração (%):</label>
        <div id="admin_botoes" class="botoes-grid">
            <button class="botao-selecao active" data-pct="0">0%</button>
            <button class="botao-selecao" data-pct="5">5%</button>
            <button class="botao-selecao" data-pct="10">10%</button>
            <button class="botao-selecao" data-pct="15">15%</button>
            <button class="botao-selecao" data-pct="20">20%</button>
            </div>

        <div class="divisao-box">
            <div class="form-group">
                <label for="pct_1_lugar">Porcentagem 1º Lugar (%):</label>
                <input type="number" id="pct_1_lugar" value="55">
            </div>
            <div class="form-group">
                <label for="num_participantes">Nº de Participantes (para dividir o resto):</label>
                <input type="number" id="num_participantes" value="24">
            </div>
        </div>

        <hr style="margin: 20px 0;">

        <label>3. Clique no valor da Aposta para Calcular:</label>
        <div id="premio_botoes" class="botoes-grid">
            <button class="botao-premio" data-valor="15">15</button>
            <button class="botao-premio" data-valor="30">30</button>
            <button class="botao-premio" data-valor="45">45</button>
            <button class="botao-premio" data-valor="60">60</button>
            <button class="botao-premio" data-valor="75">75</button>
            <button class="botao-premio" data-valor="90">90</button>
            <button class="botao-premio" data-valor="105">105</button>
            <button class="botao-premio" data-valor="120">120</button>
            <button class="botao-premio" data-valor="135">135</button>
            <button class="botao-premio" data-valor="150">150</button>
            <button class="botao-premio" data-valor="165">165</button>
            <button class="botao-premio" data-valor="180">180</button>
            <button class="botao-premio" data-valor="195">195</button>
            <button class="botao-premio" data-valor="300">300</button>
        </div>

        <div id="resultadoArea" class="resultado">
            </div>
    </div>

    <script>
        
        // --- CONSTANTES DO BOLÃO ---
        const MULTIPLICADOR = 80; // 1200 (prêmio) / 15 (aposta) = 80
        
        // --- VARIÁVEIS DE ESTADO ---
        let taxa_admin_atual = 0; // Começa com 0%

        // --- ELEMENTOS ---
        const containerAdmin = document.getElementById('admin_botoes');
        const containerPremio = document.getElementById('premio_botoes');
        const areaResultado = document.getElementById('resultadoArea');
        const botoesAdmin = containerAdmin.querySelectorAll('.botao-selecao');
        
        // Novos Inputs
        const inputPct1Lugar = document.getElementById('pct_1_lugar');
        const inputNumParticipantes = document.getElementById('num_participantes');

        // --- 1. FUNÇÃO DE FORMATAR MOEDA ---
        function formatar_brl(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // --- 2. LÓGICA DE SELEÇÃO DA TAXA ADMIN ---
        containerAdmin.addEventListener('click', function(e) {
            if (e.target.classList.contains('botao-selecao')) {
                taxa_admin_atual = parseFloat(e.target.dataset.pct);
                botoesAdmin.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
            }
        });

        // --- 3. LÓGICA PRINCIPAL DO CÁLCULO (Atualizada) ---
        containerPremio.addEventListener('click', function(e) {
            if (e.target.classList.contains('botao-premio')) {
                
                // --- 1. COLETAR VALORES ---
                const valor_aposta = parseFloat(e.target.dataset.valor);
                
                // Pega os valores dos novos campos
                const pct_admin = taxa_admin_atual;
                const pct_1_lugar = parseFloat(inputPct1Lugar.value) || 0;
                const num_participantes = parseInt(inputNumParticipantes.value) || 0;

                // Validação
                if (num_participantes <= 0) {
                    alert('Por favor, insira um Nº de Participantes válido.');
                    inputNumParticipantes.focus();
                    return;
                }
                
                // --- 2. CÁLCULO 1 (PRÊMIO BRUTO) ---
                const premio_bruto = valor_aposta * MULTIPLICADOR; // Ex: 15 * 80 = 1200
                
                // --- 3. CÁLCULO 2 (DESCONTOS) ---
                // ATENÇÃO: Os descontos são baseados no PRÊMIO BRUTO
                const valor_1_lugar = premio_bruto * (pct_1_lugar / 100); // Ex: 1200 * 0.55 = 660
                const valor_taxa_admin = premio_bruto * (pct_admin / 100); // Ex: 1200 * 0.10 = 120

                // --- 4. CÁLCULO 3 (SOBRA) ---
                const premio_restante = premio_bruto - valor_1_lugar - valor_taxa_admin; // Ex: 1200 - 660 - 120 = 420

                // --- 5. CÁLCULO 4 (DIVISÃO FINAL) ---
                const valor_por_participante = premio_restante / num_participantes; // Ex: 420 / 24 = 17.50

                // --- 6. PREPARAR O TEXTO ---
                const texto_calculo = 
                    `Prêmio Bruto (Ref. ${valor_aposta}): ${formatar_brl(premio_bruto)}\n` +
                    `--------------------\n` +
                    `🏆 1º Lugar (${pct_1_lugar}%): -${formatar_brl(valor_1_lugar)}\n` +
                    `⚙️ Admin (${pct_admin}%): -${formatar_brl(valor_taxa_admin)}\n` +
                    `Restante (a dividir): ${formatar_brl(premio_restante)}\n` +
                    `Divisão por ${num_participantes} participantes\n\n` +
                    `💰 Valor p/ Participante: ${formatar_brl(valor_por_participante)}`;

                // --- 7. GERAR LINK E EXIBIR ---
                const texto_whatsapp = `🎉 *BOLÃO PREMIADO (Ref. ${valor_aposta})* 🎉\n\n` + texto_calculo;
                const texto_html = texto_whatsapp.replace(/\n/g, '<br>');
                const link_whatsapp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto_whatsapp);

                areaResultado.innerHTML = `
                    <h3>Resumo do Cálculo:</h3>
                    <p>${texto_html}</p>
                    <a href="${link_whatsapp}" target="_blank" class="botao-wpp">
                        🚀 Enviar para o Grupo do WhatsApp
                    </a>
                `;
                
                areaResultado.style.display = 'block';
            }
        });

    </script>

</body>
</html>
