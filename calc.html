<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bolão v16 (Modal Config)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        .form-group { margin-bottom: 15px; }
        .form-group input[type="number"],
        .form-group select { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1.1em;
            box-sizing: border-box; 
        }

        .botoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .botao-premio {
            border: 1px solid #28a745; background: #fff; color: #28a745;
            padding: 12px 10px; border-radius: 4px; cursor: pointer;
            font-size: 16px; font-weight: bold; text-align: center; transition: background 0.2s, color 0.2s;
        }
        .botao-premio:hover { background: #e9f7ef; }
        .botao-premio.active {
            background: #28a745;
            color: white;
        }

        .botao-wpp { display: block; text-align: center; background: #25D366; color: white; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-size: 16px; margin-top: 20px; }
        .resultado { margin-top: 20px; padding: 15px; background: #e9f7ef; border: 1px solid #b6dccb; border-radius: 4px; display: none; }
        
        .divisao-box {
            background: #f9f9f9; border: 1px solid #eee; padding: 15px;
            border-radius: 5px; margin-top: 20px;
        }
        
        .botao-config {
            background: #6c757d; color: white; border: none; padding: 10px 15px;
            border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px;
        }
        .botao-config:hover { background: #5a6268; }
        
        /* --- NOVO: ESTILOS DO MODAL DE CONFIGURAÇÃO --- */
        .modal-overlay {
            display: none; /* Começa escondido */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin-top: 0; }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #saveConfig { background: #007bff; color: white; }
        #cancelConfig { background: #6c757d; color: white; }
        /* --- FIM DOS ESTILOS DO MODAL --- */
        
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Bolão (Salva Estado)</h2>
        
        <div class="form-group">
            <label for="select_taxa_admin">1. Taxa de Administração (%):</label>
            <select id="select_taxa_admin"></select>
        </div>

        <div class="divisao-box">
            <div class="form-group">
                <label for="pct_1_lugar">Porcentagem 1º Lugar (%):</label>
                <input type="number" id="pct_1_lugar">
            </div>
            
            <div class="form-group">
                <label for="num_participantes">Nº de Participantes *Reais* (p/ dividir):</label>
                <input type="number" id="num_participantes" value="24">
            </div>
            
            <button id="configButton" class="botao-config">⚙️ Configurar Regras de Bônus</button>
        </div>

        <hr style="margin: 20px 0;">

        <label>3. Clique na Aposta para Calcular:</label>
        <div id="premio_botoes" class="botoes-grid">
            <button class="botao-premio" data-valor="15">15</button>
            <button class="botao-premio" data-valor="30">30</button>
            <button class="botao-premio" data-valor="45">45</button>
            <button class="botao-premio" data-valor="60">60</button>
            <button class="botao-premio" data-valor="75">75</button>
            <button class="botao-premio" data-valor="90">90</button>
            <button class="botao-premio" data-valor="105">105</button>
            <button class="botao-premio" data-valor="120">120</button>
            <button class="botao-premio" data-valor="135">135</button>
            <button class="botao-premio" data-valor="150">150</button>
            <button class="botao-premio" data-valor="165">165</button>
            <button class="botao-premio" data-valor="180">180</button>
            <button class="botao-premio" data-valor="195">195</button>
            <button class="botao-premio" data-valor="300">300</button>
        </div>

        <div id="resultadoArea" class="resultado"></div>
    </div>

    <div id="configModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Configurar Regras de Bônus</h2>
            <p>Defina os valores usados para calcular o bônus de participantes faltantes.</p>
            
            <div class="form-group">
                <label for="inputBaseParticipantesModal">Total de Cotas (Base p/ Bônus):</label>
                <input type="number" id="inputBaseParticipantesModal">
            </div>
            
            <div class="form-group">
                <label for="inputBonus1Lugar">Bônus p/ 1º Lugar (R$ por faltante):</label>
                <input type="number" id="inputBonus1Lugar">
            </div>
            
            <div class="form-group">
                <label for="inputBonusAdmin">Bônus p/ Admin (R$ por faltante):</label>
                <input type="number" id="inputBonusAdmin">
            </div>
            
            <div class="form-group">
                <label for="inputBonusPote">Bônus p/ Pote (R$ por faltante):</label>
                <input type="number" id="inputBonusPote">
            </div>
            
            <div class="modal-buttons">
                <button id="cancelConfig">Cancelar</button>
                <button id="saveConfig">Salvar Alterações</button>
            </div>
        </div>
    </div>
    <script>
        
        // --- CONSTANTES ---
        const MULTIPLICADOR = 80;
        
        // Chaves do LocalStorage
        const STORAGE_KEY_ADMIN = 'bolaoAdminPct_v16';
        const STORAGE_KEY_1ST = 'bolao1stPct_v16';
        const STORAGE_KEY_BASE = 'bolaoBase_v16';
        const STORAGE_KEY_BONUS_1ST = 'bolaoBonus1st_v16';
        const STORAGE_KEY_BONUS_ADMIN = 'bolaoBonusAdmin_v16';
        const STORAGE_KEY_BONUS_POTE = 'bolaoBonusPote_v16';

        // --- VARIÁVEIS DE ESTADO (Carregadas ao iniciar) ---
        let apostaAtual = 0;
        let valor1LugarOriginal = "50";
        
        // Variáveis de Bônus (agora são 'let' e não 'const')
        let valorBaseParticipantes = 24;
        let bonus1Lugar = 12;
        let bonusAdmin = 6;
        let bonusPote = 3;

        // --- ELEMENTOS ---
        const selectTaxaAdmin = document.getElementById('select_taxa_admin');
        const containerPremio = document.getElementById('premio_botoes');
        const premioBotoes = containerPremio.querySelectorAll('.botao-premio');
        const areaResultado = document.getElementById('resultadoArea');
        
        const inputPct1Lugar = document.getElementById('pct_1_lugar');
        const inputNumParticipantes = document.getElementById('num_participantes');
        
        // Elementos do Modal
        const configButton = document.getElementById('configButton');
        const configModal = document.getElementById('configModal');
        const saveConfig = document.getElementById('saveConfig');
        const cancelConfig = document.getElementById('cancelConfig');
        const inputBaseParticipantesModal = document.getElementById('inputBaseParticipantesModal');
        const inputBonus1Lugar = document.getElementById('inputBonus1Lugar');
        const inputBonusAdmin = document.getElementById('inputBonusAdmin');
        const inputBonusPote = document.getElementById('inputBonusPote');


        // --- 1. FUNÇÃO DE PREENCHER O SELECT (5 em 5) ---
        function popularSelectAdmin() {
            for (let i = 0; i <= 100; i += 5) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i + '%';
                selectTaxaAdmin.appendChild(option);
            }
        }
        
        // --- 2. FUNÇÃO DE FORMATAR MOEDA ---
        function formatar_brl(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // --- 3. FUNÇÃO PRINCIPAL DE CÁLCULO (Atualizada) ---
        function calcularEAtualizar() {
            if (apostaAtual === 0) return;

            const valor_aposta = apostaAtual;
            const pct_admin_base = parseFloat(selectTaxaAdmin.value) || 0;
            const pct_1_lugar = parseFloat(inputPct1Lugar.value) || 0;
            const base_participantes = valorBaseParticipantes; // Lê da variável global
            const num_participantes_atual = parseInt(inputNumParticipantes.value) || 0;

            if (num_participantes_atual < 0) return;
            
            const premio_bruto = valor_aposta * MULTIPLICADOR;
            const valor_1_lugar_base = premio_bruto * (pct_1_lugar / 100);
            const valor_admin_base = premio_bruto * (pct_admin_base / 100);

            const participantes_faltantes = Math.max(0, base_participantes - num_participantes_atual); 
            
            let bns_1_lugar_calc = 0;
            let bns_admin_calc = 0;
            let bns_pote_calc = 0;

            if (participantes_faltantes > 0) {
                // Lê das variáveis globais de bônus
                bns_1_lugar_calc = participantes_faltantes * bonus1Lugar; 
                bns_admin_calc = participantes_faltantes * bonusAdmin;
                bns_pote_calc = participantes_faltantes * bonusPote;
            }

            const total_1_lugar = valor_1_lugar_base + bns_1_lugar_calc;
            const total_admin = valor_admin_base + bns_admin_calc;
            
            const premio_restante_base = premio_bruto - total_1_lugar - total_admin;
            const pote_final_divisao = premio_restante_base + bns_pote_calc; 

            let valor_por_participante = 0;
            let texto_calculo = "";

            if (num_participantes_atual === 0 && base_participantes > 0) {
                const total_1_lugar_final = total_1_lugar + pote_final_divisao;
                texto_calculo = 
                    `Prêmio Bruto (Ref. ${valor_aposta}): ${formatar_brl(premio_bruto)}\n` +
                    `--------------------\n` +
                    `⚙️ Admin (${pct_admin_base}%): -${formatar_brl(valor_admin_base)}\n` +
                    `🔩 Bônus Admin (${participantes_faltantes} faltantes): -${formatar_brl(bns_admin_calc)}\n` +
                    `Total Admin: ${formatar_brl(total_admin)}\n` +
                    `--------------------\n` +
                    `🏆 1º Lugar (Leva TUDO restante): ${formatar_brl(total_1_lugar_final)}\n\n` +
                    `(Base: ${formatar_brl(valor_1_lugar_base)}, Bônus: ${formatar_brl(bns_1_lugar_calc)}, Resto: ${formatar_brl(pote_final_divisao)})`;
            } else {
                if (num_participantes_atual > 0) {
                    valor_por_participante = pote_final_divisao / num_participantes_atual;
                }
                
                texto_calculo = 
                    `Prêmio Bruto (Ref. ${valor_aposta}): ${formatar_brl(premio_bruto)}\n` +
                    `--------------------\n` +
                    `🏆 1º Lugar (${pct_1_lugar}%): -${formatar_brl(valor_1_lugar_base)}\n` +
                    `⚙️ Admin (${pct_admin_base}%): -${formatar_brl(valor_admin_base)}\n` +
                    `🔩 Bônus (${participantes_faltantes} faltantes):\n` +
                    `   (1º Lugar: +${formatar_brl(bns_1_lugar_calc)})\n` +
                    `   (Admin: +${formatar_brl(bns_admin_calc)})\n` +
                    `   (Pote: +${formatar_brl(bns_pote_calc)})\n` +
                    `--------------------\n` +
                    `Totais Finais:\n` +
                    `🏆 1º Lugar (Total): ${formatar_brl(total_1_lugar)}\n` +
                    `⚙️ Admin (Total): ${formatar_brl(total_admin)}\n` +
                    `--------------------\n` +
                    `Pote Final (a dividir): ${formatar_brl(pote_final_divisao)}\n` +
                    `Divisão por ${num_participantes_atual} participantes\n\n` +
                    `💰 Valor p/ Participante: ${formatar_brl(valor_por_participante)}`;
            }

            const texto_whatsapp = `🎉 *BOLÃO PREMIADO (Ref. ${valor_aposta})* 🎉\n\n` + texto_calculo;
            const texto_html = texto_calculo.replace(/\n/g, '<br>');
            const link_whatsapp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto_whatsapp);

            areaResultado.innerHTML = `
                <h3>Resumo do Cálculo:</h3>
                <p>${texto_html}</p>
                <a href="${link_whatsapp}" target="_blank" class="botao-wpp">
                    🚀 Enviar para o Grupo do WhatsApp
                </a>
            `;
            
            areaResultado.style.display = 'block';
        }

        // --- 4. FUNÇÃO PARA CARREGAR VALORES (ATUALIZADA) ---
        function carregarValoresSalvos() {
            // Padrões
            selectTaxaAdmin.value = localStorage.getItem(STORAGE_KEY_ADMIN) || "20";
            inputPct1Lugar.value = localStorage.getItem(STORAGE_KEY_1ST) || "50";
            valor1LugarOriginal = inputPct1Lugar.value;

            // Padrões de Bônus (agora lidos para as variáveis)
            valorBaseParticipantes = parseInt(localStorage.getItem(STORAGE_KEY_BASE), 10) || 24;
            bonus1Lugar = parseInt(localStorage.getItem(STORAGE_KEY_BONUS_1ST), 10) || 12;
            bonusAdmin = parseInt(localStorage.getItem(STORAGE_KEY_BONUS_ADMIN), 10) || 6;
            bonusPote = parseInt(localStorage.getItem(STORAGE_KEY_BONUS_POTE), 10) || 3;
        }

        // --- 5. CONFIGURAÇÃO DOS EVENT LISTENERS ---
        
        // A. Clique no Botão de Aposta
        containerPremio.addEventListener('click', function(e) {
            if (e.target.classList.contains('botao-premio')) {
                apostaAtual = parseFloat(e.target.dataset.valor);
                premioBotoes.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                calcularEAtualizar();
            }
        });

        // B. Mudança na Taxa Admin
        selectTaxaAdmin.addEventListener('change', function() {
            localStorage.setItem(STORAGE_KEY_ADMIN, selectTaxaAdmin.value);
            calcularEAtualizar();
        });
        
        // C. LÓGICA DE CONFIRMAÇÃO 1º LUGAR
        inputPct1Lugar.addEventListener('focus', function() {
            valor1LugarOriginal = inputPct1Lugar.value;
        });
        inputPct1Lugar.addEventListener('change', function() {
            if (inputPct1Lugar.value !== valor1LugarOriginal) {
                const confirmou = confirm("Tem certeza que quer mudar a '% do 1º Lugar'?\n\nIsso afetará a regra de divisão.");
                if (confirmou) {
                    localStorage.setItem(STORAGE_KEY_1ST, inputPct1Lugar.value);
                    valor1LugarOriginal = inputPct1Lugar.value;
                    calcularEAtualizar();
                } else {
                    inputPct1Lugar.value = valor1LugarOriginal;
                }
            }
        });

        // D. LÓGICA DO MODAL DE CONFIGURAÇÃO (NOVO)
        configButton.addEventListener('click', function() {
            // 1. Preenche o modal com os valores atuais (das variáveis)
            inputBaseParticipantesModal.value = valorBaseParticipantes;
            inputBonus1Lugar.value = bonus1Lugar;
            inputBonusAdmin.value = bonusAdmin;
            inputBonusPote.value = bonusPote;
            
            // 2. Mostra o modal
            configModal.style.display = 'flex';
        });

        cancelConfig.addEventListener('click', function() {
            configModal.style.display = 'none';
        });

        saveConfig.addEventListener('click', function() {
            // 1. Lê os novos valores do modal
            const novaBase = parseInt(inputBaseParticipantesModal.value, 10);
            const novoBonus1 = parseInt(inputBonus1Lugar.value, 10);
            const novoBonusAdmin = parseInt(inputBonusAdmin.value, 10);
            const novoBonusPote = parseInt(inputBonusPote.value, 10);

            // 2. Validação simples
            if (isNaN(novaBase) || isNaN(novoBonus1) || isNaN(novoBonusAdmin) || isNaN(novoBonusPote)) {
                alert("Por favor, preencha todos os campos com números válidos.");
                return;
            }

            // 3. Atualiza as variáveis globais
            valorBaseParticipantes = novaBase;
            bonus1Lugar = novoBonus1;
            bonusAdmin = novoBonusAdmin;
            bonusPote = novoBonusPote;

            // 4. Salva no localStorage
            localStorage.setItem(STORAGE_KEY_BASE, valorBaseParticipantes);
            localStorage.setItem(STORAGE_KEY_BONUS_1ST, bonus1Lugar);
            localStorage.setItem(STORAGE_KEY_BONUS_ADMIN, bonusAdmin);
            localStorage.setItem(STORAGE_KEY_BONUS_POTE, bonusPote);

            // 5. Esconde o modal e recalcula
            configModal.style.display = 'none';
            calcularEAtualizar();
        });

        // E. Nº de Participantes Reais (Apenas calcula)
        inputNumParticipantes.addEventListener('input', calcularEAtualizar);

        // --- INICIALIZAÇÃO ---
        popularSelectAdmin();
        carregarValoresSalvos();

    </script>

</body>
</html>
