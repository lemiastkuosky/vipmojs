<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bolão v5</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        /* Estilo dos Botões de Seleção */
        .botoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .botao-selecao, .botao-premio {
            border: 1px solid #007bff;
            background: #fff;
            color: #007bff;
            padding: 12px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            transition: background 0.2s, color 0.2s;
        }
        .botao-selecao:hover { background: #e6f2ff; }
        
        /* Estilo do botão ATIVO */
        .botao-selecao.active {
            background: #007bff;
            color: white;
        }

        /* Cor diferente para os botões de prêmio */
        .botao-premio {
            border-color: #28a745;
            color: #28a745;
        }
        .botao-premio:hover { background: #e9f7ef; }

        .botao-wpp { display: block; text-align: center; background: #25D366; color: white; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-size: 16px; margin-top: 20px; }
        .resultado { margin-top: 20px; padding: 15px; background: #e9f7ef; border: 1px solid #b6dccb; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Bolão (25 Cotas)</h2>
        
        <label>1. Escolha a Taxa de Administração:</label>
        <div id="admin_botoes" class="botoes-grid">
            <button class="botao-selecao active" data-pct="0">0%</button>
            <button class="botao-selecao" data-pct="5">5%</button>
            <button class="botao-selecao" data-pct="10">10%</button>
            <button class="botao-selecao" data-pct="15">15%</button>
            <button class="botao-selecao" data-pct="20">20%</button>
            <button class="botao-selecao" data-pct="25">25%</button>
            </div>

        <hr style="margin: 20px 0;">

        <label>2. Clique no valor da Aposta para Calcular:</label>
        <div id="premio_botoes" class="botoes-grid">
            <button class="botao-premio" data-valor="15">15</button>
            <button class="botao-premio" data-valor="30">30</button>
            <button class="botao-premio" data-valor="45">45</button>
            <button class="botao-premio" data-valor="60">60</button>
            <button class="botao-premio" data-valor="75">75</button>
            <button class="botao-premio" data-valor="90">90</button>
            <button class="botao-premio" data-valor="105">105</button>
            <button class="botao-premio" data-valor="120">120</button>
            <button class="botao-premio" data-valor="135">135</button>
            <button class="botao-premio" data-valor="150">150</button>
            <button class="botao-premio" data-valor="165">165</button>
            <button class="botao-premio" data-valor="180">180</button>
            <button class="botao-premio" data-valor="195">195</button>
            <button class="botao-premio" data-valor="210">210</button>
            <button class="botao-premio" data-valor="225">225</button>
            <button class="botao-premio" data-valor="240">240</button>
            <button class="botao-premio" data-valor="255">255</button>
            <button class="botao-premio" data-valor="270">270</button>
            <button class="botao-premio" data-valor="285">285</button>
            <button class="botao-premio" data-valor="300">300</button>
        </div>

        <div id="resultadoArea" class="resultado">
            </div>
    </div>

    <script>
        
        // --- CONSTANTES DO BOLÃO ---
        const MULTIPLICADOR = 80; // 1200 (prêmio) / 15 (aposta) = 80
        const COTAS_DIVISAO = 25; // 25 bichos
        
        // --- VARIÁVEIS DE ESTADO ---
        let taxa_admin_atual = 0; // Começa com 0%

        // --- ELEMENTOS ---
        const containerAdmin = document.getElementById('admin_botoes');
        const containerPremio = document.getElementById('premio_botoes');
        const areaResultado = document.getElementById('resultadoArea');
        const botoesAdmin = containerAdmin.querySelectorAll('.botao-selecao');

        // --- 1. FUNÇÃO DE FORMATAR MOEDA ---
        function formatar_brl(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // --- 2. LÓGICA DE SELEÇÃO DA TAXA ADMIN ---
        containerAdmin.addEventListener('click', function(e) {
            if (e.target.classList.contains('botao-selecao')) {
                // Pega o valor do botão clicado
                taxa_admin_atual = parseFloat(e.target.dataset.pct);
                
                // Atualiza o visual (remove 'active' de todos, adiciona no clicado)
                botoesAdmin.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
            }
        });

        // --- 3. LÓGICA PRINCIPAL DO CÁLCULO ---
        containerPremio.addEventListener('click', function(e) {
            if (e.target.classList.contains('botao-premio')) {
                
                // --- 1. COLETAR VALORES ---
                const valor_aposta = parseFloat(e.target.dataset.valor); // Ex: 60
                const pct_admin = taxa_admin_atual; // Ex: 10
                
                // --- 2. CÁLCULO 1 (PRÊMIO BRUTO) ---
                const premio_bruto = valor_aposta * MULTIPLICADOR; // Ex: 60 * 80 = 4800
                
                // --- 3. CÁLCULO 2 (LÍQUIDO) ---
                const valor_taxa_admin = premio_bruto * (pct_admin / 100); // Ex: 4800 * 0.10 = 480
                const premio_liquido = premio_bruto - valor_taxa_admin; // Ex: 4800 - 480 = 4320

                // --- 4. CÁLCULO 3 (DIVISÃO POR COTA) ---
                const valor_por_cota = premio_liquido / COTAS_DIVISAO; // Ex: 4320 / 25 = 172.80

                // --- 5. PREPARAR O TEXTO ---
                const texto_calculo = 
                    `Aposta Referência: ${valor_aposta}\n` +
                    `Prêmio Bruto: ${formatar_brl(premio_bruto)}\n` +
                    `--------------------\n` +
                    `Taxa Admin (${pct_admin}%): -${formatar_brl(valor_taxa_admin)}\n` +
                    `Prêmio Líquido: ${formatar_brl(premio_liquido)}\n` +
                    `Divisão por ${COTAS_DIVISAO} cotas\n\n` +
                    `🏆 Valor p/ Cota: ${formatar_brl(valor_por_cota)}`;

                // --- 6. GERAR LINK E EXIBIR ---
                const texto_whatsapp = `🎉 *BOLÃO PREMIADO (Ref. ${valor_aposta})* 🎉\n\n` + texto_calculo;
                const texto_html = texto_whatsapp.replace(/\n/g, '<br>');
                const link_whatsapp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto_whatsapp);

                areaResultado.innerHTML = `
                    <h3>Resumo do Cálculo:</h3>
                    <p>${texto_html}</p>
                    <a href="${link_whatsapp}" target="_blank" class="botao-wpp">
                        🚀 Enviar para o Grupo do WhatsApp
                    </a>
                `;
                
                areaResultado.style.display = 'block'; // Mostra o resultado
            }
        });

    </script>

</body>
</html>
