<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Apostas Firebase</title>
    <style>
        /* Estilos básicos para ficar bonito */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            padding-top: 50px; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { text-align: center; color: #333; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }

        hr { margin: 30px 0; border: 0; border-top: 1px solid #eee; }

        ul { list-style: none; padding: 0; }
        li { 
            background: #fff; 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .match-info { font-weight: bold; color: #333; }
        .bet-value { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastrar Aposta</h2>
        
        <form id="formAposta">
            <input type="text" id="timeA" placeholder="Time da Casa (ex: Brasil)" required>
            <input type="text" id="timeB" placeholder="Time Visitante (ex: Argentina)" required>
            <input type="number" id="valor" placeholder="Valor da Aposta (R$)" required>
            <button type="submit">Salvar no Firebase</button>
        </form>

        <hr>

        <h2>Lista de Jogos</h2>
        <ul id="listaJogos">
            <li style="text-align:center; color: #777;">Carregando apostas...</li>
        </ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // 1. CONFIGURAÇÃO (VOCÊ PRECISA PREENCHER ISSO)
        // ============================================================
        
        const firebaseConfig = {
            // --- COLE ABAIXO AS SUAS CHAVES DO FIREBASE ---
            apiKey: "AIzaSy...", 
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-id-do-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcdef"
            // ----------------------------------------------
        };

        // Inicializa o Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            console.log("Firebase conectado com sucesso!");
        } catch (error) {
            console.error("Erro ao conectar no Firebase. Verifique a firebaseConfig.", error);
            alert("Erro na configuração do Firebase. Abra o console (F12) para ver.");
        }

        // ============================================================
        // 2. FUNÇÃO DE SALVAR (CREATE)
        // ============================================================
        document.getElementById('formAposta').addEventListener('submit', function(event) {
            event.preventDefault(); // Não deixa a página recarregar

            // Pega os valores dos inputs
            const timeA = document.getElementById('timeA').value;
            const timeB = document.getElementById('timeB').value;
            const valor = document.getElementById('valor').value;

            // Salva na coleção "apostas"
            db.collection("apostas").add({
                timeCasa: timeA,
                timeFora: timeB,
                valor: parseFloat(valor), // Salva como número
                dataCriacao: firebase.firestore.FieldValue.serverTimestamp() // Salva a hora exata
            })
            .then(() => {
                alert("Aposta salva!");
                document.getElementById('formAposta').reset(); // Limpa o formulário
            })
            .catch((error) => {
                console.error("Erro ao salvar: ", error);
                alert("Erro ao salvar: " + error.message);
            });
        });

        // ============================================================
        // 3. FUNÇÃO DE LISTAR (READ EM TEMPO REAL)
        // ============================================================
        const lista = document.getElementById('listaJogos');

        // O onSnapshot fica "escutando" o banco. Se mudar lá, muda aqui na hora.
        db.collection("apostas")
          .orderBy("dataCriacao", "desc") // Ordena do mais novo para o mais antigo
          .onSnapshot((querySnapshot) => {
            
            lista.innerHTML = ""; // Limpa a lista atual

            if (querySnapshot.empty) {
                lista.innerHTML = "<li style='justify-content:center'>Nenhuma aposta encontrada.</li>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const dados = doc.data();
                
                // Monta o HTML de cada item
                const itemHTML = `
                    <div class="match-info">
                        ${dados.timeCasa} <span style="color:#aaa">vs</span> ${dados.timeFora}
                    </div>
                    <div class="bet-value">
                        R$ ${dados.valor}
                    </div>
                `;

                const li = document.createElement('li');
                li.innerHTML = itemHTML;
                lista.appendChild(li);
            });

        }, (error) => {
            console.error("Erro ao buscar dados: ", error);
            // Se der erro de permissão, avisa o usuário
            if (error.code === 'permission-denied') {
                lista.innerHTML = "<li style='color:red'>Erro de Permissão: Verifique as Regras do Firestore.</li>";
            }
        });

    </script>
</body>
</html>
