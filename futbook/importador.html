<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Importação - Gestão Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1d20; color: #e9ecef; font-family: 'Segoe UI', sans-serif; }
        
        /* Estilo Cyberpunk/Dashboard */
        .navbar { background: linear-gradient(90deg, #0d6efd 0%, #0dcaf0 100%); }
        .card-dark { background-color: #212529; border: 1px solid #343a40; border-radius: 10px; }
        .card-header-dark { border-bottom: 1px solid #343a40; background-color: #2c3034; font-weight: bold; }
        
        .league-item { 
            transition: all 0.2s; 
            border-left: 4px solid transparent;
            cursor: pointer;
        }
        .league-item:hover { background-color: #2c3034; border-left-color: #0dcaf0; }
        
        .btn-sync { background-color: #198754; color: white; border: none; }
        .btn-sync:hover { background-color: #157347; color: white; }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1d20; }
        ::-webkit-scrollbar-thumb { background: #495057; border-radius: 4px; }
        
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
    <h4 id="loadingText" class="text-white">Processando...</h4>
    <div class="progress w-50 mt-3" style="height: 5px;">
        <div class="progress-bar bg-info" id="progressBar" style="width: 0%"></div>
    </div>
</div>

<nav class="navbar navbar-dark shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="fas fa-satellite-dish me-2"></i>Central de Importação</span>
        
        <div class="d-flex align-items-center">
            <span class="text-white me-2 small">Temporada Base:</span>
            <select id="seasonSelect" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: 100px;">
                <option value="2025">2025</option>
                <option value="2024" selected>2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
            </select>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card card-dark h-100">
                <div class="card-header card-header-dark d-flex justify-content-between align-items-center py-3">
                    <span><i class="fas fa-globe me-2"></i>Países</span>
                    <button class="btn btn-sm btn-outline-info" onclick="carregarLigasDaAPI()">
                        <i class="fas fa-sync-alt"></i> Carregar API
                    </button>
                </div>
                <div class="p-2 border-bottom border-secondary">
                    <input type="text" id="searchCountry" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Filtrar país...">
                </div>
                <div class="card-body p-0" style="height: 70vh; overflow-y: auto;">
                    <div class="list-group list-group-flush" id="listaPaises">
                        <div class="text-center p-4 text-muted small">
                            Clique em "Carregar API" para buscar as ligas disponíveis.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9 mb-4">
            <div class="card card-dark h-100">
                <div class="card-header card-header-dark py-3 d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-trophy me-2"></i>Campeonatos Disponíveis <span id="paisSelecionado" class="text-info"></span></span>
                    <small class="text-muted" id="infoSeason">Usando ano: <b>2024</b></small>
                </div>
                <div class="card-body" id="painelLigas">
                    <div class="text-center text-muted mt-5">
                        <h3><i class="fas fa-arrow-left me-2"></i>Selecione um país ao lado</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, writeBatch, getDoc, setDoc } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- CONFIGURAÇÃO FIREBASE (Do seu projeto) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAP5P08sBQ7A79wP37b-PLhCBO591YJPpY",
        authDomain: "vipmojs-836f9.firebaseapp.com",
        projectId: "vipmojs-836f9",
        storageBucket: "vipmojs-836f9.firebasestorage.app",
        messagingSenderId: "187496268275",
        appId: "1:187496268275:web:53e57c82ef90fc603f1286"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // --- SUA KEY DA API FOOTBALL ---
    const API_KEY = "d5a4e67034fdd6786c26e57acb38ee05";
    const API_HOST = "v3.football.api-sports.io";

    // Variáveis Globais
    let todasLigas = [];

    // ATUALIZAR LABEL DO ANO QUANDO MUDAR O SELECT
    document.getElementById('seasonSelect').addEventListener('change', (e) => {
        const ano = e.target.value;
        document.getElementById('infoSeason').innerHTML = `Usando ano: <b>${ano}</b>`;
    });
    
    // ======================================================
    // 1. CARREGAR LISTA DE LIGAS (DO CACHE OU DA API)
    // ======================================================
    window.carregarLigasDaAPI = async () => {
        const cache = localStorage.getItem('cache_ligas_api_v3');
        if (cache) {
            todasLigas = JSON.parse(cache);
            renderizarPaises(todasLigas);
            return;
        }

        mostrarLoading(true, "Baixando catálogo de ligas...");

        try {
            const response = await fetch(`https://${API_HOST}/leagues`, {
                "method": "GET",
                "headers": {
                    "x-rapidapi-host": API_HOST,
                    "x-rapidapi-key": API_KEY
                }
            });
            
            const data = await response.json();

            if (data.errors && Object.keys(data.errors).length > 0) {
                // Erro comum de plano
                throw new Error("Erro API: " + JSON.stringify(data.errors));
            }

            todasLigas = data.response;
            localStorage.setItem('cache_ligas_api_v3', JSON.stringify(todasLigas));
            renderizarPaises(todasLigas);

        } catch (error) {
            alert("Erro ao buscar ligas: " + error.message);
        } finally {
            mostrarLoading(false);
        }
    };

    // ======================================================
    // 2. RENDERIZAR LISTA DE PAÍSES
    // ======================================================
    function renderizarPaises(ligas) {
        const paisesMap = {};
        
        ligas.forEach(item => {
            const pais = item.country.name;
            if (!paisesMap[pais]) paisesMap[pais] = [];
            paisesMap[pais].push(item);
        });

        const listaOrdenada = Object.keys(paisesMap).sort();
        const container = document.getElementById('listaPaises');
        container.innerHTML = '';

        listaOrdenada.forEach(pais => {
            const div = document.createElement('button');
            div.className = 'list-group-item list-group-item-action bg-dark text-white border-secondary league-item';
            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span>${pais}</span>
                    <span class="badge bg-secondary rounded-pill">${paisesMap[pais].length}</span>
                </div>
            `;
            div.onclick = () => mostrarLigasDoPais(pais, paisesMap[pais]);
            container.appendChild(div);
        });

        // Filtro
        document.getElementById('searchCountry').addEventListener('keyup', (e) => {
            const termo = e.target.value.toLowerCase();
            const itens = container.getElementsByTagName('button');
            Array.from(itens).forEach(item => {
                const texto = item.innerText.toLowerCase();
                item.style.display = texto.includes(termo) ? '' : 'none';
            });
        });
    }

    // ======================================================
    // 3. MOSTRAR LIGAS E BOTÃO DE IMPORTAR
    // ======================================================
    function mostrarLigasDoPais(pais, ligasDoPais) {
        document.getElementById('paisSelecionado').innerText = ` - ${pais}`;
        const container = document.getElementById('painelLigas');
        container.innerHTML = '<div class="row g-3"></div>';
        const row = container.querySelector('.row');

        ligasDoPais.forEach(item => {
            const liga = item.league;
            
            // Verifica a última temporada disponível segundo a API (apenas visual)
            const seasons = item.seasons;
            const ultimaSeasonDisponivel = seasons[seasons.length - 1].year; 

            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            col.innerHTML = `
                <div class="card bg-secondary text-white border-0 shadow-sm h-100">
                    <div class="card-body text-center">
                        <img src="${liga.logo}" style="height: 60px; object-fit: contain;" class="mb-3">
                        <h6 class="card-title fw-bold text-truncate" title="${liga.name}">${liga.name}</h6>
                        <p class="small mb-2 opacity-75">ID: <strong>${liga.id}</strong></p>
                        <p class="small mb-3 badge bg-dark">Última disp: ${ultimaSeasonDisponivel}</p>
                        
                        <button class="btn btn-sync btn-sm w-100 fw-bold shadow" 
                            onclick="window.importarTimes(${liga.id}, '${liga.name}', '${pais}')">
                            <i class="fas fa-cloud-download-alt me-2"></i>Sincronizar
                        </button>
                    </div>
                </div>
            `;
            row.appendChild(col);
        });
    }

    // ======================================================
    // 4. LÓGICA DE IMPORTAÇÃO (AGORA COM ANO VARIÁVEL)
    // ======================================================
    window.importarTimes = async (leagueId, leagueName, countryName) => {
        // Pega o ano selecionado no topo
        const season = document.getElementById('seasonSelect').value;

        if(!confirm(`Deseja importar times do(a) ${leagueName} da temporada ${season}?`)) return;

        mostrarLoading(true, `Baixando times de ${season}...`);

        try {
            const response = await fetch(`https://${API_HOST}/teams?league=${leagueId}&season=${season}`, {
                "method": "GET",
                "headers": {
                    "x-rapidapi-host": API_HOST,
                    "x-rapidapi-key": API_KEY
                }
            });

            const data = await response.json();

            // VERIFICAÇÃO DE ERRO ESPECÍFICA DO PLANO
            if (data.errors && Object.keys(data.errors).length > 0) {
                const erroMsg = JSON.stringify(data.errors);
                // Se o erro mencionar "plan" ou "access", sugerimos trocar o ano
                if(erroMsg.includes("plan") || erroMsg.includes("access")) {
                    throw new Error(`Seu plano API não permite acesso a ${season}. Tente mudar o ano para ${season - 1} no topo da página.`);
                }
                throw new Error(erroMsg);
            }

            const times = data.response;
            if (times.length === 0) throw new Error(`Nenhum time encontrado para a temporada ${season}. Tente outro ano.`);

            document.getElementById('loadingText').innerText = `Salvando ${times.length} times...`;
            
            const timesRef = collection(db, "times_cadastrados");
            const chunkSize = 400; 

            for (let i = 0; i < times.length; i += chunkSize) {
                const chunk = times.slice(i, i + chunkSize);
                const batch = writeBatch(db);

                chunk.forEach(t => {
                    const docRef = doc(timesRef, `api_${t.team.id}`);
                    batch.set(docRef, {
                        nome: t.team.name,
                        codigo: t.team.code,
                        pais: t.team.country,
                        logo: t.team.logo,
                        liga_id: leagueId,
                        liga_nome: leagueName,
                        temporada: season,
                        atualizado_em: new Date().toISOString()
                    });
                });

                await batch.commit();
            }

            alert(`Sucesso! ${times.length} times importados (Temporada ${season}).`);

        } catch (error) {
            console.error(error);
            alert("Erro: " + error.message);
        } finally {
            mostrarLoading(false);
        }
    };

    function mostrarLoading(show, text = "") {
        const el = document.getElementById('loadingOverlay');
        const txt = document.getElementById('loadingText');
        if (show) {
            el.style.display = 'flex';
            txt.innerText = text;
        } else {
            el.style.display = 'none';
        }
    }
</script>

</body>
</html>
