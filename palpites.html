<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador da Sorte - Milhares</title>
    <!-- Tailwind CSS CDN --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: "Inter" e uma fonte chamativa "Orbitron" --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos personalizados para o efeito neon e gradiente */
        
        body {
            /* Fonte padrão */
            font-family: 'Inter', sans-serif;
            /* Fundo gradiente animado */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0f35, #0a041a);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }

        /* Animação do fundo gradiente */
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Fonte especial para o título */
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Efeito de brilho (luz) pulsante para o card principal */
        .card-glow {
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5), 
                        0 0 20px rgba(139, 92, 246, 0.3),
                        0 0 30px rgba(139, 92, 246, 0.2);
            animation: pulse-glow 3s linear infinite alternate;
            border: 1px solid rgba(196, 181, 253, 0.3);
        }

        /* Animação de pulso para botões e card */
        @keyframes pulse-glow {
            from {
                box-shadow: 0 0 5px rgba(167, 139, 250, 0.3), 
                            0 0 10px rgba(167, 139, 250, 0.2),
                            0 0 15px rgba(167, 139, 250, 0.1);
            }
            to {
                box-shadow: 0 0 20px rgba(139, 92, 246, 0.7), 
                            0 0 30px rgba(139, 92, 246, 0.5),
                            0 0 45px rgba(139, 92, 246, 0.3);
            }
        }
        
        /* Estilo para os números gerados */
        .milhar-box {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #c4b5fd; /* Roxo claro */
            color: #fde047; /* Amarelo */
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem; /* text-3xl */
            font-weight: 700;
            padding: 0.75rem; /* p-3 */
            border-radius: 0.5rem; /* rounded-lg */
            text-shadow: 0 0 5px #fde047, 0 0 10px #fde047;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .milhar-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #fde047;
        }

        /* Estilo para o modal de mensagem */
        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            color: white;
            z-index: 50;
            font-weight: bold;
            display: none; /* Começa escondido */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.5s ease;
            white-space: nowrap; /* Impede que o texto quebre */
        }
        #message-box.show {
            display: block;
            opacity: 1;
        }
        #message-box.bg-red-600 { background-color: #dc2626; }
        #message-box.bg-green-600 { background-color: #16a34a; }

        /* Estilo para os cards de bicho (COMPACTO) */
        .bicho-card {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(196, 181, 253, 0.2);
            padding: 0.5rem; /* Menor padding */
            border-radius: 0.5rem; /* Menor border-radius */
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
            display: flex; /* Flexbox para centralizar conteúdo */
            flex-direction: column; /* Conteúdo em coluna */
            align-items: center;
            justify-content: center;
        }
        .bicho-card:hover {
            border-color: #c4b5fd;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(196, 181, 253, 0.4);
        }
        .bicho-card.selected {
            background-color: rgba(139, 92, 246, 0.2);
            border-color: #fde047; /* Amarelo para selecionado */
            box-shadow: 0 0 20px #fde047, 0 0 30px #fde047;
            transform: scale(1.05);
        }
        .bicho-card .emoji {
            font-size: 2.5rem; /* Icone menor */
            line-height: 1;
        }
        .bicho-card .bicho-name {
            font-size: 0.75rem; /* text-xs */
            font-weight: 600;
            color: #c4b5fd;
            margin-top: 0.25rem; /* Menor margem */
            text-shadow: 0 0 3px rgba(196, 181, 253, 0.5);
            line-height: 1; /* Para evitar quebras de linha excessivas */
        }

        /* Ajuste do grid para mobile (FIXO EM 5 COLUNAS) */
        #bicho-icons-container {
            grid-template-columns: repeat(5, minmax(0, 1fr)); /* 5 colunas fixas */
        }
        /* Removidas as media queries responsivas para o grid */
    </style>
</head>
<body class="min-h-screen text-gray-200 p-4 sm:p-8 flex items-center justify-center">

    <!-- Modal de Mensagem (para substituir o alert) --><div id="message-box"></div>

    <!-- Container Principal --><main class="w-full max-w-2xl mx-auto">
        
        <!-- Card Principal --><div class="bg-gray-900/60 backdrop-blur-md rounded-2xl p-6 sm:p-10 card-glow">
            
            <!-- Seu Logo Aqui -->
            <div class="flex justify-center mb-6">
                <img src="logopalpite.png" 
                     alt="Logo Gerador da Sorte" 
                     class="h-12 w-auto rounded-lg">
            </div>

            <!-- Cabeçalho --><header class="text-center mb-8">
                <h1 class="font-orbitron text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-yellow-300">
                    GERADOR DA SORTE
                </h1>
                <p class="text-lg text-purple-300 mt-2">Seus números místicos para a milhar!</p>
            </header>

            <!-- Formulário de Inputs --><form id="sorte-form">
                <div class="space-y-6">
                    
                    <!-- Passo 1: O Bicho com Ícones --><div>
                        <label class="block text-sm font-medium text-purple-300 mb-4">1. Escolha o Bicho:</label>
                        <div id="bicho-icons-container" class="grid gap-2">
                            <!-- Ícones dos bichos serão inseridos aqui pelo JS --></div>
                        <!-- Input oculto para guardar o valor do bicho selecionado --><input type="hidden" id="bicho" name="bicho"> 
                    </div>

                    <!-- Passo 2: Dados Místicos --><div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label for="ano" class="block text-sm font-medium text-purple-300 mb-2">Ano Nasc.:</label>
                            <input type="number" id="ano" name="ano" class="w-full bg-gray-800 border border-purple-600 text-white rounded-lg p-3" placeholder="Ex: 1990">
                        </div>
                        <div>
                            <label for="signo" class="block text-sm font-medium text-purple-300 mb-2">Signo:</label>
                            <select id="signo" name="signo" class="w-full bg-gray-800 border border-purple-600 text-white rounded-lg p-3">
                                <option value="">Selecione...</option>
                                <!-- Opções de signos serão preenchidas via JS --></select>
                        </div>
                        <div>
                            <label for="numero-sorte" class="block text-sm font-medium text-purple-300 mb-2">Nº da Sorte:</label>
                            <input type="number" id="numero-sorte" name="numero-sorte" class="w-full bg-gray-800 border border-purple-600 text-white rounded-lg p-3" placeholder="Ex: 7">
                        </div>
                    </div>

                    <!-- Botão de Gerar --><div>
                        <button type="submit" id="generate-button" class="w-full font-orbitron text-lg font-bold text-white bg-gradient-to-r from-purple-600 via-pink-600 to-red-500 rounded-lg p-4 transition duration-300 ease-in-out hover:from-purple-700 hover:to-red-600 hover:scale-105 transform active:scale-100 animation-pulse-glow">
                            ✨ GERAR MINHAS MILHARES ✨
                        </button>
                    </div>
                </div>
            </form>

            <!-- Seção de Resultados (escondida) --><section id="results-section" class="mt-10 hidden">
                <h2 id="results-title" class="text-2xl font-bold text-center text-yellow-300 mb-6">
                    Suas Milhares da Sorte para o...
                </h2>
                
                <!-- Indicador de Carregamento (Spinner) --><div id="loading-spinner" class="hidden text-center my-4">
                    <svg class="animate-spin h-8 w-8 text-purple-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-purple-300 mt-2">Calculando com base nos astros...</p>
                </div>

                <!-- Grid dos Números --><div id="results-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-4">
                    <!-- Números gerados serão inseridos aqui --></div>

                <!-- Botão WhatsApp --><div class="mt-8 text-center">
                    <button id="whatsapp-button" class="inline-flex items-center justify-center bg-green-500 text-white font-bold py-3 px-6 rounded-lg transition duration-300 hover:bg-green-600 hover:scale-105 transform">
                        <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.0-5.418 4.39-9.808 9.807-9.808 2.708.0 5.227 1.054 7.142 2.968 1.914 1.915 2.969 4.433 2.969 7.143-.0 5.418-4.391 9.808-9.808 9.808-2.098 0-4.043-.548-5.742-1.588L.057 24zM7.18 4.618a8.312 8.312 0 00-2.225 5.454 8.293 8.293 0 004.832 7.749 8.3 8.3 0 008.24-2.226 8.31 8.31 0 002.226-8.238 8.31 8.31 0 00-7.748-4.832A8.312 8.312 0 007.18 4.618zM6.51 18.77l-1.099.585-3.481.921.93-3.411.597-1.082a6.839 6.839 0 01-1.001-3.61c0-3.906 3.179-7.085 7.085-7.085s7.085 3.179 7.085 7.085-3.179 7.085-7.085 7.085a6.97 6.97 0 01-3.62-1.001l-.011-.005z"></path></svg>
                        Compartilhar no WhatsApp
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script>
        // --- DADOS DO JOGO ---
        
        // Definição dos 25 grupos de bichos e suas dezenas, agora com um emoji
        const BICHOS = [
            { grupo: 1, nome: 'Avestruz', numeros: ['01', '02', '03', '04'], emoji: '🦤' }, 
            { grupo: 2, nome: 'Águia', numeros: ['05', '06', '07', '08'], emoji: '🦅' },
            { grupo: 3, nome: 'Burro', numeros: ['09', '10', '11', '12'], emoji: '🐴' }, 
            { grupo: 4, nome: 'Borboleta', numeros: ['13', '14', '15', '16'], emoji: '🦋' },
            { grupo: 5, nome: 'Cachorro', numeros: ['17', '18', '19', '20'], emoji: '🐶' },
            { grupo: 6, nome: 'Cabra', numeros: ['21', '22', '23', '24'], emoji: '🐐' },
            { grupo: 7, nome: 'Carneiro', numeros: ['25', '26', '27', '28'], emoji: '🐑' },
            { grupo: 8, nome: 'Camelo', numeros: ['29', '30', '31', '32'], emoji: '🐪' },
            { grupo: 9, nome: 'Cobra', numeros: ['33', '34', '35', '36'], emoji: '🐍' },
            { grupo: 10, nome: 'Coelho', numeros: ['37', '38', '39', '40'], emoji: '🐰' },
            { grupo: 11, nome: 'Cavalo', numeros: ['41', '42', '43', '44'], emoji: '🐎' },
            { grupo: 12, nome: 'Elefante', numeros: ['45', '46', '47', '48'], emoji: '🐘' },
            { grupo: 13, nome: 'Galo', numeros: ['49', '50', '51', '52'], emoji: '🐓' },
            { grupo: 14, nome: 'Gato', numeros: ['53', '54', '55', '56'], emoji: '🐱' },
            { grupo: 15, nome: 'Jacaré', numeros: ['57', '58', '59', '60'], emoji: '🐊' },
            { grupo: 16, nome: 'Leão', numeros: ['61', '62', '63', '64'], emoji: '🦁' },
            { grupo: 17, nome: 'Macaco', numeros: ['65', '66', '67', '68'], emoji: '🐒' },
            { grupo: 18, nome: 'Porco', numeros: ['69', '70', '71', '72'], emoji: '🐷' },
            { grupo: 19, nome: 'Pavão', numeros: ['73', '74', '75', '76'], emoji: '🦚' },
            { grupo: 20, nome: 'Peru', numeros: ['77', '78', '79', '80'], emoji: '🦃' },
            { grupo: 21, nome: 'Touro', numeros: ['81', '82', '83', '84'], emoji: '🐂' },
            { grupo: 22, nome: 'Tigre', numeros: ['85', '86', '87', '88'], emoji: '🐅' },
            { grupo: 23, nome: 'Urso', numeros: ['89', '90', '91', '92'], emoji: '🐻' },
            { grupo: 24, nome: 'Veado', numeros: ['93', '94', '95', '96'], emoji: '🦌' },
            { grupo: 25, nome: 'Vaca', numeros: ['97', '98', '99', '00'], emoji: '🐄' }
        ];

        const SIGNOS = [
            'Áries', 'Touro', 'Gêmeos', 'Câncer', 'Leão', 'Virgem',
            'Libra', 'Escorpião', 'Sagitário', 'Capricórnio', 'Aquário', 'Peixes'
        ];

        // --- ELEMENTOS DO DOM ---
        const bichoInput = document.getElementById('bicho'); // Agora é um input hidden
        const bichoIconsContainer = document.getElementById('bicho-icons-container');
        const signoSelect = document.getElementById('signo');
        const sorteForm = document.getElementById('sorte-form');
        const generateButton = document.getElementById('generate-button');
        const resultsSection = document.getElementById('results-section');
        const resultsTitle = document.getElementById('results-title');
        const resultsGrid = document.getElementById('results-grid');
        const loadingSpinner = document.getElementById('loading-spinner');
        const whatsappButton = document.getElementById('whatsapp-button');
        const messageBox = document.getElementById('message-box');

        let selectedBichoElement = null; // Para controlar o card de bicho selecionado

        // --- INICIALIZAÇÃO ---
        
        // Preenche os ícones de Bichos
        BICHOS.forEach(bicho => {
            const bichoCard = document.createElement('div');
            bichoCard.className = 'bicho-card flex flex-col items-center justify-center';
            bichoCard.dataset.grupo = bicho.grupo;
            bichoCard.dataset.nome = bicho.nome;

            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'emoji';
            emojiSpan.textContent = bicho.emoji;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'bicho-name';
            nameSpan.textContent = bicho.nome;

            bichoCard.appendChild(emojiSpan);
            bichoCard.appendChild(nameSpan);
            bichoIconsContainer.appendChild(bichoCard);

            bichoCard.addEventListener('click', () => {
                if (selectedBichoElement) {
                    selectedBichoElement.classList.remove('selected');
                }
                bichoCard.classList.add('selected');
                selectedBichoElement = bichoCard;
                bichoInput.value = bicho.grupo; // Atualiza o input hidden
            });
        });

        // Preenche o select de Signos
        SIGNOS.forEach(signo => {
            const option = document.createElement('option');
            option.value = signo;
            option.textContent = signo;
            signoSelect.appendChild(option);
        });

        // --- LÓGICA DE GERAÇÃO ---
        
        // Função para mostrar mensagens (substitui o alert)
        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.className = isError ? 'bg-red-600' : 'bg-green-600';
            messageBox.classList.add('show');

            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 3000); // Mensagem desaparece após 3 segundos
        }

        // Função principal para gerar as milhares
        function generateMilhares(e) {
            e.preventDefault(); // Impede o envio do formulário

            // 1. Obter e validar os inputs
            const bichoGrupo = bichoInput.value; // Pega do input hidden
            const ano = document.getElementById('ano').value;
            const signo = signoSelect.value;
            const numeroSorte = document.getElementById('numero-sorte').value;
            
            if (!bichoGrupo) {
                showMessage('Por favor, selecione um Bicho!', true);
                return;
            }
            if (!ano || !signo || !numeroSorte) {
                showMessage('Por favor, preencha o Ano Nasc., Signo e Nº da Sorte!', true);
                return;
            }

            // 2. Preparar a UI para geração
            resultsSection.style.display = 'block'; // Mostra a seção
            resultsGrid.innerHTML = ''; // Limpa resultados antigos
            loadingSpinner.style.display = 'block'; // Mostra o spinner
            generateButton.disabled = true; // Desabilita o botão
            generateButton.textContent = "GERANDO...";

            // 3. Encontrar o bicho selecionado
            const bichoSelecionado = BICHOS.find(b => b.grupo == bichoGrupo);
            const dezenasDoBicho = bichoSelecionado.numeros;

            // 4. Simular um "cálculo místico" (delay)
            setTimeout(() => {
                const milharesGeradas = [];

                // Gerar mais de 10 milhares e depois selecionar 10 únicas
                const allPossibleMilhares = new Set();
                let attempts = 0;
                while (allPossibleMilhares.size < 10 && attempts < 1000) { // Limita tentativas para evitar loop infinito
                    // Gera os dois primeiros dígitos aleatoriamente (00-99)
                    const prefixo = String(Math.floor(Math.random() * 100)).padStart(2, '0');
                    
                    // Escolhe uma das 4 dezenas do bicho aleatoriamente
                    const dezena = dezenasDoBicho[Math.floor(Math.random() * dezenasDoBicho.length)];
                    
                    const milhar = prefixo + dezena;
                    allPossibleMilhares.add(milhar);
                    attempts++;
                }

                // Convert set to array and take the first 10 (or fewer if less than 10 unique were generated)
                milharesGeradas.push(...Array.from(allPossibleMilhares).slice(0, 10));

                // Se gerou menos de 10, preenche com mais aleatórias
                while (milharesGeradas.length < 10) {
                     const prefixo = String(Math.floor(Math.random() * 100)).padStart(2, '0');
                     const dezena = dezenasDoBicho[Math.floor(Math.random() * dezenasDoBicho.length)];
                     const milhar = prefixo + dezena;
                     if (!milharesGeradas.includes(milhar)) { // Garante que é única
                        milharesGeradas.push(milhar);
                     }
                }


                // 5. Exibir os resultados
                loadingSpinner.style.display = 'none'; // Esconde o spinner
                resultsTitle.textContent = `Suas Milhares da Sorte para o ${bichoSelecionado.nome}!`;

                milharesGeradas.forEach(milhar => {
                    const milharEl = document.createElement('div');
                    milharEl.className = 'milhar-box';
                    milharEl.textContent = milhar;
                    resultsGrid.appendChild(milharEl);
                });
                
                generateButton.disabled = false; // Reabilita o botão
                generateButton.textContent = "✨ GERAR NOVAS MILHARES ✨";
                showMessage('Seus números da sorte chegaram!', false);

                // Rolar para os resultados
                resultsSection.scrollIntoView({ behavior: 'smooth' });

            }, 1500); // Delay de 1.5s para simular o "cálculo"
        }

        // --- COMPARTILHAMENTO ---
        
        function shareOnWhatsApp() {
            const bichoNome = selectedBichoElement ? selectedBichoElement.dataset.nome : 'seu Bicho da Sorte';
            
            // Pega os números da grade de resultados
            const milharElements = resultsGrid.querySelectorAll('.milhar-box');
            if (milharElements.length === 0) {
                showMessage('Gere os números antes de compartilhar!', true);
                return;
            }

            const numeros = Array.from(milharElements).map(el => el.textContent).join(', ');
            
            const texto = `🍀 Gerei minhas 10 milhares da sorte para o *${bichoNome}*! 🍀\n\nMeus números são: \n*${numeros}*\n\nGere os seus também em [Link do Seu Site Aqui]`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            
            window.open(url, '_blank');
        }

        // --- EVENT LISTENERS ---
        sorteForm.addEventListener('submit', generateMilhares);
        whatsappButton.addEventListener('click', shareOnWhatsApp);

    </script>
</body>
</html>
