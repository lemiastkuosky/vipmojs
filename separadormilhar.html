<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Separador Seguro</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --border: #333333;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .control-panel {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        .btn-paste-mini {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--bg-input);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            resize: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--primary); }

        .actions-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        button.main-btn {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button.main-btn:active { transform: scale(0.98); }

        .btn-process { background-color: var(--primary); color: white; }
        .btn-clear { background-color: var(--bg-input); color: var(--danger); border: 1px solid var(--border); }

        .results-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        @media (max-width: 480px) {
            .results-container { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .card-content {
            background-color: var(--bg-input);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            color: var(--text-main);
            font-size: 0.9rem;
            height: 80px;
            overflow-y: auto;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-copy {
            background-color: var(--bg-input);
            color: var(--primary);
            border: 1px solid var(--primary);
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        /* Estilo quando já foi copiado */
        .card.copied {
            border-color: var(--success);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .card.copied .btn-copy {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
            /* Importante: Mantivemos clicável para permitir re-copiar se confirmar */
        }
        
        .card.copied .btn-copy:hover {
            background-color: var(--success-dark);
        }

        .card.copied .card-header { color: var(--success); }

        .status-bar {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Separador Seguro</h1>

    <div class="control-panel">
        <div class="input-header">
            <label for="inputNumbers">Sua lista:</label>
            <button class="btn-paste-mini" onclick="colarDoClipboard()">
                📋 COLAR
            </button>
        </div>
        
        <textarea id="inputNumbers" placeholder="Ex: 1234 5678 9012..."></textarea>
        
        <div class="actions-grid">
            <button class="main-btn btn-process" onclick="processar()">
                GERAR BLOCOS
            </button>
            <button class="main-btn btn-clear" onclick="limpar()">
                LIMPAR
            </button>
        </div>
        <div id="status-msg" class="status-bar"></div>
    </div>

    <div id="results-area" class="results-container"></div>

    <script>
        async function colarDoClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const textarea = document.getElementById('inputNumbers');
                textarea.value = text;
                const btn = document.querySelector('.btn-paste-mini');
                const originalText = btn.innerHTML;
                btn.innerHTML = "✔ COLADO";
                setTimeout(() => btn.innerHTML = originalText, 1500);
                textarea.focus();
            } catch (err) {
                alert('Para colar, toque e segure na caixa de texto.');
            }
        }

        function processar() {
            const input = document.getElementById('inputNumbers').value;
            const resultsArea = document.getElementById('results-area');
            const statusMsg = document.getElementById('status-msg');

            let numbersList = input.split(/[^0-9]+/).filter(n => n.length > 0);

            if (numbersList.length === 0) {
                 statusMsg.textContent = "A lista está vazia.";
                 statusMsg.style.color = "var(--danger)";
                 return;
            }

            resultsArea.innerHTML = '';
            const blockSize = 50;
            let totalBlocks = 0;

            for (let i = 0; i < numbersList.length; i += blockSize) {
                totalBlocks++;
                const chunk = numbersList.slice(i, i + blockSize);
                const chunkText = chunk.join(' '); 
                criarCard(chunkText, totalBlocks, chunk.length);
            }

            statusMsg.textContent = `${numbersList.length} milhares em ${totalBlocks} blocos.`;
            statusMsg.style.color = "var(--text-muted)";
            
            if(window.innerWidth < 600 && numbersList.length > 0) {
                resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function criarCard(text, index, count) {
            const resultsArea = document.getElementById('results-area');
            const div = document.createElement('div');
            div.className = 'card';
            div.id = `block-${index}`;

            div.innerHTML = `
                <div class="card-header">
                    <span>Bloco #${index}</span>
                    <span>Qtd: ${count}</span>
                </div>
                <div class="card-content">${text}</div>
                <button class="btn-copy" onclick="copiar(this, '${text}', 'block-${index}')">
                    COPIAR
                </button>
            `;
            resultsArea.appendChild(div);
        }

        function copiar(btn, text, blockId) {
            const block = document.getElementById(blockId);

            // ---- TRAVA DE SEGURANÇA ----
            // Se o bloco já tem a classe 'copied', pergunta antes de continuar
            if (block.classList.contains('copied')) {
                const confirmar = confirm("⚠️ ATENÇÃO:\n\nEste bloco já foi copiado anteriormente.\n\nDeseja copiar novamente?");
                if (!confirmar) {
                    return; // Se o usuário clicar em Cancelar, a função para aqui
                }
            }

            // Executa a cópia
            navigator.clipboard.writeText(text).then(() => {
                block.classList.add('copied');
                btn.innerHTML = "COPIADO &check;";
                
                // Vibra para confirmar
                if (navigator.vibrate) navigator.vibrate(50);
            }).catch(err => {
                alert('Erro ao copiar.');
            });
        }

        function limpar() {
            if(confirm("Tem certeza que deseja limpar tudo?")) {
                document.getElementById('inputNumbers').value = '';
                document.getElementById('results-area').innerHTML = '';
                document.getElementById('status-msg').textContent = '';
            }
        }
    </script>
</body>
</html>
