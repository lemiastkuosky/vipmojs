<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d11" />
  <title>Admin — VipMojs</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:      #0b0d11;
      --surface: #13161d;
      --card:    #181c25;
      --border:  #1e2330;
      --accent:  #f5c842;
      --green:   #3dd68c;
      --danger:  #e05c5c;
      --text:    #e8eaf0;
      --muted:   #5a6080;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Syne', sans-serif;
      --r:       10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }

    /* LOGIN */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; }
    .login-box h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .login-box p  { color: var(--muted); font-size: 0.82rem; margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .field input {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); font-family: var(--mono); font-size: 1rem;
      padding: 12px 14px; outline: none; -webkit-appearance: none;
    }
    .field input:focus { border-color: var(--accent); }
    #loginError { color: var(--danger); font-size: 0.8rem; min-height: 16px; margin-top: -6px; font-family: var(--mono); }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; border-radius: var(--r); cursor: pointer;
      font-family: var(--sans); font-weight: 700; font-size: 0.88rem;
      padding: 12px 18px; transition: opacity .15s, transform .1s; -webkit-appearance: none;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; width: 100%; margin-top: 6px; }
    .btn-green   { background: var(--green); color: #000; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-sm      { padding: 8px 14px; font-size: 0.8rem; }
    .btn-xs      { padding: 5px 10px; font-size: 0.72rem; }

    /* SHELL */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 20;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
    }
    .logo { font-size: 1rem; font-weight: 800; color: var(--accent); }
    .user-chip { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

    /* TOOLBAR */
    .toolbar { padding: 12px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .toolbar input {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); font-family: var(--mono); font-size: 0.88rem;
      padding: 10px 12px 10px 34px; outline: none; -webkit-appearance: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .counter { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

    /* CARDS */
    .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .receipt-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-id   { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .card-date { font-family: var(--mono); font-size: 0.72rem; color: var(--text); }
    .badge { display: inline-block; font-family: var(--mono); font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
    .badge-active  { background: #1a3a28; color: var(--green); border: 1px solid #2a5a38; }
    .badge-expired { background: #2a1a1a; color: var(--danger); border: 1px solid #4a2222; }

    /* milhar atual no card */
    .milhar-atual {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245,200,66,.08); border: 1px solid rgba(245,200,66,.2);
      border-radius: 8px; padding: 6px 12px;
      font-family: var(--mono); font-size: 1.1rem; color: var(--accent); font-weight: 700;
      letter-spacing: 2px;
    }
    .milhar-label { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }

    /* OVERLAY / MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; align-items: flex-end; }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0;
      width: 100%; max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 0 env(safe-area-inset-bottom, 16px); display: flex; flex-direction: column;
    }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
    .modal-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .modal-header h2 { font-size: 1rem; font-weight: 800; }
    .modal-meta { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 6px; }
    .modal-meta strong { color: var(--text); }
    .modal-body { padding: 20px 16px; flex: 1; display: flex; flex-direction: column; gap: 20px; }

    /* EDITOR DE UMA MILHAR */
    .section-label { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }

    /* busca */
    .search-milhar-wrap { position: relative; }
    .search-milhar-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #milharSearch {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); font-family: var(--mono); font-size: 1rem;
      padding: 11px 12px 11px 34px; letter-spacing: 2px; outline: none; -webkit-appearance: none;
    }
    #milharSearch:focus { border-color: var(--accent); }
    #searchResult {
      margin-top: 8px; font-family: var(--mono); font-size: 0.8rem;
      padding: 7px 12px; border-radius: 8px; display: none;
    }
    #searchResult.found    { background: rgba(61,214,140,.1); color: var(--green); border: 1px solid rgba(61,214,140,.25); }
    #searchResult.notfound { background: rgba(224,92,92,.1);  color: var(--danger); border: 1px solid rgba(224,92,92,.25); }

    /* troca */
    .troca-box {
      display: flex; flex-direction: column; gap: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .troca-row { display: flex; align-items: center; gap: 12px; }
    .troca-num {
      flex: 1; text-align: center;
      font-family: var(--mono); font-size: 1.6rem; font-weight: 700;
      color: var(--accent); letter-spacing: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 8px;
    }
    .arrow { color: var(--muted); font-size: 1.2rem; flex-shrink: 0; }
    #novaMilharInput {
      flex: 1; text-align: center;
      font-family: var(--mono); font-size: 1.6rem; font-weight: 700;
      color: var(--green); letter-spacing: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 8px; outline: none; -webkit-appearance: none;
    }
    #novaMilharInput:focus { border-color: var(--green); }
    .troca-labels { display: flex; gap: 12px; }
    .troca-labels span { flex: 1; text-align: center; font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }

    /* FOOTER */
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
    .modal-footer .btn { flex: 1; }

    /* MISC */
    .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 10px 18px; font-family: var(--mono); font-size: 0.82rem; color: var(--text);
      z-index: 999; opacity: 0; white-space: nowrap; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok   { border-color: var(--green);  color: var(--green); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🎰 Admin VIP</h1>
    <p>Gestão de recibos</p>
    <div class="field"><label>EMAIL</label><input type="email" id="loginEmail" placeholder="admin@email.com" autocomplete="username" /></div>
    <div class="field"><label>SENHA</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" /></div>
    <div id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <span class="logo">🎰 Admin VIP</span>
    <div class="user-chip">
      <span id="userEmail"></span>
      <button class="btn btn-ghost btn-xs" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar recibo…" oninput="filterReceipts()" />
    </div>
    <button class="btn btn-ghost btn-sm" onclick="loadReceipts()">↻</button>
    <span class="counter" id="counter">—</span>
  </div>

  <div class="list" id="receiptsList">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
</div>

<!-- EDITOR -->
<div class="overlay" id="editorOverlay">
  <div class="modal" id="editorModal">
    <div class="modal-handle"></div>

    <div class="modal-header">
      <h2>✏️ Alterar Milhar</h2>
      <div class="modal-meta" id="modalMeta"></div>
    </div>

    <div class="modal-body">

      <!-- Buscar milhar -->
      <div>
        <div class="section-label">BUSCAR MILHAR NO RECIBO</div>
        <div class="search-milhar-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="milharSearch" maxlength="4" placeholder="0000" inputmode="numeric"
                 oninput="this.value=this.value.replace(/\D/g,''); doSearch()" />
        </div>
        <div id="searchResult"></div>
      </div>

      <!-- Troca -->
      <div>
        <div class="section-label">ALTERAR MILHAR</div>
        <div class="troca-box">
          <div class="troca-labels">
            <span>ATUAL</span>
            <span style="flex:0;width:28px"></span>
            <span>NOVA</span>
          </div>
          <div class="troca-row">
            <div class="troca-num" id="milharAtualDisplay">—</div>
            <div class="arrow">→</div>
            <input type="text" id="novaMilharInput" maxlength="4" placeholder="0000" inputmode="numeric"
                   oninput="this.value=this.value.replace(/\D/g,'')"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();saveReceipt();}" />
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditor()">Cancelar</button>
      <button class="btn btn-green" id="saveBtn" onclick="saveReceipt()">💾 Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyB7tyWt4UlivjnJVevkXDZ1wwgPrzV1hvc",
  authDomain: "meus-recibos-vip.firebaseapp.com",
  projectId: "meus-recibos-vip",
  storageBucket: "meus-recibos-vip.firebasestorage.app",
  messagingSenderId: "254959368683",
  appId: "1:254959368683:web:80676a26f614040df6c1ae"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let allReceipts = [];
let currentDoc  = null; // { id, data }

// ── Auth ──
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email.split('@')[0];
    loadReceipts();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginError');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = 'Email ou senha inválidos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
function doLogout() { auth.signOut(); }

// ── Load ──
async function loadReceipts() {
  document.getElementById('receiptsList').innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  document.getElementById('counter').textContent = '…';
  try {
    const snap = await db.collection('receipts').orderBy('createdAt', 'desc').limit(200).get();
    allReceipts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    renderList(allReceipts);
  } catch(e) {
    document.getElementById('receiptsList').innerHTML = `<div class="empty-state">Erro: ${e.message}</div>`;
  }
}

// ── Render cards ──
function renderList(list) {
  document.getElementById('counter').textContent = String(list.length);
  const container = document.getElementById('receiptsList');
  if (!list.length) { container.innerHTML = '<div class="empty-state">Nenhum recibo encontrado.</div>'; return; }

  container.innerHTML = list.map(({ id, data }) => {
    const created = data.createdAt ? data.createdAt.toDate() : null;
    const dateStr = created
      ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
      : '—';
    const expires = data.expiresAt ? (data.expiresAt.toDate ? data.expiresAt.toDate() : new Date(data.expiresAt)) : null;
    const expired = expires && expires < new Date();
    const badge = expired
      ? '<span class="badge badge-expired">Expirado</span>'
      : '<span class="badge badge-active">Ativo</span>';

    const milhar = extractMilhar(data.content || '');
    const clientLink = `https://meus-recibos-vip.web.app/recibo.html?id=${id}`;

    return `
      <div class="receipt-card">
        <div class="card-row">
          <span class="card-id">${id.substring(0,16)}…</span>
          ${badge}
        </div>
        <div class="card-date">📅 ${dateStr}</div>
        <div class="card-row">
          <div>
            <div class="milhar-label" style="margin-bottom:4px">MILHAR</div>
            <div class="milhar-atual">${milhar || '<span style="color:var(--muted);font-size:.8rem">não encontrada</span>'}</div>
          </div>
        </div>
        <div class="card-row" style="gap:8px">
          <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEditor('${id}')">✏️ Alterar Milhar</button>
          <a href="${clientLink}" target="_blank" class="btn btn-ghost btn-sm">🔗 Ver</a>
        </div>
      </div>`;
  }).join('');
}

// ── Busca a primeira milhar de 4 dígitos do content ──
function extractMilhar(content) {
  const m = content.match(/\b\d{4}\b/);
  return m ? m[0] : null;
}

// ── Filter list ──
function filterReceipts() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { renderList(allReceipts); return; }
  renderList(allReceipts.filter(({ id, data }) =>
    id.toLowerCase().includes(q) || (data.content || '').toLowerCase().includes(q)
  ));
}

// ── Open editor ──
function openEditor(id) {
  const rec = allReceipts.find(r => r.id === id);
  if (!rec) return;
  currentDoc = rec;

  const created = rec.data.createdAt ? rec.data.createdAt.toDate() : null;
  const dateStr = created
    ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
    : '—';

  document.getElementById('modalMeta').innerHTML =
    `<span><strong>${id.substring(0,16)}…</strong></span><span>📅 ${dateStr}</span>`;

  const milharAtual = extractMilhar(rec.data.content || '') || '—';
  document.getElementById('milharAtualDisplay').textContent = milharAtual;
  document.getElementById('novaMilharInput').value = '';
  document.getElementById('milharSearch').value = '';
  document.getElementById('searchResult').style.display = 'none';

  document.getElementById('editorOverlay').classList.add('open');
  document.getElementById('editorModal').scrollTop = 0;
  setTimeout(() => document.getElementById('novaMilharInput').focus(), 300);
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('open');
  currentDoc = null;
}

// ── Busca dentro do editor ──
function doSearch() {
  const val = document.getElementById('milharSearch').value;
  const result = document.getElementById('searchResult');
  if (val.length < 4) { result.style.display = 'none'; return; }
  const content = currentDoc?.data?.content || '';
  const found = new RegExp(`\\b${val}\\b`).test(content);
  result.style.display = '';
  result.className = found ? 'found' : 'notfound';
  result.textContent = found ? `✅ ${val} está no recibo` : `❌ ${val} não está no recibo`;
}

// ── Save: substitui APENAS a milhar no content, nada mais ──
async function saveReceipt() {
  if (!currentDoc) return;
  const nova = document.getElementById('novaMilharInput').value.trim();
  if (nova.length !== 4 || !/^\d{4}$/.test(nova)) {
    showToast('Digite exatamente 4 dígitos.', 'err'); return;
  }

  const milharAtual = extractMilhar(currentDoc.data.content || '');
  if (!milharAtual) {
    showToast('Nenhuma milhar encontrada no recibo.', 'err'); return;
  }
  if (milharAtual === nova) {
    showToast('A milhar já é essa.', 'err'); return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Salvando…';

  try {
    // Substitui só a milhar — word-boundary garante que não troca números maiores que contenham ela
    const novoContent = currentDoc.data.content.replace(
      new RegExp(`\\b${milharAtual}\\b`),
      nova
    );

    // Só atualiza o campo content — createdAt, expiresAt, isPaid, tipo ficam intactos
    await db.collection('receipts').doc(currentDoc.id).update({ content: novoContent });

    // Atualiza cache local
    const idx = allReceipts.findIndex(r => r.id === currentDoc.id);
    if (idx !== -1) allReceipts[idx].data.content = novoContent;

    showToast('✅ Milhar alterada!', 'ok');
    closeEditor();
    renderList(allReceipts);
  } catch(e) {
    showToast('Erro: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Salvar';
  }
}

// ── Toast ──
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}

document.getElementById('editorOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditor();
});
</script>
</body>
</html>
