<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d11" />
  <title>Admin — VipMojs</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:      #0b0d11;
      --surface: #13161d;
      --card:    #181c25;
      --border:  #1e2330;
      --accent:  #f5c842;
      --green:   #3dd68c;
      --danger:  #e05c5c;
      --text:    #e8eaf0;
      --muted:   #5a6080;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Syne', sans-serif;
      --r:       10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    /* ─── LOGIN ─── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
    }
    .login-box h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .login-box p  { color: var(--muted); font-size: 0.82rem; margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .field input:focus { border-color: var(--accent); }
    #loginError { color: var(--danger); font-size: 0.8rem; min-height: 16px; margin-top: -6px; font-family: var(--mono); }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: var(--r);
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px 18px;
      transition: opacity .15s, transform .1s;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; width: 100%; margin-top: 6px; }
    .btn-green   { background: var(--green); color: #000; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-sm      { padding: 8px 14px; font-size: 0.8rem; }
    .btn-xs      { padding: 5px 10px; font-size: 0.72rem; }

    /* ─── APP SHELL ─── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .logo { font-size: 1rem; font-weight: 800; color: var(--accent); letter-spacing: -.3px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ─── TOOLBAR ─── */
    .toolbar {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .toolbar input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.88rem;
      padding: 10px 12px 10px 34px;
      outline: none;
      -webkit-appearance: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .counter { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

    /* ─── CARDS LIST ─── */
    .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

    .receipt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-id {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }
    .card-date {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-active  { background: #1a3a28; color: var(--green); border: 1px solid #2a5a38; }
    .badge-expired { background: #2a1a1a; color: var(--danger); border: 1px solid #4a2222; }

    .milhares-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .milhar-chip {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(245,200,66,.08);
      border: 1px solid rgba(245,200,66,.2);
      border-radius: 6px;
      padding: 3px 8px;
    }
    .milhar-chip.highlight {
      background: rgba(245,200,66,.3);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    /* ─── OVERLAY / MODAL ─── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      display: flex;
      flex-direction: column;
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    .modal-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-header h2 { font-size: 1rem; font-weight: 800; }
    .modal-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .modal-meta strong { color: var(--text); }

    .modal-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }

    /* ─── MILHAR SEARCH ─── */
    .milhar-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .milhar-search-wrap {
      flex: 1;
      position: relative;
    }
    .milhar-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #milharSearch {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1rem;
      padding: 10px 12px 10px 34px;
      letter-spacing: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    #milharSearch:focus { border-color: var(--accent); }
    #milharSearchResult {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 8px;
      display: none;
    }
    #milharSearchResult.found    { background: rgba(61,214,140,.1); color: var(--green); border: 1px solid rgba(61,214,140,.3); }
    #milharSearchResult.notfound { background: rgba(224,92,92,.1);  color: var(--danger); border: 1px solid rgba(224,92,92,.3); }

    /* ─── MILHAR GRID ─── */
    .section-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .milhar-grid { display: flex; flex-wrap: wrap; gap: 7px; }

    .milhar-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--accent);
      padding: 6px 10px;
    }
    .milhar-tag.search-match {
      border-color: var(--accent);
      background: rgba(245,200,66,.1);
    }
    .milhar-tag button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 0 0 2px;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    .milhar-tag button:active { color: var(--danger); }

    /* ─── ADD ROW ─── */
    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 1.1rem;
      padding: 10px 12px;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    .add-row input:focus { border-color: var(--green); }

    /* ─── FOOTER ─── */
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-footer .btn { flex: 1; }

    /* ─── EMPTY / LOADING ─── */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 18px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text);
      z-index: 999;
      opacity: 0;
      white-space: nowrap;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok  { border-color: var(--green);  color: var(--green); }
    #toast.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🎰 Admin VIP</h1>
    <p>Gestão de recibos</p>
    <div class="field">
      <label>EMAIL</label>
      <input type="email" id="loginEmail" placeholder="admin@email.com" autocomplete="username" />
    </div>
    <div class="field">
      <label>SENHA</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <span class="logo">🎰 Admin VIP</span>
    <div class="user-chip">
      <span id="userEmail"></span>
      <button class="btn btn-ghost btn-xs" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar recibo…" oninput="filterReceipts()" />
    </div>
    <button class="btn btn-ghost btn-sm" onclick="loadReceipts()">↻</button>
    <span class="counter" id="counter">—</span>
  </div>

  <div class="list" id="receiptsList">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
</div>

<!-- EDITOR -->
<div class="overlay" id="editorOverlay">
  <div class="modal" id="editorModal">
    <div class="modal-handle"></div>

    <div class="modal-header">
      <h2>✏️ Editar Milhares</h2>
      <div class="modal-meta" id="modalMeta"></div>
    </div>

    <div class="modal-body">

      <!-- busca de milhar -->
      <div>
        <div class="section-label">BUSCAR MILHAR</div>
        <div class="milhar-search-row">
          <div class="milhar-search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="milharSearch" maxlength="4" placeholder="0000"
                   oninput="this.value=this.value.replace(/\D/g,''); searchMilhar()" />
          </div>
          <div id="milharSearchResult"></div>
        </div>
      </div>

      <!-- grid de milhares -->
      <div>
        <div class="section-label" id="milharCountLabel">MILHARES</div>
        <div class="milhar-grid" id="milharGrid"></div>
      </div>

      <!-- adicionar -->
      <div>
        <div class="section-label">ADICIONAR MILHAR</div>
        <div class="add-row">
          <input type="text" id="newMilharInput" maxlength="4" placeholder="0000" inputmode="numeric"
                 oninput="this.value=this.value.replace(/\D/g,'')"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();addMilhar();}" />
          <button class="btn btn-ghost btn-sm" onclick="addMilhar()">+ Add</button>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditor()">Cancelar</button>
      <button class="btn btn-green" id="saveBtn" onclick="saveReceipt()">💾 Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyB7tyWt4UlivjnJVevkXDZ1wwgPrzV1hvc",
  authDomain: "meus-recibos-vip.firebaseapp.com",
  projectId: "meus-recibos-vip",
  storageBucket: "meus-recibos-vip.firebasestorage.app",
  messagingSenderId: "254959368683",
  appId: "1:254959368683:web:80676a26f614040df6c1ae"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── State ──
let allReceipts = [];
let currentDoc  = null;
let currentMilhares = [];

// ── Auth ──
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email.split('@')[0];
    loadReceipts();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginError');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = 'Email ou senha inválidos.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
function doLogout() { auth.signOut(); }

// ── Load ──
async function loadReceipts() {
  document.getElementById('receiptsList').innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  document.getElementById('counter').textContent = '…';
  try {
    const snap = await db.collection('receipts').orderBy('createdAt', 'desc').limit(200).get();
    allReceipts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    renderList(allReceipts);
  } catch(e) {
    document.getElementById('receiptsList').innerHTML = `<div class="empty-state">Erro: ${e.message}</div>`;
  }
}

// ── Render cards ──
function renderList(list) {
  document.getElementById('counter').textContent = `${list.length}`;
  const container = document.getElementById('receiptsList');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">Nenhum recibo encontrado.</div>';
    return;
  }

  const searchQ = (document.getElementById('milharSearch') ? '' : '');

  container.innerHTML = list.map(({ id, data }) => {
    const created = data.createdAt ? data.createdAt.toDate() : null;
    const dateStr = created
      ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
      : '—';
    const expires = data.expiresAt
      ? (data.expiresAt.toDate ? data.expiresAt.toDate() : new Date(data.expiresAt))
      : null;
    const expired = expires && expires < new Date();
    const badge = expired
      ? '<span class="badge badge-expired">Expirado</span>'
      : '<span class="badge badge-active">Ativo</span>';

    const milhares = extractMilhares(data.content || '');
    const chips = milhares.slice(0, 20).map(m =>
      `<span class="milhar-chip">${m}</span>`
    ).join('') + (milhares.length > 20 ? `<span class="milhar-chip">+${milhares.length-20}</span>` : '');

    const clientLink = `https://meus-recibos-vip.web.app/recibo.html?id=${id}`;

    return `
      <div class="receipt-card">
        <div class="card-row">
          <span class="card-id">${id.substring(0,16)}…</span>
          ${badge}
        </div>
        <div class="card-date">📅 ${dateStr} &nbsp;·&nbsp; ${milhares.length} milhar(es)</div>
        <div class="milhares-wrap">${chips || '<span style="color:var(--muted);font-size:.75rem;font-family:var(--mono)">sem milhares</span>'}</div>
        <div class="card-row" style="gap:8px">
          <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEditor('${id}')">✏️ Editar Milhares</button>
          <a href="${clientLink}" target="_blank" class="btn btn-ghost btn-sm">🔗 Ver</a>
        </div>
      </div>`;
  }).join('');
}

// ── Search list ──
function filterReceipts() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { renderList(allReceipts); return; }
  renderList(allReceipts.filter(({ id, data }) =>
    id.toLowerCase().includes(q) || (data.content || '').toLowerCase().includes(q)
  ));
}

// ── Extract milhares (4-digit numbers) ──
function extractMilhares(content) {
  const matches = content.match(/\b\d{4}\b/g) || [];
  return [...new Set(matches)];
}

// ── Open editor ──
function openEditor(id) {
  const rec = allReceipts.find(r => r.id === id);
  if (!rec) return;
  currentDoc = rec;
  currentMilhares = extractMilhares(rec.data.content || '');

  const created = rec.data.createdAt ? rec.data.createdAt.toDate() : null;
  const dateStr = created
    ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
    : '—';

  document.getElementById('modalMeta').innerHTML =
    `<span><strong>${id.substring(0,16)}…</strong></span><span>📅 ${dateStr}</span>`;

  document.getElementById('milharSearch').value = '';
  document.getElementById('milharSearchResult').style.display = 'none';
  document.getElementById('milharSearchResult').className = '';
  document.getElementById('newMilharInput').value = '';
  renderMilharGrid();
  document.getElementById('editorOverlay').classList.add('open');

  // scroll to top of modal
  document.getElementById('editorModal').scrollTop = 0;
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('open');
  currentDoc = null;
  currentMilhares = [];
}

// ── Milhar grid ──
function renderMilharGrid() {
  const searchVal = document.getElementById('milharSearch').value.padStart(4,'0');
  const doHighlight = document.getElementById('milharSearch').value.length === 4;
  document.getElementById('milharCountLabel').textContent = `MILHARES (${currentMilhares.length})`;
  document.getElementById('milharGrid').innerHTML = currentMilhares.map((m, i) => {
    const highlight = doHighlight && m === searchVal ? ' search-match' : '';
    return `
      <div class="milhar-tag${highlight}">
        ${m}
        <button onclick="removeMilhar(${i})" aria-label="Remover ${m}">✕</button>
      </div>`;
  }).join('');
}

function removeMilhar(index) {
  currentMilhares.splice(index, 1);
  renderMilharGrid();
}

function addMilhar() {
  const input = document.getElementById('newMilharInput');
  const val = input.value.trim().padStart(4, '0');
  if (!/^\d{4}$/.test(val)) { showToast('Digite 4 dígitos.', 'err'); return; }
  if (currentMilhares.includes(val)) { showToast('Já existe.', 'err'); return; }
  currentMilhares.push(val);
  input.value = '';
  renderMilharGrid();
  input.focus();
}

// ── Search within editor ──
function searchMilhar() {
  const raw = document.getElementById('milharSearch').value;
  const result = document.getElementById('milharSearchResult');

  if (raw.length < 4) {
    result.style.display = 'none';
    renderMilharGrid();
    return;
  }

  const val = raw.padStart(4,'0');
  const found = currentMilhares.includes(val);
  result.style.display = '';
  result.className = found ? 'found' : 'notfound';
  result.textContent = found ? `✅ ${val} presente` : `❌ ${val} não encontrada`;
  renderMilharGrid(); // highlights match
}

// ── Save: surgical replace only the 4-digit numbers, nothing else ──
async function saveReceipt() {
  if (!currentDoc) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Salvando…';

  try {
    const originalContent = currentDoc.data.content || '';
    const originalMilhares = extractMilhares(originalContent);

    // Build new content by replacing old milhares positions with new ones
    const newContent = rebuildContent(originalContent, originalMilhares, currentMilhares);

    // Update ONLY the content field — everything else (createdAt, expiresAt, isPaid, tipo) stays untouched
    await db.collection('receipts').doc(currentDoc.id).update({ content: newContent });

    // Update local cache
    const idx = allReceipts.findIndex(r => r.id === currentDoc.id);
    if (idx !== -1) allReceipts[idx].data.content = newContent;

    showToast('✅ Salvo!', 'ok');
    closeEditor();
    renderList(allReceipts);
  } catch(e) {
    showToast('Erro: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Salvar';
  }
}

/**
 * Replaces old 4-digit numbers with new ones in the content string.
 * Strategy: replace each occurrence of an old milhar (word-boundary) with its
 * new counterpart at the same index. Extra new ones are appended after the last
 * existing milhar on the same line. Removed ones are deleted.
 * All other content (text, dates, emojis) is untouched.
 */
function rebuildContent(content, oldList, newList) {
  let result = content;

  const maxLen = Math.max(oldList.length, newList.length);

  // Track which old values already processed (avoid double-replace if duplicate)
  const done = new Set();

  for (let i = 0; i < maxLen; i++) {
    const oldVal = oldList[i];
    const newVal = newList[i];

    if (oldVal && newVal) {
      // Replace this old milhar with new one (first unprocessed occurrence)
      if (!done.has(oldVal)) {
        result = result.replace(new RegExp(`\\b${oldVal}\\b`, 'g'), `__PLACEHOLDER_${i}__`);
        done.add(oldVal);
      }
    } else if (oldVal && !newVal) {
      // Remove old milhar
      if (!done.has(oldVal)) {
        result = result.replace(new RegExp(`\\s*\\b${oldVal}\\b`, 'g'), '');
        done.add(oldVal);
      }
    }
  }

  // Resolve placeholders → new values
  for (let i = 0; i < oldList.length; i++) {
    if (newList[i]) {
      result = result.replace(new RegExp(`__PLACEHOLDER_${i}__`, 'g'), newList[i]);
    } else {
      result = result.replace(new RegExp(`\\s*__PLACEHOLDER_${i}__`, 'g'), '');
    }
  }

  // Append extras (new milhares beyond old list length)
  if (newList.length > oldList.length) {
    const extras = newList.slice(oldList.length).join(' ');
    // Try to append after last 4-digit number in the content
    if (/\b\d{4}\b/.test(result)) {
      result = result.replace(/(\b\d{4}\b)(?![\s\S]*\b\d{4}\b)/, `$1 ${extras}`);
    } else {
      result += '\n' + extras;
    }
  }

  return result;
}

// ── Toast ──
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}

// Close on outside click
document.getElementById('editorOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditor();
});
</script>
