<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — VipMojs</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0d11;
      --surface: #13161d;
      --border: #1e2330;
      --accent: #f5c842;
      --accent2: #3dd68c;
      --danger: #e05c5c;
      --text: #e8eaf0;
      --muted: #5a6080;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 24px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-box h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 28px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      text-align: left;
    }

    .field label { font-size: 0.78rem; color: var(--muted); font-family: var(--mono); }

    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 11px 20px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #000; width: 100%; margin-top: 4px; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-save    { background: var(--accent2); color: #000; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-sm      { padding: 6px 14px; font-size: 0.78rem; }

    #loginError {
      color: var(--danger);
      font-size: 0.82rem;
      min-height: 18px;
      margin-top: -8px;
    }

    /* ── APP SHELL ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.4px;
    }

    header .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toolbar input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.88rem;
      padding: 9px 14px;
      outline: none;
    }

    .toolbar input:focus { border-color: var(--accent); }

    .counter {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── TABLE ── */
    .table-wrap {
      flex: 1;
      overflow-x: auto;
      padding: 0 24px 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .receipt-id {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .receipt-date {
      font-family: var(--mono);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-active   { background: #1a3a28; color: var(--accent2); border: 1px solid #2a6040; }
    .badge-expired  { background: #2a1a1a; color: var(--danger); border: 1px solid #4a2a2a; }

    .milhares-preview {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      max-width: 280px;
      word-break: break-word;
      line-height: 1.6;
    }

    .actions { display: flex; gap: 8px; align-items: center; white-space: nowrap; }

    .link-btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    .link-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── MODAL EDITOR ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal h2 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .modal-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .modal-meta span strong { color: var(--text); }

    .editor-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* ── MILHARES EDITOR ── */
    .milhar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .milhar-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      padding: 5px 10px;
      cursor: default;
      transition: border-color 0.15s;
    }

    .milhar-tag:hover { border-color: var(--danger); }

    .milhar-tag button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }

    .milhar-tag button:hover { color: var(--danger); }

    .add-milhar-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .add-milhar-row input {
      width: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 7px 12px;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
    }

    .add-milhar-row input:focus { border-color: var(--accent); }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    /* ── CONTENT EDITOR ── */
    .content-textarea {
      width: 100%;
      min-height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }

    .content-textarea:focus { border-color: var(--accent); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 0.85rem;
      font-family: var(--mono);
      color: var(--text);
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok   { border-color: var(--accent2); color: var(--accent2); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }

    /* ── LOADING ── */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.85rem;
    }

    /* ── TABS (mode selector) ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }

    .tab {
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: var(--mono);
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: none;
      transition: background 0.15s, color 0.15s;
    }

    .tab.active { background: var(--surface); color: var(--text); }

    @media (max-width: 600px) {
      .table-wrap { padding: 0 12px 20px; }
      .toolbar { padding: 12px; }
      header { padding: 12px; }
      .modal { padding: 18px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🎰 Admin VIP</h1>
    <p>Painel de gestão de recibos</p>

    <div class="field">
      <label>EMAIL</label>
      <input type="email" id="loginEmail" placeholder="admin@email.com" autocomplete="username" />
    </div>
    <div class="field">
      <label>SENHA</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <header>
    <span class="logo">🎰 Admin VIP</span>
    <div class="user-info">
      <span id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Buscar por ID, milhar, código…" oninput="filterReceipts()" />
    <button class="btn btn-ghost btn-sm" onclick="loadReceipts()">↻ Atualizar</button>
    <span class="counter" id="counter">—</span>
  </div>

  <div class="table-wrap">
    <table id="receiptsTable">
      <thead>
        <tr>
          <th>ID / Criado em</th>
          <th>Status</th>
          <th>Milhares</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="receiptsBody">
        <tr><td colspan="4" class="empty-state"><span class="spinner"></span></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── EDITOR MODAL ── -->
<div class="overlay" id="editorOverlay">
  <div class="modal">
    <div>
      <h2>✏️ Editar Recibo</h2>
      <div class="modal-meta" id="modalMeta"></div>
    </div>

    <div>
      <div class="editor-label">MILHARES (clique no ✕ para remover)</div>
      <div class="milhar-grid" id="milharGrid"></div>
      <div class="add-milhar-row" style="margin-top:12px">
        <input type="text" id="newMilharInput" maxlength="4" placeholder="0000"
               onkeydown="if(event.key==='Enter') addMilhar()" oninput="this.value=this.value.replace(/\D/g,'')" />
        <button class="btn btn-ghost btn-sm" onclick="addMilhar()">+ Adicionar</button>
      </div>
    </div>

    <div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('milhares',this)">Editar Milhares</button>
        <button class="tab" onclick="switchTab('raw',this)">Conteúdo Raw</button>
      </div>
    </div>

    <div id="tabMilhares" style="display:none"><!-- handled above --></div>

    <div id="tabRaw" style="display:none">
      <div class="editor-label">CONTEÚDO COMPLETO DO RECIBO</div>
      <textarea class="content-textarea" id="rawContent" rows="12"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditor()">Cancelar</button>
      <button class="btn btn-save" id="saveBtn" onclick="saveReceipt()">💾 Salvar Alterações</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyB7tyWt4UlivjnJVevkXDZ1wwgPrzV1hvc",
  authDomain: "meus-recibos-vip.firebaseapp.com",
  projectId: "meus-recibos-vip",
  storageBucket: "meus-recibos-vip.firebasestorage.app",
  messagingSenderId: "254959368683",
  appId: "1:254959368683:web:80676a26f614040df6c1ae"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── State ──
let allReceipts = [];
let currentDoc  = null; // { id, data }
let currentMilhares = [];
let currentTab = 'milhares';

// ── Auth ──
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email;
    loadReceipts();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginError');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = 'Email ou senha inválidos.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() { auth.signOut(); }

// ── Load receipts ──
async function loadReceipts() {
  document.getElementById('receiptsBody').innerHTML =
    '<tr><td colspan="4" class="empty-state"><span class="spinner"></span></td></tr>';
  document.getElementById('counter').textContent = '…';

  try {
    const snap = await db.collection('receipts').orderBy('createdAt', 'desc').limit(200).get();
    allReceipts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    renderTable(allReceipts);
  } catch(e) {
    console.error(e);
    document.getElementById('receiptsBody').innerHTML =
      `<tr><td colspan="4" class="empty-state">Erro ao carregar: ${e.message}</td></tr>`;
  }
}

// ── Render ──
function renderTable(list) {
  document.getElementById('counter').textContent = `${list.length} recibo(s)`;
  const tbody = document.getElementById('receiptsBody');

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhum recibo encontrado.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(({ id, data }) => {
    const created = data.createdAt ? data.createdAt.toDate() : null;
    const dateStr = created
      ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
      : '—';

    const expires = data.expiresAt ? (data.expiresAt.toDate ? data.expiresAt.toDate() : new Date(data.expiresAt)) : null;
    const isExpired = expires && expires < new Date();
    const statusBadge = isExpired
      ? '<span class="badge badge-expired">Expirado</span>'
      : '<span class="badge badge-active">Ativo</span>';

    const milhares = extractMilhares(data.content || '');
    const milharesPreview = milhares.length
      ? milhares.slice(0, 12).join(' ') + (milhares.length > 12 ? ` +${milhares.length - 12}` : '')
      : '<span style="color:var(--muted)">—</span>';

    const clientLink = `https://meus-recibos-vip.web.app/recibo.html?id=${id}`;

    return `
      <tr data-id="${id}">
        <td>
          <div class="receipt-id">${id.substring(0,12)}…</div>
          <div class="receipt-date">${dateStr}</div>
        </td>
        <td>${statusBadge}</td>
        <td>
          <div class="milhares-preview">${milharesPreview}</div>
          <div style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);margin-top:4px">${milhares.length} milhar(es)</div>
        </td>
        <td>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="openEditor('${id}')">✏️ Editar</button>
            <a class="link-btn" href="${clientLink}" target="_blank">🔗 Ver</a>
          </div>
        </td>
      </tr>`;
  }).join('');
}

// ── Search ──
function filterReceipts() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { renderTable(allReceipts); return; }
  const filtered = allReceipts.filter(({ id, data }) => {
    return id.toLowerCase().includes(q) ||
           (data.content || '').toLowerCase().includes(q);
  });
  renderTable(filtered);
}

// ── Extract milhares from content text ──
function extractMilhares(content) {
  // Find all 4-digit sequences in the content
  const matches = content.match(/\b\d{4}\b/g) || [];
  // Deduplicate while preserving order
  return [...new Set(matches)];
}

// ── Open editor ──
function openEditor(id) {
  const rec = allReceipts.find(r => r.id === id);
  if (!rec) return;

  currentDoc = rec;
  currentMilhares = extractMilhares(rec.data.content || '');

  const created = rec.data.createdAt ? rec.data.createdAt.toDate() : null;
  const dateStr = created
    ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(created)
    : '—';

  document.getElementById('modalMeta').innerHTML = `
    <span><strong>ID:</strong> ${id}</span>
    <span><strong>Criado:</strong> ${dateStr}</span>
    <span><strong>Milhares:</strong> ${currentMilhares.length}</span>
  `;

  document.getElementById('rawContent').value = rec.data.content || '';
  renderMilharGrid();
  switchTab('milhares', document.querySelector('.tab.active') || document.querySelector('.tab'));
  document.getElementById('editorOverlay').classList.add('open');
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('open');
  currentDoc = null;
  currentMilhares = [];
}

// ── Milhar grid ──
function renderMilharGrid() {
  const grid = document.getElementById('milharGrid');
  grid.innerHTML = currentMilhares.map((m, i) => `
    <div class="milhar-tag">
      ${m}
      <button onclick="removeMilhar(${i})" title="Remover">✕</button>
    </div>
  `).join('');
}

function removeMilhar(index) {
  currentMilhares.splice(index, 1);
  renderMilharGrid();
}

function addMilhar() {
  const input = document.getElementById('newMilharInput');
  const val = input.value.trim().padStart(4, '0');
  if (val.length !== 4 || !/^\d{4}$/.test(val)) {
    showToast('Digite exatamente 4 dígitos.', 'err'); return;
  }
  if (currentMilhares.includes(val)) {
    showToast('Milhar já está na lista.', 'err'); return;
  }
  currentMilhares.push(val);
  input.value = '';
  renderMilharGrid();
  input.focus();
}

// ── Tabs ──
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const milharSection = document.getElementById('milharGrid').closest('div');
  const addRow = document.querySelector('.add-milhar-row');
  const rawSection = document.getElementById('tabRaw');

  if (tab === 'milhares') {
    milharSection.style.display = '';
    addRow.style.display = '';
    rawSection.style.display = 'none';
  } else {
    milharSection.style.display = 'none';
    addRow.style.display = 'none';
    rawSection.style.display = '';
  }
}

// ── Save ──
async function saveReceipt() {
  if (!currentDoc) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Salvando…';

  try {
    let newContent;

    if (currentTab === 'raw') {
      // Save raw content directly
      newContent = document.getElementById('rawContent').value;
    } else {
      // Rebuild content: replace all 4-digit numbers with the new list
      const originalContent = currentDoc.data.content || '';
      const originalMilhares = extractMilhares(originalContent);

      if (originalMilhares.length === 0) {
        // Content has no milhares pattern; just append them
        newContent = originalContent + '\n\nMilhares: ' + currentMilhares.join(' ');
      } else {
        // Replace original milhares with new ones, keeping content structure
        // Strategy: replace the block of 4-digit numbers preserving surrounding text
        newContent = rebuildContent(originalContent, originalMilhares, currentMilhares);
      }
    }

    await db.collection('receipts').doc(currentDoc.id).update({ content: newContent });

    // Update local cache
    const idx = allReceipts.findIndex(r => r.id === currentDoc.id);
    if (idx !== -1) allReceipts[idx].data.content = newContent;

    showToast('✅ Recibo atualizado!', 'ok');
    closeEditor();
    renderTable(allReceipts);
  } catch(e) {
    console.error(e);
    showToast('Erro ao salvar: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Salvar Alterações';
  }
}

// Replace old milhares with new set in the content string
function rebuildContent(content, oldMilhares, newMilhares) {
  // Find position of first and last old milhar occurrence
  // Simple approach: replace each occurrence of an old milhar if it's a standalone 4-digit word
  let result = content;
  const replaced = new Set();

  // First pass: replace matching old → new (1-to-1 mapping)
  for (let i = 0; i < Math.min(oldMilhares.length, newMilhares.length); i++) {
    const old = oldMilhares[i];
    if (!replaced.has(old)) {
      result = result.replace(new RegExp(`\\b${old}\\b`, 'g'), newMilhares[i] || old);
      replaced.add(old);
    }
  }

  // If new list is longer: append extras after last milhar occurrence
  if (newMilhares.length > oldMilhares.length) {
    const extras = newMilhares.slice(oldMilhares.length).join(' ');
    // Find last 4-digit number position and append after the line
    result = result.replace(/(\b\d{4}\b)(\s*\n|$)(?!.*\b\d{4}\b)/s, `$1 ${extras}$2`);
  }

  // If new list is shorter: remove old milhares that weren't replaced
  if (oldMilhares.length > newMilhares.length) {
    for (let i = newMilhares.length; i < oldMilhares.length; i++) {
      const old = oldMilhares[i];
      if (!replaced.has(old)) {
        result = result.replace(new RegExp(`\\s*\\b${old}\\b`, 'g'), '');
        replaced.add(old);
      }
    }
  }

  return result;
}

// ── Toast ──
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// Close overlay on outside click
document.getElementById('editorOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditor();
});
