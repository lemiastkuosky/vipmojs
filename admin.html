<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Admin</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* Estilos base (mantidos para consistência) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            padding: 16px;
            line-height: 1.5; /* Melhor legibilidade */
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        h3 { font-size: 1.1rem; margin-bottom: 15px; }
        main { max-width: 900px; margin: 0 auto; }

        /* Botões */
        button {
            padding: 10px 15px; /* Ajuste no padding */
            font-size: 0.9rem;  /* Leve redução */
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            line-height: 1.2; /* Para botões com mais texto */
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:active { transform: scale(0.98); }
        .save-button { background-color: #28a745; color: white; }
        .save-button:active { background-color: #218838; }
        .import-btn { background-color: #dc3545; color: white; }
        .import-btn:active { background-color: #a71d2a; }
        .load-button { background-color: #6c757d; color: white; }
        .load-button:active { background-color: #5a6268; }
        .info-button { background-color: #17a2b8; color: white; } /* Azul claro */
        .info-button:active { background-color: #138496; }
        .warning-button { background-color: #ffc107; color: #343a40; } /* Amarelo */
        .warning-button:active { background-color: #e0a800; }

        /* Modal de Login */
        .login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .login-box {
            background-color: #2a2a2a; padding: 25px; border-radius: 10px;
            text-align: center; color: white; max-width: 400px; width: 90%;
            border: 1px solid #444;
        }
        .login-box input {
            padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #444;
            background-color: #1e1e1e; color: white; text-align: center;
            width: 100%; margin-bottom: 15px;
        }
        .login-box button { width: 100%; }
        .login-box .error-message { color: #ff4d4d; margin-top: 15px; min-height: 1.2em; font-weight: bold; }

        /* Filtro de Busca */
        .search-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-container input[type="search"] {
            flex-grow: 1;
            padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #444;
            background-color: #1e1e1e; color: white;
        }

        /* Lista de Usuários */
        .user-list { display: flex; flex-direction: column; gap: 15px; }
        .user-card {
            background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px;
            padding: 15px; display: flex; flex-wrap: wrap; justify-content: space-between;
            align-items: flex-start; /* Alinha no topo para melhor visualização */
            gap: 15px;
        }
        .user-info { flex-grow: 1; min-width: 250px; /* Aumentado um pouco */ }
        .user-info p { margin-bottom: 8px; word-break: break-all; }
        .user-info strong { color: #aaa; min-width: 120px; display: inline-block; } /* Alinha os "títulos" */
        .user-actions {
            flex-shrink: 0; display: flex; flex-direction: column; /* Botões empilhados */
            gap: 8px; align-items: stretch; /* Estica os botões */
        }
        .user-actions button {
             width: 140px; /* Largura ajustada */
             text-align: center;
        }
        .status-active { font-weight: bold; color: #28a745; }
        .status-pending { font-weight: bold; color: #ffc107; }
        .device-count { font-size: 1.1rem; font-weight: bold; color: #4da3ff; } /* Tamanho ajustado */
        .no-users-message { text-align: center; color: #aaa; margin-top: 20px; }

        /* Estilos para lista de dispositivos e observações */
        .device-list {
            list-style: none; padding-left: 15px; margin-top: 5px; font-size: 0.85rem; color: #ccc;
        }
        .user-notes {
            font-size: 0.9rem; color: #bbb; margin-top: 8px; font-style: italic;
            background-color: rgba(255, 255, 255, 0.05); padding: 5px 8px; border-radius: 4px;
        }

        /* Modal Genérico (para Notas) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 1050; padding: 20px;
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: #2a2a2a; color: #f0f0f0; padding: 25px;
            border-radius: 10px; width: 100%; max-width: 500px;
            position: relative; border: 1px solid #444;
        }
        .modal-content textarea {
            width: 100%; min-height: 100px; padding: 10px; font-size: 1rem;
            border-radius: 8px; border: 1px solid #444; background-color: #1e1e1e;
            color: white; margin-bottom: 15px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .close-modal-btn {
             position: absolute; top: 10px; right: 10px; background: none; border: none;
             font-size: 24px; color: #aaa; cursor: pointer; padding: 5px; line-height: 1;
        }

        /* Toast Notifications (Simples) */
        #toast-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .toast {
            background-color: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 0.9rem; opacity: 0;
            transition: opacity 0.5s, transform 0.5s; transform: translateY(20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: rgba(40, 167, 69, 0.9); }
        .toast.error { background-color: rgba(220, 53, 69, 0.9); }
        .toast.info { background-color: rgba(23, 162, 184, 0.9); }

    </style>
</head>
<body>

    <div id="adminLoginModal" class="login-modal">
        <div class="login-box">
            <h2>Login do Administrador</h2>
            <input type="email" id="adminEmail" placeholder="Email de Admin">
            <input type="password" id="adminPassword" placeholder="Senha">
            <button id="adminLoginBtn" class="save-button" onclick="handleAdminLogin()">Entrar</button>
            <p id="adminLoginError" class="error-message"></p>
        </div>
    </div>

    <div id="adminContent" style="display: none;">
        <header>
            <h1>Usuários do Sistema</h1>
            <button id="adminLogoutBtn" class="import-btn" onclick="handleAdminLogout()">Sair</button>
        </header>
        <main>
            <div class="search-container">
                <input type="search" id="userSearchInput" placeholder="Buscar por email..." oninput="filterUsers()">
                <button class="load-button" onclick="loadUsers()">Atualizar Lista</button>
            </div>

            <h2 id="loadingMessage">Carregando usuários...</h2>
            <div id="userListContainer" class="user-list">
                </div>
            <p id="noUsersMessage" class="no-users-message" style="display: none;">Nenhum usuário encontrado.</p>
        </main>
    </div>

    <div id="notesModal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeNotesModal()">×</button>
            <h3 id="notesModalTitle">Editar Observações</h3>
            <textarea id="notesTextarea" placeholder="Digite suas observações sobre este usuário..."></textarea>
            <div class="modal-buttons">
                <button class="load-button" onclick="closeNotesModal()">Cancelar</button>
                <button class="save-button" onclick="saveNotes()">Salvar Notas</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>


    <script>
        // --- 1. CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
             apiKey: "AIzaSyB7tyWt4UlivjnJVevkXDZ1wwgPrzV1hvc", // SUA CHAVE
             authDomain: "meus-recibos-vip.firebaseapp.com",     // SEU DOMÍNIO
             projectId: "meus-recibos-vip",                  // SEU ID DE PROJETO
             storageBucket: "meus-recibos-vip.firebasestorage.app", // SEU BUCKET
             messagingSenderId: "254959368683",              // SEU SENDER ID
             appId: "1:254959368683:web:80676a26f614040df6c1ae" // SEU APP ID
        };

        // --- 2. INICIALIZAÇÃO DO FIREBASE ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const firestoreDB = firebase.firestore();
        const rtdb = firebase.database();

        // --- 3. LÓGICA DE AUTENTICAÇÃO DO ADMIN ---
        let rtdbListeners = {}; // Guarda os listeners do RTDB
        let currentEditingUserId = null; // Guarda o UID do usuário sendo editado no modal de notas

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const adminDoc = await firestoreDB.collection('admins').doc(user.uid).get();
                    if (adminDoc.exists) {
                        showAdminPanel();
                        loadUsers();
                    } else {
                        auth.signOut();
                        showLoginModal("Você não tem permissão para acessar este painel.");
                    }
                } catch (error) {
                    console.error("Erro ao verificar admin:", error);
                    auth.signOut();
                    showLoginModal("Erro ao verificar permissões.");
                }
            } else {
                showLoginModal();
                stopAllMonitors();
            }
        });

        async function handleAdminLogin() { /* ... (código mantido igual) ... */
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorP = document.getElementById('adminLoginError');
            const loginBtn = document.getElementById('adminLoginBtn');
            errorP.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verificando...';
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorP.textContent = 'Email ou senha inválidos.';
                } else { errorP.textContent = 'Erro ao tentar entrar.'; }
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        }
        function handleAdminLogout() { auth.signOut(); }

        // --- 4. LÓGICA DE GERENCIAMENTO DE USUÁRIOS ---
        async function loadUsers() {
            document.getElementById('loadingMessage').textContent = 'Carregando usuários...';
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('noUsersMessage').style.display = 'none';
            const userListContainer = document.getElementById('userListContainer');
            userListContainer.innerHTML = '';
            stopAllMonitors();

            try {
                const querySnapshot = await firestoreDB.collection('users').orderBy('createdAt', 'desc').get();

                if(querySnapshot.empty) {
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('noUsersMessage').textContent = 'Nenhum usuário registrado.';
                    document.getElementById('noUsersMessage').style.display = 'block';
                    return;
                }

                querySnapshot.forEach(doc => {
                    renderUserCard(doc.id, doc.data());
                });

                document.getElementById('loadingMessage').style.display = 'none';
                filterUsers(); // Aplica filtro inicial caso haja texto na busca

            } catch (error) {
                console.error("Erro ao carregar usuários:", error);
                document.getElementById('loadingMessage').textContent = 'Erro ao carregar usuários.';
                document.getElementById('noUsersMessage').style.display = 'none';
            }
        }

        function renderUserCard(uid, userData) {
            const userListContainer = document.getElementById('userListContainer');
            const card = document.createElement('div');
            card.className = 'user-card';
            card.dataset.email = userData.email.toLowerCase(); // Para busca

            const statusClass = userData.ativo ? 'status-active' : 'status-pending';
            const statusText = userData.ativo ? 'Ativo' : 'Pendente';
            const toggleButtonClass = userData.ativo ? 'import-btn' : 'save-button';
            const toggleButtonText = userData.ativo ? 'Desativar' : 'Aprovar';

            let createdAt = 'Data indisponível';
            if (userData.createdAt?.toDate) {
                createdAt = userData.createdAt.toDate().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
            }

            // ** NOVO: Leitura do Último Login **
            let lastLogin = 'Nunca';
            if (userData.lastLoginAt?.toDate) {
                lastLogin = userData.lastLoginAt.toDate().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
            }

            // ** NOVO: Leitura das Observações **
            const notes = userData.observacoes || ''; // Pega as notas ou string vazia

            card.innerHTML = `
                <div class="user-info">
                    <p><strong>Email:</strong> ${userData.email}</p>
                    <p><strong>Cadastrado:</strong> ${createdAt}</p>
                    <p><strong>Último Login:</strong> ${lastLogin}</p> <p><strong>Status:</strong> <span class="${statusClass}">${statusText}</span></p>
                    <div id="notes-display-${uid}">
                        ${notes ? `<p><strong>Observações:</strong> <span class="user-notes">${notes}</span></p>` : ''} </div>
                    <p>
                        <strong>Dispositivos Ativos:</strong>
                        <span class="device-count" id="devices-${uid}">?</span>
                        <ul class="device-list" id="device-list-${uid}"></ul> </p>
                </div>
                <div class="user-actions">
                    <button class="${toggleButtonClass}" onclick="toggleUserStatus('${uid}', ${userData.ativo})">
                        ${toggleButtonText}
                    </button>
                    <button class="warning-button" onclick="openNotesModal('${uid}', '${notes.replace(/'/g, "\\'")}')"> Editar Notas
                    </button>
                    <button class="info-button" onclick="sendPasswordReset('${userData.email}')">
                        Resetar Senha
                    </button>
                </div>
            `;

            userListContainer.appendChild(card);
            monitorUserSessions(uid); // Continua monitorando
        }

        async function toggleUserStatus(uid, currentStatus) { /* ... (código mantido igual) ... */
            const newStatus = !currentStatus;
            const actionText = newStatus ? 'aprovar' : 'desativar';
            if (confirm(`Tem certeza que deseja ${actionText} o usuário?`)) {
                try {
                    await firestoreDB.collection('users').doc(uid).update({ ativo: newStatus });
                    showToast(`Usuário ${actionText} com sucesso!`, 'success'); // Adiciona Toast
                    loadUsers();
                } catch (error) {
                    console.error(`Erro ao ${actionText} usuário:`, error);
                    showToast('Erro ao atualizar status.', 'error'); // Adiciona Toast
                }
            }
        }

        // ** NOVO: Função para enviar reset de senha **
        async function sendPasswordReset(email) {
            if (!email) {
                showToast('Email do usuário não encontrado.', 'error');
                return;
            }
            if (confirm(`Enviar e-mail de redefinição de senha para ${email}?`)) {
                try {
                    await auth.sendPasswordResetEmail(email);
                    showToast('E-mail de redefinição enviado!', 'success');
                } catch (error) {
                    console.error("Erro ao enviar reset de senha:", error);
                    showToast('Erro ao enviar e-mail. Verifique o console.', 'error');
                }
            }
        }

        // ** NOVO: Função de filtro **
        function filterUsers() {
            const searchTerm = document.getElementById('userSearchInput').value.toLowerCase();
            const userCards = document.querySelectorAll('.user-card');
            let visibleCount = 0;

            userCards.forEach(card => {
                const email = card.dataset.email || '';
                if (email.includes(searchTerm)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noUsersMessage').style.display = (visibleCount === 0 && userCards.length > 0) ? 'block' : 'none';
             document.getElementById('noUsersMessage').textContent = (visibleCount === 0 && userCards.length > 0) ? 'Nenhum usuário corresponde à busca.' : '';

        }

        // --- 5. LÓGICA DE MONITORAMENTO DE DISPOSITIVOS (RTDB) ---
        function monitorUserSessions(uid) {
            const userSessionsRef = rtdb.ref(`active_sessions/${uid}`);
            const listener = userSessionsRef.on('value', (snapshot) => {
                const deviceCount = snapshot.numChildren();
                const sessionsData = snapshot.val(); // Pega os dados das sessões

                const countElement = document.getElementById(`devices-${uid}`);
                const listElement = document.getElementById(`device-list-${uid}`); // Pega a lista UL

                if (countElement) { countElement.textContent = deviceCount; }

                // ** NOVO: Limpa e preenche a lista de User Agents **
                if (listElement) {
                    listElement.innerHTML = ''; // Limpa a lista anterior
                    if (sessionsData) {
                        Object.values(sessionsData).forEach(session => {
                            if (session.userAgent) {
                                const listItem = document.createElement('li');
                                // Tenta simplificar um pouco o User Agent (opcional)
                                const shortUA = session.userAgent.length > 60 ? session.userAgent.substring(0, 57) + '...' : session.userAgent;
                                listItem.textContent = `• ${shortUA}`;
                                listElement.appendChild(listItem);
                            }
                        });
                    } else if (deviceCount === 0) {
                       // listElement.innerHTML = '<li>Nenhum dispositivo ativo.</li>'; // Mensagem se não houver dispositivos
                    }
                }
            });
            rtdbListeners[uid] = listener;
        }

        function stopAllMonitors() { /* ... (código mantido igual) ... */
             for (const uid in rtdbListeners) {
                 const userSessionsRef = rtdb.ref(`active_sessions/${uid}`);
                 userSessionsRef.off('value', rtdbListeners[uid]);
             }
             rtdbListeners = {};
        }

        // --- 6. FUNÇÕES DE UI E MODAIS ---
        function showLoginModal(message = "") { /* ... (código mantido igual) ... */
             document.getElementById('adminContent').style.display = 'none';
             document.getElementById('adminLoginModal').style.display = 'flex';
             document.getElementById('adminLoginError').textContent = message;
        }
        function showAdminPanel() { /* ... (código mantido igual) ... */
            document.getElementById('adminLoginModal').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
        }

        // ** NOVO: Funções para o Modal de Notas **
        function openNotesModal(uid, currentNotes) {
            currentEditingUserId = uid; // Guarda o UID
            document.getElementById('notesModalTitle').textContent = `Observações para ${uid}`; // Mostra UID no título
            document.getElementById('notesTextarea').value = currentNotes;
            document.getElementById('notesModal').classList.add('active');
            document.getElementById('notesTextarea').focus();
        }

        function closeNotesModal() {
            document.getElementById('notesModal').classList.remove('active');
            currentEditingUserId = null; // Limpa o UID guardado
        }

        async function saveNotes() {
            if (!currentEditingUserId) return;

            const newNotes = document.getElementById('notesTextarea').value;
            const uid = currentEditingUserId; // Pega o UID guardado

            try {
                await firestoreDB.collection('users').doc(uid).update({
                    observacoes: newNotes
                });
                showToast('Observações salvas!', 'success');
                closeNotesModal();

                // Atualiza a exibição das notas no card sem recarregar tudo
                const notesDisplayDiv = document.getElementById(`notes-display-${uid}`);
                if (notesDisplayDiv) {
                     notesDisplayDiv.innerHTML = newNotes
                        ? `<p><strong>Observações:</strong> <span class="user-notes">${newNotes}</span></p>`
                        : '';
                }

            } catch (error) {
                console.error("Erro ao salvar observações:", error);
                showToast('Erro ao salvar. Tente novamente.', 'error');
            }
        }

        // ** NOVO: Função para mostrar Toasts **
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return; // Segurança
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            // Trigger reflow to enable animation
            toast.offsetHeight;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                // Remove o elemento após a animação de saída
                toast.addEventListener('transitionend', () => {
                   if (toast.parentNode === container) { // Verifica se ainda existe
                       container.removeChild(toast);
                   }
                }, { once: true });
            }, duration);
        }

    </script>
</body>
</html>
