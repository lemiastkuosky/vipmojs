<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Resultados</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS GERAIS --- */
        :root {
            --primary-color: #007bff;     
            --secondary-color: #28a745; 
            --light-gray: #f8f9fa;      
            --dark-text: #343a40;       
            --shadow: 0 4px 12px rgba(0,0,0,0.08); 
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-text);
        }
        .container {
            max-width: 500px;
            margin-top: 20px;
            background-color: transparent;
            box-shadow: none;
            padding: 0;
        }
        .header-title {
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }
        .header-title .bi {
            font-size: 0.8em;
            margin-right: 10px;
            color: var(--secondary-color); 
        }
        .card {
            border: none;
            border-radius: 12px; 
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .card-body {
            padding: 1.5rem;
        }
        .card-title-custom {
            font-weight: 600;
            font-size: 1.2rem;
            text-align: left;
            margin-bottom: 1rem;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--primary-color);
        }
        .btn-category {
            padding: 0.8rem 1rem; 
            font-weight: 600;
            border-radius: 8px; 
            font-size: 1.05rem;
            justify-content: flex-start; 
            text-align: left;
            /* Flexbox para alinhar ícone e texto */
            display: flex; 
            align-items: center;
        }
        .btn-category:hover {
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-category .bi {
            margin-right: 15px;
            font-size: 1.3em;
            width: 1.5em; /* Garante alinhamento dos textos */
            flex-shrink: 0; /* Impede que o ícone encolha */
        }
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .modal-header {
            border-bottom: 1px solid #eee;
            padding: 1rem 1.5rem;
        }
        .modal-body {
            padding: 1.5rem;
        }
        .modal-time-btn {
            font-weight: 600;
        }
        .modal-time-btn .badge {
            font-size: 0.8em;
        }
        /* Classe específica para botão de compartilhamento (atrasados) */
        .btn-share {
             display: flex; 
             align-items: center;
        }
        /* Estilos para o spinner */
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        /* Estilos para cards de resultado da consulta */
         #searchResults .card {
             background-color: #fff; /* Fundo branco para os cards de resultado */
             margin-bottom: 1rem;
         }
         #searchResults .card-header {
             font-size: 0.95rem;
             padding: 0.75rem 1.25rem;
             background-color: var(--primary-color) !important; /* Força a cor do cabeçalho */
         }
         #searchResults .list-group-item {
             font-size: 0.9rem;
             padding: 0.6rem 1.25rem;
         }
          #searchResults .card-footer {
             font-size: 0.75rem;
             padding: 0.5rem 1.25rem;
             background-color: #f8f9fa; /* Fundo cinza claro para o rodapé */
         }
    </style>
</head>
<body>
    
    <div class="container">
        
        <h1 class="header-title"><i class="bi bi-whatsapp"></i>Gerador de Mensagens</h1>
        <p class="text-muted mb-4 text-center">Selecione uma opção para gerar a mensagem ou consulte resultados salvos.</p>

        <div class="card">
            <div class="card-body">
                <h2 class="card-title-custom">Grupos Atrasados</h2>
                
                <button data-loteria="fd" data-nome="Federal" data-tipo="atrasados" class="btn btn-share btn-success w-100 btn-category">
                    <i class="bi bi-clock-history"></i>
                    Atrasados FEDERAL
                </button>
                <button data-loteria="rj" data-nome="PT Rio" data-tipo="atrasados" class="btn btn-share btn-success w-100 btn-category">
                    <i class="bi bi-clock-history"></i>
                    Atrasados PT RIO
                </button>
                <button data-loteria="lk" data-nome="Look Goiás" data-tipo="atrasados" class="btn btn-share btn-success w-100 btn-category">
                    <i class="bi bi-clock-history"></i>
                    Atrasados LOOK GOIÁS
                </button>
                <button data-loteria="ln" data-nome="Loteria Nacional" data-tipo="atrasados" class="btn btn-share btn-success w-100 btn-category">
                    <i class="bi bi-clock-history"></i>
                    Atrasados LOTERIA NACIONAL
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h2 class="card-title-custom">Resultados do Dia</h2>
        
                <button class="btn btn-primary w-100 btn-category" data-bs-toggle="modal" data-bs-target="#modalHorarios" data-loteria="rj" data-nome-loteria="PT Rio">
                    <i class="bi bi-trophy"></i>
                    Resultados PT RIO
                </button>
                <button class="btn btn-primary w-100 btn-category" data-bs-toggle="modal" data-bs-target="#modalHorarios" data-loteria="lk" data-nome-loteria="Look Goiás">
                    <i class="bi bi-trophy"></i>
                    Resultados LOOK GOIÁS
                </button>
                 <button class="btn btn-primary w-100 btn-category" data-bs-toggle="modal" data-bs-target="#modalHorarios" data-loteria="ln" data-nome-loteria="Loteria Nacional">
                    <i class="bi bi-trophy"></i>
                    Resultados LOTERIA NACIONAL
                </button>
                <button class="btn btn-primary w-100 btn-category" data-bs-toggle="modal" data-bs-target="#modalHorarios" data-loteria="fd" data-nome-loteria="Federal">
                    <i class="bi bi-trophy"></i>
                    Resultados FEDERAL
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-body">
                <h2 class="card-title-custom">Consultar Resultados Salvos</h2>

                <div class="mb-3">
                    <label for="searchDate" class="form-label">Data:</label>
                    <input type="date" id="searchDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="searchLoteria" class="form-label">Loteria (Opcional):</label>
                    <select id="searchLoteria" class="form-select">
                        <option value="">Todas</option>
                        <option value="rj">PT Rio</option>
                        <option value="lk">Look Goiás</option>
                        <option value="ln">Loteria Nacional</option>
                        <option value="fd">Federal</option>
                        </select>
                </div>

                <button id="searchButton" class="btn btn-info w-100 btn-category" style="background-color: #0dcaf0; border-color: #0dcaf0; color: #000;">
                     <i class="bi bi-search"></i>
                    Consultar Resultados
                </button>

                <div id="searchResults" class="mt-4">
                    <p id="searchPlaceholder" class="text-center text-muted">Digite a data e clique em consultar.</p>
                    <div id="searchLoading" class="text-center d-none">
                         <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                         </div>
                         <p>Buscando...</p>
                    </div>
                    </div>
            </div>
        </div>


    </div>

    <div class="modal fade" id="modalHorarios" tabindex="-1" aria-labelledby="modalHorariosLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalHorariosLabel">Escolha o horário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalHorariosBody">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

    <script>
        /**
         * === CONFIGURAÇÃO DOS SORTEIOS ===
         */
        const horariosLoterias = {
            'rj': [
                { nome: 'PTM', display: 'PTM 11:20', hora: 11, minuto: 20 },
                { nome: 'PT', display: 'PT 14:20', hora: 14, minuto: 20 },
                { nome: 'PTV', display: 'PTV 16:20', hora: 16, minuto: 20 },
                { nome: 'PTN', display: 'PTN 18:20', hora: 18, minuto: 20 },
                { nome: 'COR', display: 'CORUJA 21:20', hora: 21, minuto: 20 }
            ],
            'lk': [ 
                { nome: 'LOOK 07:00', display: 'LOOK 07:00', hora: 7, minuto: 0 }, 
                { nome: 'LOOK 09:00', display: 'LOOK 09:00', hora: 9, minuto: 0 }, 
                { nome: 'LOOK 11:00', display: 'LOOK 11:00', hora: 11, minuto: 0 },
                { nome: 'LOOK 14:00', display: 'LOOK 14:00', hora: 14, minuto: 0 },
                { nome: 'LOOK 16:00', display: 'LOOK 16:00', hora: 16, minuto: 0 },
                { nome: 'LOOK 18:00', display: 'LOOK 18:00', hora: 18, minuto: 0 },
                { nome: 'LOOK 21:00', display: 'LOOK 21:00', hora: 21, minuto: 0 },
                { nome: 'LOOK 23:00', display: 'LOOK 23:00', hora: 23, minuto: 0 } 
            ],
            'ln': [ 
                { nome: 'NACIONAL 02:00', display: 'NACIONAL 02h', hora: 2, minuto: 0 }, 
                { nome: 'NACIONAL 08:00', display: 'NACIONAL 08h', hora: 8, minuto: 0 }, 
                { nome: 'NACIONAL 10:00', display: 'NACIONAL 10h', hora: 10, minuto: 0 }, 
                { nome: 'NACIONAL 12:00', display: 'NACIONAL 12h', hora: 12, minuto: 0 }, 
                { nome: 'NACIONAL 15:00', display: 'NACIONAL 15h', hora: 15, minuto: 0 }, 
                { nome: 'NACIONAL 17:00', display: 'NACIONAL 17h', hora: 17, minuto: 0 }, 
                { nome: 'NACIONAL 20:00', display: 'NACIONAL 20h', hora: 20, minuto: 0 }, 
                { nome: 'NACIONAL 23:00', display: 'NACIONAL 23h', hora: 23, minuto: 0 } 
            ],
            'fd': [ 
                { nome: 'FEDERAL', display: 'FEDERAL (Qua/Sáb 19:00)', hora: 19, minuto: 0 }
            ]
        };

        /**
         * Função para extrair dados da tabela de ATRASADOS
         */
        function extrairDadosDoHTML(htmlString) {
            const dadosExtraidos = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlString, 'text/html');
                const linhas = doc.querySelectorAll('table.table-striped tbody tr');
                if (linhas.length === 0) { console.error("Nenhuma linha <tr> encontrada (Atrasados)."); return []; }
                linhas.forEach(linha => {
                    const celula = linha.querySelector('td');
                    if (!celula) return;
                    const textoCompleto = celula.innerText.trim();
                    const regex = /(\d+º)\s*(\p{Emoji})\s*.*?-\s*([A-Za-zÁ-ú]+)\s*(atrasado a \d+ dias|saiu \w+)/u;
                    const match = textoCompleto.match(regex);
                    if (match) {
                        const statusOriginal = match[4];
                        let statusAbreviado = '';
                        if (statusOriginal.includes('atrasado a')) { const dias = statusOriginal.replace(/\D/g, ''); statusAbreviado = `Atr. ${dias}d`; } 
                        else if (statusOriginal.includes('ontem')) { statusAbreviado = 'Ontem'; } 
                        else if (statusOriginal.includes('hoje')) { statusAbreviado = 'Hoje'; } 
                        else { statusAbreviado = statusOriginal; }
                        const item = { posicao: match[1], emoji: match[2], nome: match[3], status: statusAbreviado };
                        dadosExtraidos.push(item);
                    }
                });
            } catch (error) { console.error("Erro ao processar HTML (Atrasados):", error); return []; }
            return dadosExtraidos;
        }


        // Definição GLOBAL do mapaSorteios
        const mapaSorteios = {
                // Rio de Janeiro (RJ) 
                'PTM': 'div_display_11', 'PT': 'div_display_14', 'PTV': 'div_display_16', 'PTN': 'div_display_18', 'COR': 'div_display_21', 
                // Look Goiás (LK) 
                'LOOK 07:00': 'div_display_07', 'LOOK 09:00': 'div_display_09', 'LOOK 11:00': 'div_display_11', 'LOOK 14:00': 'div_display_14', 'LOOK 16:00': 'div_display_16', 'LOOK 18:00': 'div_display_18', 'LOOK 21:00': 'div_display_21', 'LOOK 23:00': 'div_display_23', 
                // Loteria Nacional (LN) 
                'NACIONAL 02:00': 'div_display_02', 'NACIONAL 08:00': 'div_display_08', 'NACIONAL 10:00': 'div_display_10', 'NACIONAL 12:00': 'div_display_12', 'NACIONAL 15:00': 'div_display_15', 'NACIONAL 17:00': 'div_display_17', 'NACIONAL 20:00': 'div_display_20', 'NACIONAL 23:00': 'div_display_23', 
                // Federal (FD) - PALPITE - Precisa confirmar com HTML que TENHA resultado
                'FEDERAL': 'div_display_19' // O ID '19' pode ser usado por outra loteria, ideal seria 'div_display_federal' se existir
        };

        /**
         * --- FUNÇÃO DE EXTRAIR RESULTADOS ---
         */
        function extrairDadosResultados(htmlString, nomeSorteio) {
            const dadosExtraidos = [];
            const idSorteio = mapaSorteios[nomeSorteio]; 

            if (!idSorteio) {
                console.error(`Erro interno: Mapeamento de ID não encontrado para ${nomeSorteio} dentro de extrairDadosResultados.`);
                alert(`Erro interno: Mapeamento de ID não encontrado para ${nomeSorteio}.`);
                return [];
            }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlString, 'text/html');
                const divSorteio = doc.getElementById(idSorteio);

                if (!divSorteio) {
                    // Só mostra o alerta se o mapeamento existe (evita alerta duplo)
                     if (mapaSorteios[nomeSorteio]){ 
                        console.error(`Elemento com ID "${idSorteio}" (para "${nomeSorteio}") não encontrado no HTML.`);
                        // Alerta específico para Federal, pois é o único não confirmado
                        if (nomeSorteio === 'FEDERAL') {
                             alert(`Erro: O ID ("${idSorteio}") para a FEDERAL ainda não foi confirmado. Forneça o HTML de um dia com resultado da Federal para correção.`);
                        } else {
                             alert(`Erro: O bloco de resultado para "${nomeSorteio}" (ID: ${idSorteio}) não foi encontrado no HTML recebido. A extração pode estar indisponível ou o site mudou.`);
                        }
                     }
                    return [];
                }

                const tabelaResultados = divSorteio.querySelector('table'); 
                if (!tabelaResultados) {
                    console.error(`Tabela de resultados não encontrada dentro de #${idSorteio}`);
                     alert(`Aviso: Bloco para "${nomeSorteio}" encontrado, mas a tabela interna não. Estrutura do site pode ter mudado.`);
                    return [];
                }

                const linhas = tabelaResultados.querySelectorAll('tbody tr');
                if (linhas.length === 0) {
                    console.error(`Tabela encontrada para "${nomeSorteio}", mas está vazia (sem <tr>). Resultado pode não ter saído.`);
                    return []; 
                }
                
                linhas.forEach(linha => {
                    const celulas = linha.querySelectorAll('td');
                    // Verifica se a primeira célula contém um número seguido de 'º' (ex: 1º, 10º)
                    if (celulas.length < 5 || (celulas[0] && !celulas[0].innerText.trim().match(/^\d+º$/))) {
                        return; 
                    }
                    const item = {
                        posicao: celulas[0].innerText.trim(), 
                        emoji: celulas[1].innerText.trim(),   
                        milhar: celulas[2].innerText.trim(),  
                        grupo: `${celulas[3].innerText.trim()} - ${celulas[4].innerText.trim()}`
                    };
                    dadosExtraidos.push(item);
                });

            } catch (error) { 
                console.error(`Erro ao processar o HTML dos resultados para "${nomeSorteio}":`, error);
                alert(`Ocorreu um erro ao processar os dados para ${nomeSorteio}. Verifique o console.`);
                return [];
            }
            
            // Alerta se encontrar o bloco E a tabela, mas não extrair prêmios válidos (1º-5º)
            if (dadosExtraidos.length === 0 && document.getElementById(idSorteio) && document.getElementById(idSorteio).querySelector('table')) { 
                console.warn(`Nenhum dado de prêmio (1º-5º) extraído para "${nomeSorteio}" (ID: ${idSorteio}).`);
                alert(`Aviso: O resultado para "${nomeSorteio}" foi encontrado, mas não foi possível extrair os prêmios (1º-5º). O resultado pode não ter saído ainda ou a estrutura da tabela mudou.`);
            }
            
            return dadosExtraidos;
        }


        /**
         * --- FUNÇÃO PRINCIPAL (GERAR MENSAGEM E SALVAR RESULTADO) ---
         */
        async function gerarLinkWhatsapp(botao, loteria, nomeSorteio, tipo, nomeLoteria) {
             const textoOriginal = botao.innerHTML;
            let sucessoExtracao = false; 
            let dadosParaSalvar = null; 
            let dataExtracaoParaSalvar = ''; 

            botao.disabled = true;
            if (tipo === 'resultados' && botao.querySelector('.badge')) {
                const statusBadge = botao.querySelector('.badge').outerHTML;
                botao.innerHTML = `<span>Buscando...</span> ${statusBadge}`;
            } else {
                botao.innerHTML = 'Buscando...';
            }

            const urlProxy = `/api/proxy?loteria=${loteria}&tipo=${tipo}`;

            try {
                const response = await fetch(urlProxy);
                if (!response.ok) throw new Error(`Erro no proxy: ${response.statusText} (${response.status})`); 

                const htmlTabela = await response.text();
                
                let dadosFormatados = [];
                let textoMensagem = "";
                const hoje = new Date();
                const dataFormatada = hoje.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                dataExtracaoParaSalvar = dataFormatada; 
                const horaFormatada = hoje.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                if (tipo === 'atrasados') {
                    dadosFormatados = extrairDadosDoHTML(htmlTabela);
                    if (dadosFormatados.length === 0) {
                        alert("Não foi possível extrair os dados de ATRASADOS. Verifique o console (F12).");
                        // Não retorna aqui, deixa o finally restaurar o botão
                    } else {
                        sucessoExtracao = true; 
                        textoMensagem = `📊 *Vip Análise - Atrasados* 📊\n\n`;
                        textoMensagem += `*Loteria:* ${nomeLoteria.toUpperCase()}\n`;
                        textoMensagem += `-----------------------------------\n\n`;
                        dadosFormatados.forEach(bicho => {
                            textoMensagem += `*${bicho.posicao}*: ${bicho.emoji} *${bicho.nome}* (${bicho.status})\n`;
                        });
                    }

                } else if (tipo === 'resultados') {
                    dadosFormatados = extrairDadosResultados(htmlTabela, nomeSorteio);

                    // Verifica se a extração funcionou E se o mapeamento existe
                    if (dadosFormatados.length > 0 && mapaSorteios[nomeSorteio]) { 
                        sucessoExtracao = true;
                        dadosParaSalvar = [...dadosFormatados]; 

                        const nomeCompletoSorteio = botao.dataset.nomeDisplay || nomeSorteio;

                        textoMensagem = `🌟 *Vip Resultados JB* 🌟\n\n`;
                        textoMensagem += `*Loteria:* ${nomeLoteria.toUpperCase()}\n`;
                        textoMensagem += `*Extração:* ${nomeCompletoSorteio}\n`;
                        textoMensagem += `*Data:* ${dataFormatada}\n`;
                        textoMensagem += `-----------------------------------\n\n`;

                        dadosFormatados.slice(0, 5).forEach(item => {
                            const grupoSplit = item.grupo.split(' - ');
                            const numeroGrupo = grupoSplit[0] ? grupoSplit[0].trim() : '';
                            const nomeGrupo = grupoSplit[1] ? grupoSplit[1].trim() : item.grupo;
                            textoMensagem += `*${item.posicao}* ${item.emoji}: *${item.milhar}* - (${numeroGrupo}) ${nomeGrupo}\n`;
                        });
                     } else {
                         // O alerta já foi dado dentro de extrairDadosResultados ou na verificação prévia do modal
                         console.log("Extração de resultados retornou vazio ou ID não mapeado.");
                         sucessoExtracao = false; 
                     }
                } else {
                    alert("Tipo de busca inválido.");
                    sucessoExtracao = false; 
                }

                // Só abre o WhatsApp se a extração foi bem-sucedida
                if(sucessoExtracao) {
                    textoMensagem += `\n-----------------------------------\n`;
                    textoMensagem += `📲 _Consultado em: ${dataFormatada} às ${horaFormatada}_\n\n`;
                    textoMensagem += `🍀 *Boa Sorte!* 🍀`;

                    const linkWhats = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoMensagem)}`;
                    window.open(linkWhats, '_blank');
                }

            } catch (error) {
                console.error("Falha ao chamar o proxy ou processar dados:", error);
                alert(`Ocorreu um erro geral ao buscar os dados: ${error.message}. Verifique o console.`);
                sucessoExtracao = false; 
            } finally {
                // Tenta salvar APENAS SE for resultado E a extração teve sucesso
                if (tipo === 'resultados' && sucessoExtracao && dadosParaSalvar && dadosParaSalvar.length > 0) {
                    console.log("Tentando salvar resultado no Firebase...");
                    try {
                        const saveResponse = await fetch('/api/saveResult', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                loteria: loteria,
                                nomeSorteio: nomeSorteio,
                                nomeLoteria: nomeLoteria,
                                dataExtracao: dataExtracaoParaSalvar,
                                resultados: dadosParaSalvar 
                            }),
                        });

                        const saveData = await saveResponse.json();
                        if (saveResponse.ok && saveData.success) {
                            console.log("Resultado salvo no Firebase com sucesso:", saveData.id);
                        } else {
                            throw new Error(saveData.message || 'Erro desconhecido ao salvar.');
                        }
                    } catch (saveError) {
                        console.error("Erro ao tentar salvar no Firebase:", saveError);
                        // Não mostra alerta para o usuário aqui, apenas loga.
                    }
                }

                // Sempre restaura o botão
                botao.disabled = false;
                botao.innerHTML = textoOriginal; 
            }
        }

        /**
         * --- LÓGICA PARA O MODAL (POPUP) ---
         */
        const modalHorarios = document.getElementById('modalHorarios');
        if (modalHorarios) {
            modalHorarios.addEventListener('show.bs.modal', function (event) {
                const botaoCategoria = event.relatedTarget;
                if (!botaoCategoria) return; 

                const loteria = botaoCategoria.dataset.loteria;
                const nomeLoteria = botaoCategoria.dataset.nomeLoteria;

                const modalTitle = modalHorarios.querySelector('.modal-title');
                if (modalTitle) {
                    modalTitle.textContent = `Escolha o Horário - ${nomeLoteria}`;
                }

                const modalBody = modalHorarios.querySelector('#modalHorariosBody');
                if (!modalBody) return; 
                modalBody.innerHTML = ''; 

                const horarios = horariosLoterias[loteria];

                if (!horarios || horarios.length === 0) {
                    modalBody.innerHTML = '<p>Nenhum horário configurado para esta loteria.</p>';
                    return;
                }

                const agora = new Date();

                horarios.forEach(horario => {
                    const btnHorario = document.createElement('button');
                    btnHorario.type = 'button';
                    btnHorario.className = 'btn btn-outline-secondary w-100 modal-time-btn d-flex justify-content-between align-items-center';

                    let statusBadge = '';
                    const horaSorteio = horario.hora;
                    const minutoSorteioComBuffer = horario.minuto + 5; 
                    
                    const momentoSorteio = new Date(); 
                    momentoSorteio.setHours(horaSorteio, minutoSorteioComBuffer, 0, 0); 

                    if (agora >= momentoSorteio) { 
                        statusBadge = '<span class="badge bg-success">Já Saiu!</span>';
                    } else {
                        statusBadge = '<span class="badge bg-secondary">Aguardando...</span>';
                    }

                    btnHorario.innerHTML = `<span>${horario.display}</span> ${statusBadge}`;
                    
                    btnHorario.dataset.loteria = loteria;
                    btnHorario.dataset.nome = horario.nome; 
                    btnHorario.dataset.tipo = 'resultados';
                    btnHorario.dataset.nomeLoteria = nomeLoteria;
                    btnHorario.dataset.nomeDisplay = horario.display;
                    
                    // Adiciona data-bs-dismiss APENAS se o mapeamento existir
                    if (mapaSorteios && mapaSorteios[horario.nome]) {
                        btnHorario.dataset.bsDismiss = 'modal';
                    }

                    btnHorario.addEventListener('click', function(clickEvent) { 
                        // Verifica se o mapeamento existe ANTES de chamar
                        if (typeof mapaSorteios === 'undefined' || !mapaSorteios[this.dataset.nome]) {
                             alert(`A função de extração para "${this.dataset.nomeDisplay}" ainda não foi configurada corretamente (ID não mapeado). Forneça o HTML para correção.`);
                             clickEvent.preventDefault(); 
                             clickEvent.stopPropagation(); 
                             return; 
                        }
                        gerarLinkWhatsapp(this, this.dataset.loteria, this.dataset.nome, this.dataset.tipo, this.dataset.nomeLoteria);
                    });
                    
                    modalBody.appendChild(btnHorario);
                });
            });
        } else {
             console.error("Elemento do modal com ID 'modalHorarios' não encontrado.");
        }
        

        /**
         * --- LISTENER PARA BOTÕES DE ATRASADOS ---
         */
        document.querySelectorAll('.btn-share').forEach(botao => {
            botao.addEventListener('click', function() {
                const loteria = this.dataset.loteria;
                const nomeLoteria = this.dataset.nome;
                const tipo = this.dataset.tipo;
                
                if (tipo === 'atrasados') {
                    gerarLinkWhatsapp(this, loteria, null, 'atrasados', nomeLoteria);
                }
            });
        });

        /**
         * --- LÓGICA PARA CONSULTA DE RESULTADOS ---
         */
        const searchButton = document.getElementById('searchButton');
        const searchDateInput = document.getElementById('searchDate');
        const searchLoteriaSelect = document.getElementById('searchLoteria');
        const searchResultsDiv = document.getElementById('searchResults');
        const searchPlaceholder = document.getElementById('searchPlaceholder');
        const searchLoading = document.getElementById('searchLoading');

        // Verifica se os elementos existem antes de adicionar o listener
        if (searchButton && searchDateInput && searchLoteriaSelect && searchResultsDiv && searchLoading) {
            searchButton.addEventListener('click', async () => {
                const dateValue = searchDateInput.value; // Formato YYYY-MM-DD
                const loteriaValue = searchLoteriaSelect.value;

                if (!dateValue) {
                    alert('Por favor, selecione uma data.');
                    return;
                }

                const [year, month, day] = dateValue.split('-');
                const formattedDate = `${day}/${month}/${year}`;

                searchResultsDiv.innerHTML = ''; 
                searchLoading.classList.remove('d-none'); 
                if(searchPlaceholder) searchPlaceholder.classList.add('d-none'); 


                try {
                    let apiUrl = `/api/getResultados?data=${formattedDate}`;
                    if (loteriaValue) {
                        apiUrl += `&loteria=${loteriaValue}`;
                    }

                    console.log("Chamando API de consulta:", apiUrl);
                    const response = await fetch(apiUrl);
                    const results = await response.json();

                    searchLoading.classList.add('d-none'); 

                    if (!response.ok) {
                        const errorMsg = results.message || `Erro ${response.status}: ${response.statusText}`;
                        throw new Error(errorMsg);
                    }

                    if (results.length === 0) {
                        searchResultsDiv.innerHTML = '<p class="text-center text-muted">Nenhum resultado encontrado para esta data/loteria.</p>';
                    } else {
                        // Ordena por timestampSalvo (se existir), do mais antigo para o mais novo
                        results.sort((a, b) => {
                             const timeA = a.timestampSalvo ? a.timestampSalvo._seconds : 0;
                             const timeB = b.timestampSalvo ? b.timestampSalvo._seconds : 0;
                             return timeA - timeB;
                         });

                        results.forEach(result => {
                            const cardHtml = createResultCard(result);
                            searchResultsDiv.insertAdjacentHTML('beforeend', cardHtml);
                        });
                    }

                } catch (error) {
                    console.error("Erro ao buscar resultados:", error);
                    searchLoading.classList.add('d-none'); 
                    searchResultsDiv.innerHTML = `<p class="text-center text-danger">Erro ao buscar resultados: ${error.message}. Verifique o console.</p>`;
                }
            });
        } else {
             console.error("Um ou mais elementos da interface de consulta não foram encontrados.");
        }


        // Função auxiliar para criar o HTML de cada card de resultado da consulta
        function createResultCard(result) {
            let resultHtml = `
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        <strong>${result.nomeLoteria || result.loteria.toUpperCase()}</strong> - ${result.nomeSorteio} (${result.dataExtracao})
                    </div>
                    <ul class="list-group list-group-flush">
            `;

            if (result.resultados && Array.isArray(result.resultados)) {
                 // Limita aos 5 primeiros prêmios
                result.resultados.slice(0, 5).forEach(item => {
                    // Trata caso 'grupo' não exista ou esteja mal formatado
                    const grupoSplit = item.grupo ? String(item.grupo).split(' - ') : ['', 'Grupo?'];
                    const numeroGrupo = grupoSplit[0] ? grupoSplit[0].trim() : '?';
                    const nomeGrupo = grupoSplit[1] ? grupoSplit[1].trim() : (item.grupo || '?'); // Usa item.grupo se split falhar
                    
                    resultHtml += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><strong>${item.posicao || '?'} ${item.emoji || ''}:</strong> ${item.milhar || '----'}</span>
                            <span class="badge bg-secondary rounded-pill">${numeroGrupo} - ${nomeGrupo}</span>
                        </li>
                    `;
                });
            } else {
                 resultHtml += `<li class="list-group-item text-muted">Dados de resultados indisponíveis.</li>`;
            }

            resultHtml += `
                    </ul>
                     <div class="card-footer text-muted small">
                        Salvo em: ${result.timestampSalvo && result.timestampSalvo._seconds ? new Date(result.timestampSalvo._seconds * 1000).toLocaleString('pt-BR') : 'Data indisponível'}
                     </div>
                </div>
            `;
            return resultHtml;
        }

    </script>
</body>
</html>
